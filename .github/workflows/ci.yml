name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── 1. 린트 ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff>=0.4.0

      - name: Run ruff check
        run: ruff check api/ pipeline/ models/ tests/ --output-format=github

      - name: Run ruff format check
        run: ruff format --check api/ pipeline/ models/ tests/

  # ── 2. 단위·통합 테스트 ──────────────────────────────────────────────────────
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install API dependencies
        run: pip install -r requirements.api.txt

      - name: Install test dependencies
        run: pip install -r requirements.test.txt

      - name: Run pytest with coverage
        env:
          JWT_SECRET_KEY:    test-secret-key-ci
          ADMIN_USERNAME:    admin
          ADMIN_PASSWORD:    testpassword
          ALLOWED_ORIGINS:   http://localhost
          LOG_LEVEL:         warning
        run: |
          pytest tests/ \
            --cov=api \
            --cov=pipeline/notifier.py \
            --cov=models \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            -v --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # ── 3. Docker 빌드 검증 ───────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create minimal .env for build
        run: |
          cat > .env << 'EOF'
          JWT_SECRET_KEY=ci-build-test-key
          ADMIN_USERNAME=admin
          ADMIN_PASSWORD=testpassword
          ALLOWED_ORIGINS=http://localhost
          ETL_DATA_DIR=./etl_data
          ETL_CRON_SCHEDULE=0 2 * * *
          RETRAIN_CRON_SCHEDULE=0 3 * * *
          RETRAIN_ENV_ROWS=500
          RETRAIN_PROD_ROWS=200
          LOG_LEVEL=info
          EOF

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: smart-farm-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify API container starts and /health responds
        run: |
          docker run -d \
            --name smart-farm-test \
            --env-file .env \
            -p 8000:8000 \
            smart-farm-api:ci
          # 컨테이너 시작 대기 (최대 30초)
          for i in $(seq 1 15); do
            sleep 2
            if curl -sf http://localhost:8000/health; then
              echo "✅ /health OK"
              break
            fi
            echo "  waiting... ($i/15)"
          done
          curl -sf http://localhost:8000/health | grep '"status":"ok"'
          docker stop smart-farm-test

  # ── 4. 통합 결과 요약 ─────────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test, docker-build]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.lint.result }}"         != "success" ] ||
             [ "${{ needs.test.result }}"         != "success" ] ||
             [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "❌ CI failed"
            exit 1
          fi
          echo "✅ All CI checks passed"
