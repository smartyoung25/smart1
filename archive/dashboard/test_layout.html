<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Layout Test</title>
<style>
  html, body { height: 100%; margin: 0; padding: 0; }
  body { background: #0f1117; color: #e2e8f0; font-family: sans-serif; font-size: 14px;
         display: flex; flex-direction: column; overflow: hidden; }
  header { background: #1a1d2e; padding: 14px 24px; border-bottom: 1px solid #2a2d3e; flex-shrink: 0; }
  #price-strip { background: #1a1d2e; padding: 5px 24px; border-bottom: 1px solid #2a2d3e; flex-shrink: 0; }
  #app-layout { display: flex; flex: 1; min-height: 0; overflow: hidden; }
  #sidebar { width: 172px; flex-shrink: 0; background: #1a1d2e; border-right: 1px solid #2a2d3e; padding: 10px 6px; overflow-y: auto; }
  #content-area { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .sec { display: none; flex-direction: column; gap: 14px; padding: 18px 20px; overflow-y: auto; }
  .sec.active { display: flex; flex: 1; min-height: 0; }
  .card { background: #1a1d2e; border: 1px solid #2a2d3e; border-radius: 10px; padding: 16px 20px; }
  button { background: #4f8ef7; border: none; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; width: 100%; margin-bottom: 4px; }
  button.active { background: rgba(79,142,247,.25); color: #4f8ef7; }
</style>
</head>
<body>
<header>Smart Farm — 레이아웃 테스트</header>
<div id="price-strip">KAMIS 시세: 딸기 12,500원/kg</div>
<div id="app-layout">
  <nav id="sidebar">
    <button onclick="show('a')" class="active" id="btn-a">섹션 A</button>
    <button onclick="show('b')" id="btn-b">섹션 B</button>
    <button onclick="show('c')" id="btn-c">섹션 C</button>
  </nav>
  <div id="content-area">
    <div id="sec-a" class="sec active" style="display:flex;flex:1;min-height:0">
      <div class="card"><h3>🅰️ 섹션 A 카드 1</h3><p>내용이 보이면 레이아웃 정상입니다.</p></div>
      <div class="card"><h3>🅰️ 섹션 A 카드 2</h3><p>두 번째 카드</p></div>
    </div>
    <div id="sec-b" class="sec">
      <div class="card"><h3>🅱️ 섹션 B 카드 1</h3><p>B 섹션이 보입니다!</p></div>
    </div>
    <div id="sec-c" class="sec">
      <div class="card"><h3>🅾️ 섹션 C 카드 1</h3><p>C 섹션이 보입니다!</p></div>
    </div>
  </div>
</div>
<script>
function show(name) {
  document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + name).classList.add('active');
  document.querySelectorAll('.sec').forEach(s => {
    s.classList.remove('active');
    s.style.display = 'none';
  });
  const t = document.getElementById('sec-' + name);
  if (t) {
    t.classList.add('active');
    t.style.display = 'flex';
    t.style.flex = '1';
    t.style.minHeight = '0';
  }
}
</script>
</body>
</html>
