# Smart Farm MQTT Broker — Windows 실행용 설정
# 실행: "C:\Program Files\mosquitto\mosquitto.exe" -c C:\smart_farm\mosquitto\config\mosquitto-windows.conf

# ── MQTT 리스너 (IoT 센서) ────────────────────────────────────────────────
listener 1883
protocol mqtt

# ── WebSocket 리스너 (대시보드 브라우저 직접 연결) ────────────────────────
listener 9001
protocol websockets

# ── 인증 ─────────────────────────────────────────────────────────────────
allow_anonymous true

# ── 지속성 ───────────────────────────────────────────────────────────────
persistence true
persistence_location C:\smart_farm\mosquitto\data\

# ── 로깅 ─────────────────────────────────────────────────────────────────
log_dest file C:\smart_farm\mosquitto\log\mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ── 연결 설정 ─────────────────────────────────────────────────────────────
max_keepalive 120
max_connections 500
message_size_limit 65536
max_queued_messages 1000
