# Mosquitto MQTT 브로커 설정 — Smart Farm AI Platform
# 문서: https://mosquitto.org/man/mosquitto-conf-5.html

# ── 기본 리스너 ───────────────────────────────────────────────────────────────
listener 1883
protocol mqtt

# ── WebSocket 리스너 (대시보드 직접 연결용) ───────────────────────────────────
listener 9001
protocol websockets

# ── 인증 ─────────────────────────────────────────────────────────────────────
# 개발 환경: 인증 없이 허용 (운영에서는 password_file 사용)
allow_anonymous true

# 운영 환경 설정 (주석 해제 후 사용):
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl

# ── 지속성 ────────────────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── 로깅 ─────────────────────────────────────────────────────────────────────
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ── 연결 설정 ─────────────────────────────────────────────────────────────────
max_keepalive 120
max_connections 500
message_size_limit 65536

# ── 로그 보존 ─────────────────────────────────────────────────────────────────
# 센서 데이터는 QoS 1로 발행 — 재연결 시 미수신 메시지 재전달
max_queued_messages 1000
