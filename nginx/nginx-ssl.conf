# Smart Farm — nginx HTTPS (Let's Encrypt / Certbot)
# 이 파일은 인증서 발급 완료 후 nginx.conf 대신 사용합니다.
#
# 사용법:
#   1. 먼저 HTTP 전용 nginx.conf로 Certbot 인증서 발급 완료
#   2. docker-compose.yml의 nginx 볼륨을 이 파일로 교체:
#      - ./nginx/nginx-ssl.conf:/etc/nginx/nginx.conf:ro
#   3. docker compose restart nginx

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;
    gzip_min_length 1024;

    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    # ── HTTP → HTTPS 리다이렉트 ─────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Certbot ACME 챌린지 (인증서 갱신 시 필요)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 그 외 모든 요청은 HTTPS로 리다이렉트
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS 서버 ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name ${DOMAIN_NAME};   # .env의 DOMAIN_NAME 값

        # ── TLS 인증서 ─────────────────────────────────────────────────────
        ssl_certificate     /etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME}/privkey.pem;

        # 권장 TLS 설정 (Mozilla Modern)
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver            8.8.8.8 8.8.4.4 valid=300s;

        # ── 보안 헤더 ──────────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options        SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection       "1; mode=block" always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;

        # ── 대시보드 정적 파일 ─────────────────────────────────────────────
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            location ~* \.html$ {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
        }

        # ── API 프록시 ─────────────────────────────────────────────────────
        location ~ ^/(api|health|docs|redoc|openapi\.json) {
            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 120s;
            proxy_send_timeout 30s;
        }

        location /nginx-health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
