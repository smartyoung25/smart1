version: "3.9"

# Smart Farm AI Platform — docker-compose
#
# Services:
#   nginx     — 리버스 프록시 + 대시보드 정적 파일 서빙 (port 80/443)
#   certbot   — Let's Encrypt 인증서 발급/갱신 (HTTPS 사용 시)
#   api       — FastAPI + uvicorn (내부 port 8000)
#   pipeline  — ETL + retrain cron scheduler
#
# 빠른 시작 (HTTP):
#   cp .env.example .env && vim .env
#   docker compose up -d
#
# HTTPS 활성화:
#   bash deploy/setup_https.sh yourdomain.com your@email.com

x-common-env: &common-env
  env_file: .env
  environment:
    PYTHONUNBUFFERED: "1"
    PYTHONDONTWRITEBYTECODE: "1"

volumes:
  model_artifacts:
  api_data:          # 이행 기록·기록류 영속(이미지 /app/api/data 로 자동 시딩)
  pipeline_state:
  app_logs:
  certbot_www:
  certbot_certs:
  mosquitto_data:
  mosquitto_log:
  pg_data:
  redis_data:

services:

  # ── TimescaleDB (PostgreSQL 15 + TimescaleDB 2.x) ────────────────────────────
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: smart-farm-db
    environment:
      POSTGRES_USER: smartfarm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: smartfarm
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/schema/variable_registry.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartfarm -d smartfarm"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # ── Redis (Airflow celery broker + 캐시) ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: smart-farm-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  # ── nginx (리버스 프록시 + 대시보드) ────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: smart-farm-nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx-selfsigned.conf:/etc/nginx/nginx.conf:ro
      - ./archive/dashboard:/usr/share/nginx/html:ro   # 구 PC 대시보드(보존용) — 운영 D2는 미사용
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
      - C:/nginx/ssl:/etc/nginx/certs:ro   # self-signed 인증서 (Let's Encrypt 전환 전 사용)
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── Certbot (Let's Encrypt 인증서 자동 갱신) ─────────────────────────────────
  # HTTPS 사용 시에만 활성화: docker compose up -d certbot
  certbot:
    image: certbot/certbot:latest
    container_name: smart-farm-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # 12시간마다 갱신 시도 (Let's Encrypt 권장)
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"
    restart: unless-stopped
    profiles:
      - https

  # ── Mosquitto MQTT 브로커 ────────────────────────────────────────────────────
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: smart-farm-mqtt
    ports:
      - "${MQTT_PORT:-1883}:1883"       # MQTT
      - "${MQTT_WS_PORT:-9001}:9001"    # MQTT over WebSocket
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "health", "-m", "ping", "-q", "0"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  # ── MQTT 구독자 (센서 데이터 → ETL CSV) ──────────────────────────────────────
  mqtt-subscriber:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    image: smart-farm-pipeline:latest
    container_name: smart-farm-mqtt-sub
    <<: *common-env
    environment:
      MQTT_BROKER_HOST: mqtt
      MQTT_BROKER_PORT: "1883"
    command: ["python", "-m", "pipeline.mqtt_subscriber"]
    volumes:
      - ./api/data:/app/api/data:ro
      - ${ETL_DATA_DIR:-./etl_data}:/app/etl_data
      - app_logs:/app/logs
    depends_on:
      mqtt:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── API (FastAPI + uvicorn) ──────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: smart-farm-api:latest
    container_name: smart-farm-api
    <<: *common-env
    # ★ 터널(cloudflared)이 host의 localhost:8000 으로 접속하므로 반드시 게시해야 한다.
    #   expose 는 컨테이너 간 노출일 뿐 host 게시가 아니다 — 구성상 expose 였던 탓에
    #   운영 서버에서 수동으로 ports 로 고쳐 쓰고 있었고, 그 로컬 수정을 git checkout 이
    #   덮어써 502(호스트에서 8000 도달 불가)가 발생했다. 레포에 영구 반영한다.
    #   (외부 노출은 ACG 방화벽이 22 외 전부 차단하므로 안전)
    ports:
      - "8000:8000"
    volumes:
      - model_artifacts:/app/models/artifacts
      # ★ api/data 는 읽기 전용이면 안 된다 — POST /activity·기록류가 여기에 적재된다.
      #   구: ./api/data:/app/api/data:ro → 모든 쓰기가 OSError(Read-only file system)로
      #   실패했고 핸들러가 이를 삼켜 200을 반환, 이행 기록이 조용히 유실됐다.
      #   named volume 사용: 최초 기동 시 이미지의 /app/api/data(Dockerfile COPY api/)로
      #   자동 시딩되고, 이후 쓰기가 볼륨에 영속된다(호스트 git 트리를 더럽히지 않음).
      - api_data:/app/api/data
      - ./engine/data:/app/engine/data:ro
      - app_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── Pipeline (ETL + retrain cron) ────────────────────────────────────────────
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    image: smart-farm-pipeline:latest
    container_name: smart-farm-pipeline
    <<: *common-env
    volumes:
      - model_artifacts:/app/models/artifacts
      - pipeline_state:/app/pipeline/state
      - app_logs:/app/logs
      - ./api/data:/app/api/data
      - ./engine/data:/app/engine/data
      - ${ETL_DATA_DIR:-./etl_data}:/app/etl_data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # ── 주간 운영 리포트 (매주 월요일 08:00, 선택 실행) ──────────────────────────
  # 즉시 실행: docker compose run --rm weekly-report
  # 드라이런:  docker compose run --rm weekly-report python -m pipeline.weekly_report --dry-run
  # 자동 실행: docker compose --profile weekly up -d weekly-report
  weekly-report:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    image: smart-farm-pipeline:latest
    container_name: smart-farm-weekly
    <<: *common-env
    volumes:
      - model_artifacts:/app/models/artifacts:ro
      - pipeline_state:/app/pipeline/state:ro
      - ./api/data:/app/api/data:ro
      - app_logs:/app/logs
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               python -m pipeline.weekly_report;
               sleep 7d & wait $${!};
             done"
    restart: unless-stopped
    profiles:
      - weekly
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ── KAMIS 가격 갱신 (매일 07:00, 선택 실행) ──────────────────────────────────
  # docker compose run --rm kamis-refresh
  # 또는 docker compose --profile kamis up -d kamis-refresh
  kamis-refresh:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    image: smart-farm-pipeline:latest
    container_name: smart-farm-kamis
    <<: *common-env
    volumes:
      - ./api/data:/app/api/data   # kamis_price_cache.json 저장
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               python -m pipeline.kamis_fetcher;
               sleep 24h & wait $${!};
             done"
    restart: unless-stopped
    profiles:
      - kamis
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
