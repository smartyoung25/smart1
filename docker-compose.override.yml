# docker-compose.override.yml — 로컬 개발 환경 오버라이드
# 로컬에 PostgreSQL 17이 이미 실행 중일 때 사용
# docker compose up -d 실행 시 자동 적용됨

services:
  # 로컬 PostgreSQL 사용 → DB 컨테이너 비활성화
  db:
    profiles:
      - docker-db-only

  # API: 로컬 PostgreSQL을 host.docker.internal로 연결
  api:
    environment:
      DATABASE_URL: "postgresql://smartfarm:f6bFuazrDJkHJsLfiI7%40@host.docker.internal:5432/smartfarm"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: []

  # Pipeline: 동일하게 로컬 DB 연결
  pipeline:
    environment:
      DATABASE_URL: "postgresql://smartfarm:f6bFuazrDJkHJsLfiI7%40@host.docker.internal:5432/smartfarm"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: []
