<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>C6 — AI 학습 | KAASA SmartOS</title>
  <link rel="stylesheet" href="../components/base.css"/>
  <style>
    .c6-kpi-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
    .c6-kpi{background:var(--panel);border-radius:var(--radius-sm);padding:14px;box-shadow:var(--shadow);}
    .c6-kpi-label{font-size:11px;color:var(--muted);font-weight:600;}.c6-kpi-val{font-size:22px;font-weight:900;margin:4px 0 1px;}
    .pipe-step{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
    .pipe-step:last-child{border-bottom:none;}
    .pipe-ico{width:30px;height:30px;border-radius:50%;background:var(--green-soft);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
    .pipe-t{flex:1;font-size:13px;font-weight:700;}.pipe-s{font-size:11px;color:var(--muted);margin-top:1px;}
    .pipe-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--green-soft);color:var(--green-dark);}
    .model-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
    .model-row:last-child{border-bottom:none;}
    .mr-name{flex:1;font-size:13px;font-weight:700;}.mr-r2{font-size:13px;font-weight:800;}
    .ws-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;}
    .ws-dot.connected{background:var(--green);box-shadow:0 0 0 3px rgba(31,122,77,.2);}
  </style>
</head>
<body>
<header class="sf-header">
  <div style="display:flex;align-items:center;gap:6px;"><span class="ws-dot" id="wsDot"></span><span style="font-size:12px;color:rgba(255,255,255,.8)" id="wsLabel">연결 중…</span></div>
  <span style="font-size:15px;font-weight:800;color:#fff;">C6 AI 학습</span><span style="width:40px;"></span>
</header>
<main class="sf-main" style="padding:14px;max-width:480px;margin:0 auto;">
  <div class="c6-kpi-row">
    <div class="c6-kpi"><div class="c6-kpi-label">학습 데이터</div><div class="c6-kpi-val" id="kData" style="color:var(--blue)">—</div><div style="font-size:11px;color:var(--muted)">누적 샘플</div></div>
    <div class="c6-kpi"><div class="c6-kpi-label">평균 정확도</div><div class="c6-kpi-val" id="kAcc" style="color:var(--green)">—</div><div style="font-size:11px;color:var(--muted)">M1 생육 R²</div></div>
  </div>
  <div class="section-label">학습 파이프라인</div>
  <div class="card" style="padding:14px;margin-bottom:14px;">
    <div class="pipe-step"><div class="pipe-ico">📥</div><div class="pipe-t" style="flex:1;">데이터 수집<div class="pipe-s">센서·관수·생육·수확 실측</div></div><span class="pipe-badge">실시간</span></div>
    <div class="pipe-step"><div class="pipe-ico">🔧</div><div class="pipe-t" style="flex:1;">ETL 변환<div class="pipe-s">canonical 정규화 → parquet</div></div><span class="pipe-badge">야간</span></div>
    <div class="pipe-step"><div class="pipe-ico">🧠</div><div class="pipe-t" style="flex:1;">모델 학습<div class="pipe-s">M1 생육 · M2 수확 · M5 병해</div></div><span class="pipe-badge">주간</span></div>
    <div class="pipe-step"><div class="pipe-ico">✅</div><div class="pipe-t" style="flex:1;">게이트 검증<div class="pipe-s">MAPE·R² 기준 통과 시 배포</div></div><span class="pipe-badge">자동</span></div>
  </div>
  <div class="section-label">모델별 성능 (M1 생육)</div>
  <div class="card" style="padding:14px;" id="modelList"><div style="text-align:center;color:var(--muted);font-size:12px;"><div class="spinner"></div></div></div>
</main>
<nav class="sf-bottom-nav">
  <button class="bnav-tab" onclick="location.href='c3_home.html'"><span class="bnav-icon">🏠</span>홈</button>
  <button class="bnav-tab" onclick="location.href='g1_home.html'"><span class="bnav-icon">🌱</span>온실</button>
  <button class="bnav-tab" onclick="location.href='f1_field.html'"><span class="bnav-icon">🌾</span>노지</button>
  <button class="bnav-tab" onclick="location.href='c12_joint.html'"><span class="bnav-icon">🚚</span>출하</button>
  <button class="bnav-tab active"><span class="bnav-icon">≡</span>메뉴</button>
</nav>
<script src="../components/data.js"></script>
<script>
'use strict';
window.addEventListener('DOMContentLoaded',()=>{
  const farmId=new URLSearchParams(location.search).get('farm')||sessionStorage.getItem('sf_farm_id')||'farm_001';
  _ensureToken().then(t=>{KaasaData.init({farmId,token:t,onStatus:_ws});_load(t,farmId);});
});
async function _ensureToken(){const s=sessionStorage.getItem('sf_token');if(s)return s;try{const a=sessionStorage.getItem('sf_api')||location.origin;const r=await fetch(`${a}/api/v1/auth/token`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'admin',password:'1250'})});if(r.ok){const d=await r.json();sessionStorage.setItem('sf_token',d.access_token);return d.access_token;}}catch{}return '';}
function _ws(s){const d=document.getElementById('wsDot'),l=document.getElementById('wsLabel');if(d)d.className='ws-dot '+s;if(l)l.textContent=s==='connected'?'실시간 연결 중':'연결 안 됨';}
async function _load(token,farmId){
  const api=KaasaData.getApiBase();
  const perf=await fetch(`${api}/api/farms/${farmId}/system/model-performance`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.ok?r.json():null).catch(()=>null);
  const m1=perf?.m1_growth||[], m2=perf?.m2_yield||[];
  const totalN=[...m1,...m2].reduce((s,m)=>s+(m.n_train||m.n_samples||0),0);
  document.getElementById('kData').textContent=totalN?totalN.toLocaleString():'—';
  const avgR2=m1.length?m1.reduce((s,m)=>s+(m.r2||0),0)/m1.length:0;
  document.getElementById('kAcc').textContent=avgR2?avgR2.toFixed(3):'—';
  const el=document.getElementById('modelList');
  if(m1.length){
    el.innerHTML=m1.slice(0,6).map(m=>{const r2=m.r2!=null?m.r2.toFixed(3):'—';const c=m.r2>0.6?'var(--green)':m.r2>0.3?'var(--orange)':'var(--red)';
      return `<div class="model-row"><span class="mr-name">${m.crop||'?'} · ${m.target||'?'}</span><span class="mr-r2" style="color:${c}">R²=${r2}</span></div>`;}).join('');
  } else el.innerHTML='<div style="color:var(--muted);font-size:12px;text-align:center;">데이터 없음</div>';
}
</script>
</body>
</html>
