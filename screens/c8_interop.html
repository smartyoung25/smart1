<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>C8 이기종 연동 | KAASA smartfarmingsight</title>
<link rel="stylesheet" href="../components/base.css"/>
<style>
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.kpi{background:var(--panel);border-radius:var(--radius-sm);padding:14px;box-shadow:var(--shadow);}
.kpi-l{font-size:11px;color:var(--muted);font-weight:600;}.kpi-v{font-size:22px;font-weight:900;margin:4px 0 1px;}.kpi-s{font-size:11px;color:var(--muted);}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.row:last-child{border-bottom:none;}
.row-ico{font-size:20px;}.row-t{flex:1;font-size:13px;font-weight:700;}.row-s{font-size:11px;color:var(--muted);margin-top:1px;}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;}
.bar-wrap{height:8px;background:var(--gray-soft);border-radius:4px;overflow:hidden;margin-top:6px;}
.bar-fill{height:100%;border-radius:4px;}
.mock-note{font-size:10px;color:var(--muted);background:var(--panel-soft);border-radius:8px;padding:8px 10px;margin-bottom:12px;}
.flow-step{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
.flow-step:last-child{border-bottom:none;}
.flow-num{width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex-shrink:0;}
.mod-card{background:var(--panel);border-radius:var(--radius-sm);padding:14px;box-shadow:var(--shadow);text-decoration:none;color:var(--text);border:1.5px solid var(--border);display:block;margin-bottom:8px;}
</style></head>
<body>
<header class="sf-header">
  <span style="font-size:13px;color:rgba(255,255,255,.85);cursor:pointer;" onclick="location.href='../index.html'">‹ 메뉴</span>
  <span style="font-size:15px;font-weight:800;color:#fff;">C8 이기종 연동</span><span style="width:40px;"></span>
</header>
<main class="sf-main" style="padding:14px;max-width:480px;margin:0 auto;">

<div class="kpi-grid">
  <div class="kpi"><div class="kpi-l">연동 API</div><div class="kpi-v" style="color:var(--blue)"><span id="kConn">—</span><span style="font-size:13px;font-weight:400">개</span></div><div class="kpi-s" id="kConnSub">연결됨</div></div>
  <div class="kpi"><div class="kpi-l">연동률</div><div class="kpi-v" style="color:var(--green)"><span id="kRate">—</span><span style="font-size:13px;font-weight:400">%</span></div><div class="kpi-s">전체 데이터소스</div></div>
</div>
<div class="section-label">외부 데이터 연동 현황 <span class="trust-badge trust-live">🟢 실시간</span></div>
<div class="card" style="padding:14px;" id="apiList"><div style="text-align:center;color:var(--muted);font-size:12px;"><div class="spinner"></div></div></div>
<div class="section-label" style="margin-top:14px;">MQTT·게이트웨이</div>
<div class="card" style="padding:14px;" id="mcpList"></div>
<div class="section-label" style="margin-top:14px;">업그레이드 추천</div>
<div class="card" style="padding:14px;border-left:4px solid var(--blue);">
  <div style="font-size:13px;font-weight:800;">🛰️ 토양수분 센서 추가 권장</div>
  <div style="font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5;">노지 필지 관개 자동화 시 연 관수비 약 12% 절감 예상 (C10 ROI 참조). 미설정 API 키 발급 시 연동률 향상.</div>
</div>
</main>
<nav class="sf-bottom-nav">
  <button class="bnav-tab" onclick="location.href='c3_home.html'"><span class="bnav-icon">🏠</span>홈</button>
  <button class="bnav-tab" onclick="location.href='g1_home.html'"><span class="bnav-icon">🌱</span>온실</button>
  <button class="bnav-tab" onclick="location.href='f1_field.html'"><span class="bnav-icon">🌾</span>노지</button>
  <button class="bnav-tab" onclick="location.href='c12_joint.html'"><span class="bnav-icon">🚚</span>출하</button>
  <button class="bnav-tab active"><span class="bnav-icon">≡</span>메뉴</button>
</nav>
<script src="../components/data.js"></script>
<script>
'use strict';
(async function(){
  const api=sessionStorage.getItem('sf_api')||location.origin;
  let token=sessionStorage.getItem('sf_token');
  if(!token){const r=await fetch(`${api}/api/v1/auth/demo-token`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});if(r.ok){token=(await r.json()).access_token;sessionStorage.setItem('sf_token',token);}}
  const farmId=sessionStorage.getItem('sf_farm_id')||'farm_001';
  let d;
  try{ d=await fetch(`${api}/api/farms/${farmId}/system/api-status`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json()); }
  catch(e){ document.getElementById('apiList').innerHTML='<div style="color:var(--muted);font-size:12px;">로드 실패</div>'; return; }
  const apis=d.apis||{};
  const entries=Object.entries(apis);
  const conn=entries.filter(([k,v])=>v.status==='connected').length;
  document.getElementById('kConn').textContent=conn;
  document.getElementById('kConnSub').textContent=`전체 ${entries.length}개 중`;
  document.getElementById('kRate').textContent=entries.length?Math.round(conn/entries.length*100):0;
  const stColor=s=>s==='connected'?'var(--green)':s==='fallback_active'?'var(--orange)':'var(--red)';
  const stBg=s=>s==='connected'?'var(--green-soft)':s==='fallback_active'?'var(--orange-soft)':'var(--red-soft)';
  const stTxt=s=>s==='connected'?'연결':s==='fallback_active'?'폴백':'미설정';
  document.getElementById('apiList').innerHTML=entries.map(([name,v])=>`
    <div class="row"><span class="row-ico">${v.status==='connected'?'🟢':v.status==='fallback_active'?'🟡':'⚪'}</span>
      <div class="row-t" style="flex:1;">${name}<div class="row-s">${(v.used_for||'').slice(0,40)}</div></div>
      <span class="badge" style="background:${stBg(v.status)};color:${stColor(v.status)};">${stTxt(v.status)}</span></div>`).join('');
  // MQTT/MCP 서버
  const mcp=d.mcp_servers||{};
  const mEnt=Object.entries(mcp);
  document.getElementById('mcpList').innerHTML = mEnt.length ? mEnt.map(([k,v])=>`
    <div class="row"><span class="row-ico">🔌</span><div class="row-t" style="flex:1;">${k}<div class="row-s">${typeof v==='object'?(v.status||JSON.stringify(v).slice(0,40)):v}</div></div></div>`).join('')
    : '<div class="row"><span class="row-ico">📡</span><div class="row-t" style="flex:1;">MQTT 브로커 (mosquitto)<div class="row-s">포트 1883 · 센서 스트리밍</div></div><span class="badge" style="background:var(--green-soft);color:var(--green-dark)">활성</span></div>';
})();
</script>
</body></html>
