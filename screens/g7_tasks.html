<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>G7 — 오늘의 작업 | KAASA Farmingsight</title>
  <meta name="description" content="일일·주간 작업추천 — 일사 기반 P1~P6 관수 Period, 환경 전략표 목표 대비 편차 처방, 기록 완결성 점검. 근거를 함께 제시하는 규칙 기반 추천."/>
  <meta name="keywords" content="스마트팜 작업추천,일일작업,주간작업,관수 Period,환경 처방,영농일지"/>
  <link rel="canonical" href="https://farmingsight.org/screens/g7_tasks.html"/>
  <meta name="robots" content="index,follow"/>
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="G7 — 오늘의 작업 | KAASA Farmingsight"/>
  <meta property="og:description" content="일일·주간 작업추천 — P1~P6 관수 Period, 환경 전략표 편차 처방, 기록 점검."/>
  <meta property="og:image" content="https://farmingsight.org/og-image.png"/>
  <link rel="stylesheet" href="../components/base.css"/>
  <style>
    /* ── 요약 스트립 ── */
    .tk-strip{background:var(--panel);border:1.5px solid var(--border);border-radius:var(--radius-sm);
      box-shadow:var(--shadow);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:12px;}
    .tk-period{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;
      flex-direction:column;background:var(--green-soft);color:var(--green-dark);flex:0 0 auto;}
    .tk-period b{font-size:15px;font-weight:800;line-height:1;}
    .tk-period span{font-size:8.5px;font-weight:700;margin-top:2px;}
    .tk-sum{flex:1;min-width:0;}
    .tk-sum h2{font-size:14px;font-weight:800;margin:0 0 3px;letter-spacing:-.3px;}
    .tk-sum p{font-size:11px;color:var(--muted);margin:0;}
    .tk-counts{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;}
    .tk-cnt{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:8px;}
    .tk-cnt.crit{background:var(--red-soft);color:var(--red);}
    .tk-cnt.warn{background:var(--orange-soft);color:var(--orange);}
    .tk-cnt.info{background:var(--blue-soft);color:var(--blue);}

    /* ── 탭 ── */
    .tk-tabs{display:flex;gap:6px;margin-bottom:12px;}
    .tk-tab{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:var(--panel);
      font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;min-height:44px;}
    .tk-tab.on{background:var(--green-soft);border-color:var(--green);color:var(--green-dark);}

    /* ── 작업 카드 ── */
    .tk-card{background:var(--panel);border:1.5px solid var(--border);border-left-width:4px;
      border-radius:var(--radius-sm);box-shadow:var(--shadow);padding:12px 13px;margin-bottom:9px;}
    .tk-card.crit{border-left-color:var(--red);}
    .tk-card.warn{border-left-color:var(--orange);}
    .tk-card.info{border-left-color:var(--blue);}
    .tk-head{display:flex;align-items:flex-start;gap:8px;}
    .tk-ico{font-size:17px;line-height:1.3;flex:0 0 auto;}
    .tk-title{font-size:13px;font-weight:800;letter-spacing:-.2px;flex:1;line-height:1.42;}
    .tk-badge{font-size:9px;font-weight:800;padding:2px 6px;border-radius:7px;flex:0 0 auto;}
    .tk-badge.crit{background:var(--red-soft);color:var(--red);}
    .tk-badge.warn{background:var(--orange-soft);color:var(--orange);}
    .tk-badge.info{background:var(--blue-soft);color:var(--blue);}
    /* ★ 근거는 항상 보인다 — 접어두면 "왜 이 작업인지" 모른 채 지시만 남는다 */
    .tk-why{font-size:11px;color:var(--muted);line-height:1.5;margin:7px 0 0 25px;
      padding-left:8px;border-left:2px solid var(--border);}
    .tk-go{display:inline-block;margin:9px 0 0 25px;font-size:11px;font-weight:700;
      color:var(--green-dark);background:var(--green-soft);padding:7px 12px;border-radius:9px;
      text-decoration:none;min-height:34px;line-height:20px;}

    /* ── 주간 ── */
    .wk-day{background:var(--panel);border:1.5px solid var(--border);border-radius:var(--radius-sm);
      padding:11px 13px;margin-bottom:8px;box-shadow:var(--shadow);}
    .wk-day.today{border-color:var(--green);background:var(--green-soft);}
    .wk-dh{display:flex;align-items:center;gap:7px;margin-bottom:5px;}
    .wk-dow{font-size:12.5px;font-weight:800;}
    .wk-date{font-size:10.5px;color:var(--muted);}
    .wk-today-b{font-size:9px;font-weight:800;background:var(--green);color:#fff;padding:2px 6px;border-radius:7px;}
    .wk-item{font-size:11.5px;line-height:1.55;padding-left:12px;position:relative;color:var(--text);}
    .wk-item::before{content:'•';position:absolute;left:2px;color:var(--green);}
    .wk-none{font-size:11px;color:var(--muted);}

    .tk-note{font-size:10.5px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.6;}
    .tk-empty{text-align:center;padding:34px 16px;color:var(--muted);font-size:12.5px;line-height:1.7;}
  </style>
</head>
<body>

<header class="sf-header">
  <button class="sf-back" onclick="history.back()">←</button>
  <span style="font-size:15px;font-weight:800;color:#fff;letter-spacing:-.3px">G7 오늘의 작업</span>
  <select id="farmSel" aria-label="농장 선택" onchange="onFarmChange(this.value)"
          style="font-size:12px;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:8px;padding:4px 8px;cursor:pointer;outline:none;">
    <option value="farm_001">farm_001</option>
  </select>
</header>

<main class="sf-main" style="padding:14px;max-width:480px;margin:0 auto;">

  <div class="tk-strip" id="strip">
    <div class="tk-period" id="pBox"><b>—</b><span>Period</span></div>
    <div class="tk-sum">
      <h2 id="sumTitle">불러오는 중…</h2>
      <p id="sumSub">—</p>
      <div class="tk-counts" id="counts"></div>
    </div>
  </div>

  <div class="tk-tabs">
    <button class="tk-tab on" id="tabD" onclick="showTab('d')">오늘</button>
    <button class="tk-tab" id="tabW" onclick="showTab('w')">이번 주</button>
  </div>

  <div id="paneD"></div>
  <div id="paneW" style="display:none"></div>

  <p class="tk-note" id="note"></p>
</main>

<script src="../components/data.js"></script>
<script>
let _api = null, _token = null, _farmId = 'farm_001', _daily = null, _weekly = null;

async function _ensureToken() {
  const s = sessionStorage.getItem('sf_token');
  if (s) return s;
  _api = sessionStorage.getItem('sf_api') || (location.protocol !== 'file:' ? location.origin : 'http://localhost:8000');
  const r = await fetch(`${_api}/api/v1/auth/demo-token`, {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({}),
  });
  if (r.ok) { const d = await r.json(); sessionStorage.setItem('sf_token', d.access_token); return d.access_token; }
  return null;
}
function _hdr() { return {Authorization:`Bearer ${_token}`, 'Content-Type':'application/json'}; }
function _apiFetch(path) {
  const base = _api || sessionStorage.getItem('sf_api') || location.origin;
  return fetch(`${base}/api/farms/${_farmId}${path}`, {headers: _hdr()})
    .then(r => { if (!r.ok) throw new Error(`${path} ${r.status}`); return r.json(); });
}
const _esc = s => String(s ?? '').replace(/[&<>"']/g, m =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const _SEVKO = {crit:'긴급', warn:'주의', info:'점검'};

function showTab(w) {
  document.getElementById('tabD').classList.toggle('on', w === 'd');
  document.getElementById('tabW').classList.toggle('on', w === 'w');
  document.getElementById('paneD').style.display = w === 'd' ? '' : 'none';
  document.getElementById('paneW').style.display = w === 'w' ? '' : 'none';
}

function renderDaily(d) {
  _daily = d;
  document.getElementById('pBox').innerHTML =
    `<b>${_esc(d.period || '—')}</b><span>Period</span>`;
  document.getElementById('sumTitle').textContent =
    `${d.crop} · 오늘 ${d.tasks.length}건`;
  document.getElementById('sumSub').textContent =
    `☀ 일출 ${d.sunrise} · 🌙 일몰 ${d.sunset}`;
  const c = d.counts || {};
  document.getElementById('counts').innerHTML = ['crit','warn','info']
    .filter(k => c[k] > 0)
    .map(k => `<span class="tk-cnt ${k}">${_SEVKO[k]} ${c[k]}</span>`).join('');

  const pane = document.getElementById('paneD');
  if (!d.tasks.length) {
    pane.innerHTML = `<div class="tk-empty">지금 필요한 작업이 없습니다.<br>실측을 기록하면 더 정확한 추천을 받습니다.</div>`;
    return;
  }
  pane.innerHTML = d.tasks.map(t => `
    <div class="tk-card ${t.severity}">
      <div class="tk-head">
        <span class="tk-ico">${_esc(t.icon)}</span>
        <span class="tk-title">${_esc(t.title)}</span>
        <span class="tk-badge ${t.severity}">${_SEVKO[t.severity] || ''}</span>
      </div>
      <div class="tk-why">${_esc(t.why)}</div>
      ${t.screen ? `<a class="tk-go" href="${_esc(t.screen)}">바로 가기 →</a>` : ''}
    </div>`).join('');

  // ★ 실측이 없으면 그 사실을 밝힌다 — 추천이 적은 이유가 '문제 없음'이 아니라 '근거 없음'일 수 있다.
  document.getElementById('note').textContent = d.has_measurement
    ? '추천 근거: 관수 Period(시각 기준) · 환경 전략표 목표 대비 실측 편차'
    : '실측 데이터가 없어 추천 근거가 제한적입니다. 환경·관수를 기록하면 정확해집니다.';
}

function renderWeekly(w) {
  _weekly = w;
  document.getElementById('paneW').innerHTML = w.days.map(d => `
    <div class="wk-day ${d.is_today ? 'today' : ''}">
      <div class="wk-dh">
        <span class="wk-dow">${_esc(d.dow)}</span>
        <span class="wk-date">${_esc(d.date)}</span>
        ${d.is_today ? '<span class="wk-today-b">오늘</span>' : ''}
      </div>
      ${d.items.length
        ? d.items.map(i => `<div class="wk-item">${_esc(i)}</div>`).join('')
        : '<div class="wk-none">예정된 점검 없음</div>'}
    </div>`).join('')
    + `<p class="tk-note">${_esc(w.note)}</p>`;
}

async function load() {
  _token = await _ensureToken();
  if (!_token) {
    document.getElementById('sumTitle').textContent = '인증 실패';
    document.getElementById('paneD').innerHTML =
      '<div class="tk-empty">로그인이 필요합니다.</div>';
    return;
  }
  try {
    const [d, w] = await Promise.all([_apiFetch('/tasks/daily'), _apiFetch('/tasks/weekly')]);
    renderDaily(d); renderWeekly(w);
  } catch (e) {
    document.getElementById('sumTitle').textContent = '불러오기 실패';
    document.getElementById('sumSub').textContent = String(e.message || e);
    document.getElementById('paneD').innerHTML =
      '<div class="tk-empty">작업추천을 불러오지 못했습니다.<br>잠시 후 다시 시도해 주세요.</div>';
  }
}
function onFarmChange(v) { _farmId = v; sessionStorage.setItem('sf_farm_id', v); load(); }

// 농장 셀렉트(#farmSel)는 data.js 의 _syncFarmSelectors() 가 채운다 — 여기서 다시 그리지 않는다
// (중복 구현하면 목록이 갈라진다). 선택된 농장만 이어받는다.
_farmId = sessionStorage.getItem('sf_farm_id') || 'farm_001';
load();
</script>
</body>
</html>
