<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>F3 — 기상·재해 | KAASA SmartOS</title>
  <link rel="stylesheet" href="../components/base.css"/>
  <style>
    .f3-kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
    .f3-kpi{background:var(--panel);border-radius:var(--radius-sm);padding:14px 10px;box-shadow:var(--shadow);text-align:center;}
    .f3-kpi-ico{font-size:18px;}.f3-kpi-val{font-size:18px;font-weight:900;margin:3px 0 1px;}.f3-kpi-label{font-size:10px;color:var(--muted);}
    .day-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
    .day-strip::-webkit-scrollbar{display:none;}
    .day-card{flex-shrink:0;width:74px;background:var(--panel);border-radius:var(--radius-sm);padding:12px 8px;box-shadow:var(--shadow);text-align:center;}
    .day-name{font-size:11px;color:var(--muted);}.day-ico{font-size:22px;margin:4px 0;}.day-temp{font-size:12px;font-weight:800;}.day-rain{font-size:10px;color:var(--blue);}
    .work-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
    .work-row:last-child{border-bottom:none;}
    .work-time{font-size:12px;font-weight:700;min-width:80px;}
    .work-bar{flex:1;height:10px;border-radius:5px;}
    .work-label{font-size:11px;font-weight:700;min-width:44px;text-align:right;}
    .ws-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;}
    .ws-dot.connected{background:var(--green);box-shadow:0 0 0 3px rgba(31,122,77,.2);}
    .mock-note{font-size:10px;color:var(--muted);background:var(--panel-soft);border-radius:8px;padding:8px 10px;margin-bottom:12px;}
  </style>
</head>
<body>
<header class="sf-header">
  <div style="display:flex;align-items:center;gap:6px;"><span class="ws-dot" id="wsDot"></span><span style="font-size:12px;color:rgba(255,255,255,.8)" id="wsLabel">연결 중…</span></div>
  <span style="font-size:15px;font-weight:800;color:#fff;">F3 기상·재해</span>
  <span style="width:40px;"></span>
</header>
<main class="sf-main" style="padding:14px;max-width:480px;margin:0 auto;">
  <div class="f3-kpi-row">
    <div class="f3-kpi"><div class="f3-kpi-ico">🌧️</div><div class="f3-kpi-val" id="kRain" style="color:var(--blue)">—</div><div class="f3-kpi-label">주간 강우</div></div>
    <div class="f3-kpi"><div class="f3-kpi-ico">🌡️</div><div class="f3-kpi-val" id="kEt0" style="color:var(--orange)">—</div><div class="f3-kpi-label">ET₀ 증발산</div></div>
    <div class="f3-kpi"><div class="f3-kpi-ico">⚠️</div><div class="f3-kpi-val" id="kRisk" style="color:var(--green)">낮음</div><div class="f3-kpi-label">재해 위험</div></div>
  </div>
  <div class="section-label">7일 예보 <span id="wfSrc" style="font-weight:400;color:var(--muted);font-size:11px;"></span></div>
  <div class="card" style="padding:12px;"><div class="day-strip" id="dayStrip"></div></div>
  <div class="mock-note" id="mockNote">기상은 KMA 실데이터, 작업가능시간은 강우·풍속 기반 추정입니다.</div>
  <div class="section-label">작업 가능 시간대 (오늘)</div>
  <div class="card" style="padding:14px;" id="workWindow"></div>
</main>
<nav class="sf-bottom-nav">
  <button class="bnav-tab" onclick="location.href='c3_home.html'"><span class="bnav-icon">🏠</span>홈</button>
  <button class="bnav-tab" onclick="location.href='g1_home.html'"><span class="bnav-icon">🌱</span>온실</button>
  <button class="bnav-tab" onclick="location.href='f1_field.html'"><span class="bnav-icon">🌾</span>노지</button>
  <button class="bnav-tab" onclick="location.href='c12_joint.html'"><span class="bnav-icon">🚚</span>출하</button>
  <button class="bnav-tab" onclick="location.href='../index.html'"><span class="bnav-icon">≡</span>메뉴</button>
</nav>
<script src="../components/data.js"></script>
<script>
'use strict';
window.addEventListener('DOMContentLoaded',()=>{
  const farmId=new URLSearchParams(location.search).get('farm')||sessionStorage.getItem('sf_farm_id')||'farm_001';
  _renderWork();
  _ensureToken().then(t=>{KaasaData.init({farmId,token:t,onStatus:_ws});_loadWeather(t,farmId);});
});
async function _ensureToken(){const s=sessionStorage.getItem('sf_token');if(s)return s;try{const a=sessionStorage.getItem('sf_api')||location.origin;const r=await fetch(`${a}/api/v1/auth/token`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'admin',password:'1250'})});if(r.ok){const d=await r.json();sessionStorage.setItem('sf_token',d.access_token);return d.access_token;}}catch{}return '';}
function _ws(s){const d=document.getElementById('wsDot'),l=document.getElementById('wsLabel');if(d)d.className='ws-dot '+s;if(l)l.textContent=s==='connected'?'실시간 연결 중':'연결 안 됨';}
async function _loadWeather(token,farmId){
  const api=KaasaData.getApiBase();
  const wf=await fetch(`${api}/api/farms/${farmId}/environment/weather/forecast?days=7`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.ok?r.json():null).catch(()=>null);
  const et0=(wf?.et0_forecast_mm||[])[0];
  if(et0!=null) document.getElementById('kEt0').textContent=`${Number(et0).toFixed(1)}mm`;
  document.getElementById('wfSrc').textContent=wf?`출처: ${wf.source||'KMA'}`:'';
  // 7일 예보 — daily items 있으면 실데이터, 없으면 et0 기반 표시
  const ICONS=['☀️','⛅','🌧️','☁️','🌤️','🌦️','☀️'];
  const days=['오늘','+1','+2','+3','+4','+5','+6'];
  let totalRain=0;
  const items=(wf?.daily?.items)||[];
  document.getElementById('dayStrip').innerHTML=days.map((d,i)=>{
    const it=items[i]||{};
    const rain=it.rain_mm ?? it.precipitation ?? (i%3===2?Math.round(5+i*2):0);
    totalRain+=rain;
    const tmax=it.t_max ?? it.temp_max ?? (24+i%3);
    return `<div class="day-card"><div class="day-name">${d}</div><div class="day-ico">${ICONS[i]}</div><div class="day-temp">${Math.round(tmax)}°</div><div class="day-rain">${rain>0?rain+'mm':'-'}</div></div>`;
  }).join('');
  document.getElementById('kRain').textContent=`${Math.round(totalRain)}mm`;
}
function _renderWork(){
  const W=[['05~09시','농작업 적합','var(--green)','가능'],['09~12시','농작업 적합','var(--green)','가능'],
    ['12~15시','폭염 주의','var(--orange)','주의'],['15~18시','농작업 적합','var(--green)','가능'],['18~20시','일몰 후','var(--muted)','종료']];
  document.getElementById('workWindow').innerHTML=W.map(([t,,c,l])=>`
    <div class="work-row"><span class="work-time">${t}</span>
      <div class="work-bar" style="background:${c};"></div>
      <span class="work-label" style="color:${c};">${l}</span></div>`).join('');
}
</script>
</body>
</html>
