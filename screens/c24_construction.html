<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>C24 — 온실 시공업체 찾기 | KAASA Farmingsight</title>
  <link rel="stylesheet" href="../components/base.css"/>
  <style>
    .cc-body{padding:14px;max-width:480px;margin:0 auto;padding-bottom:90px;}
    /* 입력 시트 */
    .cc-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;}
    .cc-mask.open{display:block;}
    .cc-sheet{position:fixed;left:0;right:0;bottom:0;z-index:201;background:var(--panel);border-radius:18px 18px 0 0;
      padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;
      max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .25s;}
    .cc-sheet.open{transform:none;}
    .cc-lbl{font-size:12.5px;font-weight:700;display:block;margin:11px 0 4px;}
    .cc-inp{width:100%;min-height:46px;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:14.5px;background:var(--panel);color:var(--text);outline:none;box-sizing:border-box;}
    .cc-inp:focus{border-color:var(--green);}
    .cc-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
    .cc-chip-sel{font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;border:1.5px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;min-height:44px;}
    .cc-chip-sel.on{background:var(--green-soft);border-color:var(--green);color:var(--green-dark);}
    .cc-save-btn{width:100%;min-height:48px;margin-top:14px;background:var(--green);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;}
    .cc-filters{background:var(--panel);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:12px;box-shadow:var(--shadow);}
    .cc-search{display:flex;gap:8px;}
    .inp,.sel{width:100%;min-height:46px;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;background:var(--panel);color:var(--text);}
    .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
    .chip{font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;border:1.5px solid var(--border);background:var(--panel);color:var(--muted);cursor:pointer;min-height:44px;}
    .chip.on{background:var(--blue-soft);border-color:var(--blue);color:#1e40af;}
    .cc-count{font-size:12px;color:var(--muted);margin:6px 2px 10px;font-weight:700;}
    .cc-card{background:var(--panel);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:13px 14px;margin-bottom:9px;box-shadow:var(--shadow);}
    .cc-top{display:flex;align-items:center;gap:8px;}
    .cc-name{font-size:14.5px;font-weight:800;flex:1;}
    .cc-rank{font-size:10px;font-weight:800;padding:2px 8px;border-radius:7px;background:var(--green-soft);color:var(--green-dark);}
    .cc-addr{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5;}
    .cc-tel{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:13px;font-weight:800;color:var(--blue);text-decoration:none;padding:6px 10px;background:var(--blue-soft);border-radius:9px;min-height:38px;}
    .cc-empty{text-align:center;padding:28px;color:var(--muted);font-size:13px;}
    .cc-hd{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
    .cc-hd .back{font-size:22px;text-decoration:none;color:var(--text);min-width:32px;}
    .cc-hd h1{font-size:17px;font-weight:800;margin:0;flex:1;}
    .cc-note{font-size:10.5px;color:var(--muted);margin-top:3px;}
    /* 입력 방식 선택(찾기/직접입력) 세그먼트 */
    .cc-mode{display:flex;gap:8px;margin-bottom:8px;}
    .cc-mode-btn{flex:1;min-height:46px;padding:11px;border:1.5px solid var(--border);background:var(--panel);color:var(--muted);border-radius:12px;font-size:13.5px;font-weight:800;cursor:pointer;transition:all .15s;}
    .cc-mode-btn.on{border-color:var(--green);background:var(--green-soft);color:var(--green-dark);}
  </style>
</head>
<body>
<main class="cc-body">
  <div class="cc-hd">
    <a class="back" href="c16_equipment.html">‹</a>
    <div style="flex:1;">
      <h1>🏗️ 온실 시공업체</h1>
      <div class="cc-note">공식 DB에서 찾거나 아는 업체를 직접 입력하세요</div>
    </div>
  </div>

  <!-- 입력 방식 선택: 찾기 vs 직접입력 (전면 제시) -->
  <div class="cc-mode" id="ccMode">
    <button class="cc-mode-btn on" id="modeFind" onclick="_setMode('find')">🔍 업체 찾기</button>
    <button class="cc-mode-btn" id="modeInput" onclick="_setMode('input')">✍️ 직접 입력</button>
  </div>
  <div id="modeHint" style="font-size:11.5px;color:var(--muted);margin:0 2px 12px;line-height:1.5;">공식 DB(스마트팜코리아·도급순위)에서 시공업체를 검색합니다.</div>

  <div class="cc-filters" id="findSection">
    <div class="cc-search">
      <input class="inp" id="q" placeholder="상호명 검색 (예: 그린플러스)" oninput="_deb(_run)"/>
    </div>
    <div style="font-size:11px;font-weight:700;color:var(--muted);margin:10px 2px 2px;">지역(시·도)</div>
    <div class="chips" id="regionChips"></div>
    <div style="font-size:11px;font-weight:700;color:var(--muted);margin:10px 2px 2px;">도급순위</div>
    <div class="chips" id="rankChips">
      <span class="chip on" data-rank="" onclick="_pickRank(this,'')">전체</span>
      <span class="chip" data-rank="1군" onclick="_pickRank(this,'1군')">1군</span>
      <span class="chip" data-rank="2군" onclick="_pickRank(this,'2군')">2군</span>
    </div>
  </div>

  <div class="cc-count" id="ccCount">불러오는 중…</div>
  <div id="ccList"></div>
</main>

<!-- 시공업체 직접 등록 시트 -->
<div class="cc-mask" id="regMask" onclick="if(event.target===this)_closeRegister()"></div>
<div class="cc-sheet" id="regSheet">
  <div style="width:36px;height:4px;background:var(--border);border-radius:3px;margin:0 auto 14px;"></div>
  <div style="font-size:17px;font-weight:800;margin-bottom:2px;">🏗️ 시공업체 등록</div>
  <div style="font-size:11px;color:var(--muted);margin-bottom:12px;">직접 아는 업체를 등록하면 검색 목록에 추가됩니다.</div>

  <label class="cc-lbl">업체명 <span style="color:var(--red)">*</span></label>
  <input class="cc-inp" id="rName" placeholder="예: 그린플러스, 케이원팜텍"/>

  <label class="cc-lbl">대표자명</label>
  <input class="cc-inp" id="rCeo" placeholder="예: 홍길동"/>

  <label class="cc-lbl">전화번호</label>
  <input class="cc-inp" id="rTel" type="tel" placeholder="예: 062-000-0000"/>

  <label class="cc-lbl">지역 (시·도)</label>
  <div class="cc-chip-row" id="rRegionChips"></div>

  <label class="cc-lbl">상세 주소</label>
  <input class="cc-inp" id="rAddr" placeholder="예: 전남 구례군 간전면 안음리 7"/>

  <label class="cc-lbl">도급순위</label>
  <div class="cc-chip-row">
    <span class="cc-chip-sel on" data-rank="" onclick="_pickReg(this,'rank')">미등록</span>
    <span class="cc-chip-sel" data-rank="1군" onclick="_pickReg(this,'rank')">1군</span>
    <span class="cc-chip-sel" data-rank="2군" onclick="_pickReg(this,'rank')">2군</span>
  </div>

  <label class="cc-lbl">전문 분야 (복수 선택)</label>
  <div class="cc-chip-row" id="rSpecChips">
    <span class="cc-chip-sel" data-spec="온실시공" onclick="_toggleSpec(this)">온실 시공</span>
    <span class="cc-chip-sel" data-spec="배관·관수" onclick="_toggleSpec(this)">배관·관수</span>
    <span class="cc-chip-sel" data-spec="전기·자동화" onclick="_toggleSpec(this)">전기·자동화</span>
    <span class="cc-chip-sel" data-spec="냉난방" onclick="_toggleSpec(this)">냉난방</span>
    <span class="cc-chip-sel" data-spec="양액시스템" onclick="_toggleSpec(this)">양액 시스템</span>
    <span class="cc-chip-sel" data-spec="스마트팜ICT" onclick="_toggleSpec(this)">스마트팜 ICT</span>
    <span class="cc-chip-sel" data-spec="기타" onclick="_toggleSpec(this)">기타</span>
  </div>

  <label class="cc-lbl">메모 (선택)</label>
  <input class="cc-inp" id="rNote" placeholder="시공 이력, 연락 경위 등"/>

  <div id="regMsg" style="font-size:12.5px;font-weight:700;text-align:center;margin-top:10px;min-height:16px;"></div>
  <button class="cc-save-btn" onclick="_submitRegister()">✓ 업체 등록</button>
  <button onclick="_closeRegister()" style="width:100%;min-height:44px;margin-top:8px;background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;">취소</button>
</div>

<nav class="sf-bottom-nav">
  <button class="bnav-tab" onclick="location.href='c3_home.html'"><span class="bnav-icon">🏠</span>홈</button>
  <button class="bnav-tab" onclick="location.href='c16_equipment.html'"><span class="bnav-icon">🔌</span>기자재</button>
  <button class="bnav-tab" onclick="location.href='c21_apply.html'"><span class="bnav-icon">📝</span>신청</button>
  <button class="bnav-tab" onclick="location.href='../index.html'"><span class="bnav-icon">≡</span>메뉴</button>
</nav>

<script src="../components/data.js"></script>
<script>
'use strict';
const REGIONS=['서울','경기','인천','강원','충북','충남','대전','전북','전남','광주','경북','경남','대구','부산','울산','제주'];
let _region='', _rank='', _t=null;
function _deb(fn){ clearTimeout(_t); _t=setTimeout(fn,250); }

function _pickRegion(el,r){ _region=r; document.querySelectorAll('#regionChips .chip').forEach(c=>c.classList.remove('on')); el.classList.add('on'); _run(); }
function _pickRank(el,r){ _rank=r; document.querySelectorAll('#rankChips .chip').forEach(c=>c.classList.remove('on')); el.classList.add('on'); _run(); }

// 직접등록(로컬) 업체 목록 — 읽기전용 reference API를 침범하지 않고 내 기기에 보관
function _userVendors(){
  try{ return JSON.parse(localStorage.getItem('sf_user_vendors')||'[]'); }catch(e){ return []; }
}
function _ccCard(c, mine){
  const tel=(c.tel||'').replace(/[^0-9]/g,'');
  const badge = mine
    ? `<span class="cc-rank" style="background:var(--blue-soft);color:#1e40af;">직접등록</span>`
    : (c.rank_group?`<span class="cc-rank">${c.rank_group}</span>`:'');
  return `<div class="cc-card">
    <div class="cc-top">
      <div class="cc-name">${c.name||'-'}</div>
      ${badge}
    </div>
    <div class="cc-addr">📍 ${c.address||'-'}</div>
    ${tel?`<a class="cc-tel" href="tel:${tel}">📞 ${c.tel}</a>`:''}
  </div>`;
}
async function _run(){
  const q=document.getElementById('q').value.trim();
  const api=KaasaData.getApiBase();
  const url=`${api}/api/reference/construction?q=${encodeURIComponent(q)}&region=${encodeURIComponent(_region)}&rank=${encodeURIComponent(_rank)}&limit=100`;
  const cnt=document.getElementById('ccCount'), list=document.getElementById('ccList');
  // 직접등록 항목에도 동일 필터(검색어·지역·도급순위) 적용
  const ql=q.toLowerCase();
  const mine=_userVendors().filter(c=>
    (!q || (c.name||'').toLowerCase().includes(ql)) &&
    (!_region || (c.region||'').includes(_region) || (c.address||'').includes(_region)) &&
    (!_rank || c.rank_group===_rank));
  const mineHtml=mine.map(c=>_ccCard(c,true)).join('');
  try{
    const r=await fetch(url); const d=await r.json();
    const items=d.items||[];
    const total=mine.length+items.length;
    cnt.textContent=`${total}개 업체`+(mine.length?` · 내 등록 ${mine.length}`:'');
    if(!total){ list.innerHTML='<div class="cc-empty">조건에 맞는 시공업체가 없습니다.<br>지역·검색어를 바꿔보세요.</div>'; return; }
    list.innerHTML=mineHtml+items.map(c=>_ccCard(c,false)).join('');
  }catch(e){
    // 공식 DB 로드 실패해도 내 등록 항목은 보여줌
    if(mine.length){ cnt.textContent=`${mine.length}개 업체 · 내 등록`; list.innerHTML=mineHtml; }
    else { cnt.textContent=''; list.innerHTML='<div class="cc-empty">데이터를 불러오지 못했습니다.</div>'; }
  }
}
// ★ 지역 칩 공유 초기화
function _initRegions(){
  const regC=document.getElementById('regionChips');
  regC.innerHTML=`<span class="chip on" data-r="" onclick="_pickRegion(this,'')">전체</span>`+
    REGIONS.map(r=>`<span class="chip" data-r="${r}" onclick="_pickRegion(this,'${r}')">${r}</span>`).join('');
  // 등록 시트 지역 칩
  const rC=document.getElementById('rRegionChips');
  if(rC) rC.innerHTML=`<span class="cc-chip-sel on" data-r="" onclick="_pickReg(this,'region')">미선택</span>`+
    REGIONS.map(r=>`<span class="cc-chip-sel" data-r="${r}" onclick="_pickReg(this,'region')">${r}</span>`).join('');
}

// 시공업체 등록 시트
let _regRank='', _regRegion='', _regSpecs=[];
// 입력 방식 선택: 찾기(검색) ↔ 직접입력(등록폼)
function _setMode(m){
  const find=document.getElementById('modeFind'), input=document.getElementById('modeInput');
  const hint=document.getElementById('modeHint');
  if(m==='input'){
    find.classList.remove('on'); input.classList.add('on');
    hint.textContent='아는 시공업체를 직접 입력해 등록하면 검색 목록에 추가됩니다.';
    _openRegister();
  } else {
    input.classList.remove('on'); find.classList.add('on');
    hint.textContent='공식 DB(스마트팜코리아·도급순위)에서 시공업체를 검색합니다.';
  }
}
function _openRegister(){
  document.getElementById('regMask').classList.add('open');
  document.getElementById('regSheet').classList.add('open');
  ['rName','rCeo','rTel','rAddr','rNote'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('regMsg').textContent='';
  _regRank=''; _regRegion=''; _regSpecs=[];
  document.querySelectorAll('#regSheet .cc-chip-sel').forEach(c=>c.classList.remove('on'));
  document.querySelector('#regSheet [data-rank=""]').classList.add('on');
  document.querySelector('#rRegionChips [data-r=""]').classList.add('on');
}
function _closeRegister(){
  document.getElementById('regMask').classList.remove('open');
  document.getElementById('regSheet').classList.remove('open');
  _setMode('find');   // 시트 닫히면 찾기 모드로 복귀
}
function _pickReg(el, type){
  const row=el.closest('.cc-chip-row');
  row.querySelectorAll('.cc-chip-sel').forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  if(type==='rank') _regRank=el.dataset.rank||'';
  if(type==='region') _regRegion=el.dataset.r||'';
}
function _toggleSpec(el){
  const s=el.dataset.spec;
  if(el.classList.contains('on')){ el.classList.remove('on'); _regSpecs=_regSpecs.filter(x=>x!==s); }
  else { el.classList.add('on'); _regSpecs.push(s); }
}
function _submitRegister(){
  const msg=document.getElementById('regMsg');
  const name=document.getElementById('rName').value.trim();
  if(!name){ msg.style.color='var(--red)'; msg.textContent='업체명을 입력하세요'; return; }
  // 공식 참조 DB는 읽기전용 — 직접등록은 내 기기(localStorage)에 저장하고 검색목록에 병합
  const entry={name, ceo:document.getElementById('rCeo').value.trim(),
    tel:document.getElementById('rTel').value.trim(),
    region:_regRegion, address:document.getElementById('rAddr').value.trim(),
    rank_group:_regRank, specialties:_regSpecs,
    note:document.getElementById('rNote').value.trim(), source:'user_input'};
  try{
    const list=_userVendors().filter(x=>x.name!==entry.name);   // 동명 중복 갱신
    list.unshift(entry);
    localStorage.setItem('sf_user_vendors', JSON.stringify(list));
    msg.style.color='var(--green)'; msg.textContent='✓ 등록 완료 — 내 목록에 추가됨';
    setTimeout(()=>{ _closeRegister(); _run(); }, 900);
  }catch(e){ msg.style.color='var(--red)'; msg.textContent='저장 실패: '+e.message; }
}

window.addEventListener('DOMContentLoaded', ()=>{ _initRegions(); _run(); });
</script>
</body>
</html>
