<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>C20 — 다중농가 클러스터 관제 | KAASA Farmingsight</title>
  <link rel="stylesheet" href="../components/base.css"/>
  <style>
    .ca-body{padding:14px;max-width:480px;margin:0 auto;padding-bottom:90px;}
    .ca-hero{background:linear-gradient(135deg,#0b3d2e,#14897a);border-radius:var(--radius);padding:16px 18px;color:#fff;margin-bottom:12px;}
    .ca-hero-n{font-size:30px;font-weight:900;line-height:1;}
    .ca-hero-s{font-size:12px;opacity:.92;margin-top:5px;}
    .ca-stat-row{display:flex;gap:8px;margin-bottom:12px;}
    .ca-stat{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center;}
    .ca-stat-v{font-size:18px;font-weight:900;}.ca-stat-l{font-size:10px;color:var(--muted);margin-top:2px;}
    .ca-filter{display:flex;gap:8px;margin-bottom:12px;}
    .ca-filter select{flex:1;min-height:42px;padding:8px 10px;border:1.5px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);font-size:13px;}
    .ca-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
    .ca-row:last-child{border-bottom:none;}
    .ca-row-n{flex:0 0 78px;font-size:13px;font-weight:800;}
    .ca-bar{flex:1;height:9px;background:var(--gray-soft);border-radius:5px;overflow:hidden;}
    .ca-bar>i{display:block;height:100%;border-radius:5px;}
    .ca-row-c{flex:0 0 auto;font-size:11px;color:var(--muted);white-space:nowrap;}
    .ca-row-a{flex:0 0 auto;font-size:11px;font-weight:800;color:var(--red);white-space:nowrap;}
    .al-card{display:flex;align-items:center;gap:10px;background:var(--panel);border:1.5px solid var(--border);border-left:4px solid var(--red);border-radius:12px;padding:11px 13px;margin-bottom:8px;}
    .al-loc{flex:1;font-size:13px;font-weight:800;}
    .al-d{font-size:11px;color:var(--muted);margin-top:2px;}
    .al-go{flex:0 0 auto;padding:8px 12px;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;}
  </style>
</head>
<body>
<header class="sf-header">
  <span style="font-size:13px;color:rgba(255,255,255,.85);cursor:pointer;" onclick="location.href='../index.html'">‹ 메뉴</span>
  <span style="font-size:15px;font-weight:800;color:#fff;">다중농가 클러스터 관제</span>
  <span style="width:40px;"></span>
</header>
<main class="ca-body">
  <div id="publicRoleBanner" style="display:none;font-size:11.5px;background:var(--blue-soft);color:var(--blue);border-radius:10px;padding:9px 12px;margin-bottom:10px;line-height:1.5;">
    🏛️ <b>공공기관 모드</b> — 지역·작목 광역 작황/이상 <b>조회</b>가 가능합니다. 정책·보조금 신청·정책 시뮬레이션은 <b>준비 중</b>입니다.
  </div>
  <div class="ca-hero">
    <div style="font-size:12px;opacity:.9;">관제 대상 농가</div>
    <div class="ca-hero-n" id="caTotal">—</div>
    <div class="ca-hero-s" id="caSub">집계 중…</div>
  </div>
  <div class="ca-stat-row" id="caStats"></div>
  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <button onclick="_report()" style="flex:1;padding:12px;background:var(--panel);border:1.5px dashed var(--blue,#2563eb);color:var(--blue,#2563eb);border-radius:12px;font-size:12.5px;font-weight:800;cursor:pointer;min-height:46px;">📄 관제 보고서 PDF</button>
    <button onclick="_notify()" style="flex:1;padding:12px;background:var(--panel);border:1.5px dashed var(--red);color:var(--red);border-radius:12px;font-size:12.5px;font-weight:800;cursor:pointer;min-height:46px;">🔔 이상농가 일괄 알림</button>
  </div>
  <div id="caMsg" style="font-size:12px;font-weight:700;text-align:center;min-height:16px;margin-bottom:8px;"></div>
  <div class="ca-filter">
    <select id="fRegion" onchange="_reload()"><option value="">전체 지역</option></select>
    <select id="fCrop" onchange="_reload()"><option value="">전체 작목</option></select>
  </div>

  <div class="section-label">지역 클러스터 (작황·이상)</div>
  <div class="card" style="padding:12px 14px;" id="caRegion"></div>

  <div class="section-label" style="margin-top:14px;">작목 클러스터</div>
  <div class="card" style="padding:12px 14px;" id="caCrop"></div>

  <div class="section-label" style="margin-top:14px;display:flex;justify-content:space-between;align-items:center;">
    <span>이상 농가 위치특정 <span class="trust-badge trust-live">🟢 진단→위치→실행</span></span>
    <a href="f8_cluster.html" style="font-size:11.5px;font-weight:700;color:var(--blue,#2563eb);text-decoration:none;padding:6px 12px;border:1.5px solid var(--blue,#2563eb);border-radius:12px;min-height:36px;display:inline-flex;align-items:center;">🛰️ 작황 상세</a>
  </div>
  <div id="caAlerts"></div>
</main>
<nav class="sf-bottom-nav">
  <button class="bnav-tab" onclick="location.href='c3_home.html'"><span class="bnav-icon">🏠</span>홈</button>
  <button class="bnav-tab" onclick="location.href='g1_home.html'"><span class="bnav-icon">🌱</span>온실</button>
  <button class="bnav-tab" onclick="location.href='f1_field.html'"><span class="bnav-icon">🌾</span>노지</button>
  <button class="bnav-tab" onclick="location.href='c12_joint.html'"><span class="bnav-icon">🚚</span>출하</button>
  <button class="bnav-tab" onclick="location.href='../index.html'"><span class="bnav-icon">≡</span>메뉴</button>
</nav>
<script src="../components/data.js"></script>
<script>
'use strict';
let _tokG='', _inited=false, _DATA=null, _isDemo=false;
function _report(){
  const r=document.getElementById('fRegion').value, c=document.getElementById('fCrop').value;
  location.href=`c20_report.html?region=${encodeURIComponent(r)}&crop=${encodeURIComponent(c)}`;
}
async function _notify(){
  if(!_DATA||!(_DATA.alerts||[]).length){ _msg('이상 농가가 없습니다.','var(--muted)'); return; }
  const ids=(_DATA.alerts||[]).map(a=>a.farm_id);
  if(_isDemo){ _msg(`🧪 샘플 시뮬레이션 — 실제 환경에서는 이상 농가 ${ids.length}곳에 현장점검 지시가 일괄 기록됩니다.`,'var(--orange)'); return; }
  if(!confirm(`이상 농가 ${ids.length}곳에 현장점검 지시를 기록할까요?`)) return;
  const api=(window.KaasaData&&KaasaData.getApiBase)?KaasaData.getApiBase():location.origin;
  const region=document.getElementById('fRegion').value, crop=document.getElementById('fCrop').value;
  try{
    // ★ r.ok 검사 필수 — 구: .then(r=>r.json())로 바로 파싱해 403(데모 게이트)에도
    //   d.recorded/d.note가 undefined인 채 "✓ undefined곳 지시 기록 · undefined"라는
    //   가짜 성공을 표시했음. PC 콘솔(components/console_cluster.js:172-174)과 동일 처리.
    const r=await fetch(`${api}/api/admin/cluster/notify`,{method:'POST',
      headers:{'Content-Type':'application/json',Authorization:`Bearer ${_tokG}`},
      body:JSON.stringify({farm_ids:ids,region,crop,message:'위성·진단 기반 작황 이상 — 현장 점검 요망'})});
    if(r.ok){
      const d=await r.json();
      _msg(`✓ ${d.recorded}곳 지시 기록 · ${d.note||''}`, d.dispatched?'var(--green)':'var(--orange)');
    } else if(r.status===403){
      _msg('공개 데모에서는 알림 발송이 비활성화되어 있습니다 — 기록되지 않았습니다.','var(--orange)');
    } else {
      _msg(`알림 기록 실패 (${r.status}) — 관리자 권한이 필요합니다.`,'var(--red)');
    }
  }catch(e){ _msg('알림 기록 실패: '+e.message,'var(--red)'); }
}
function _msg(t,c){ const el=document.getElementById('caMsg'); if(el){ el.style.color=c||'var(--text)'; el.textContent=t; } }
// 공개 데모/네트워크 차단 시 사용하는 샘플 시뮬레이션 데이터셋 (PII 없음·합성)
const _DEMO_OVERVIEW={"total_farms":725,"summary":{"avg_vigor":0.643,"avg_diag":70,"anomaly":227,"warn":200,"normal":298,"anomaly_pct":31.3},"regions":["전남","경기","경남","전북","충남","경북","강원","충북"],"crops":["딸기","완숙토마토","방울토마토","파프리카","오이","국화","참외","가지","감귤"],"by_region":[{"name":"전남","count":187,"avg_vigor":0.624,"avg_diag":71,"anomaly":62,"warn":60},{"name":"경기","count":121,"avg_vigor":0.64,"avg_diag":69,"anomaly":39,"warn":38},{"name":"경남","count":96,"avg_vigor":0.635,"avg_diag":71,"anomaly":31,"warn":17},{"name":"전북","count":93,"avg_vigor":0.658,"avg_diag":68,"anomaly":26,"warn":34},{"name":"충남","count":85,"avg_vigor":0.65,"avg_diag":71,"anomaly":26,"warn":18},{"name":"경북","count":51,"avg_vigor":0.667,"avg_diag":72,"anomaly":13,"warn":11},{"name":"강원","count":43,"avg_vigor":0.677,"avg_diag":69,"anomaly":13,"warn":10},{"name":"충북","count":33,"avg_vigor":0.648,"avg_diag":69,"anomaly":8,"warn":11}],"by_crop":[{"name":"딸기","count":192,"avg_vigor":0.643,"avg_diag":69,"anomaly":58,"warn":56},{"name":"완숙토마토","count":194,"avg_vigor":0.645,"avg_diag":70,"anomaly":57,"warn":52},{"name":"방울토마토","count":138,"avg_vigor":0.653,"avg_diag":70,"anomaly":41,"warn":43},{"name":"파프리카","count":90,"avg_vigor":0.629,"avg_diag":70,"anomaly":33,"warn":22},{"name":"오이","count":51,"avg_vigor":0.62,"avg_diag":70,"anomaly":18,"warn":16},{"name":"국화","count":18,"avg_vigor":0.634,"avg_diag":71,"anomaly":9,"warn":3},{"name":"참외","count":26,"avg_vigor":0.681,"avg_diag":75,"anomaly":5,"warn":5},{"name":"가지","count":5,"avg_vigor":0.633,"avg_diag":64,"anomaly":2,"warn":1},{"name":"감귤","count":3,"avg_vigor":0.708,"avg_diag":61,"anomaly":2,"warn":0}],"alerts":[{"location":"전남 장흥","crop":"파프리카","detail":"작황 NDVI 0.31 · 진단 48점","farm_id":"전남_장흥_파프리카_20_1","vigor":0.31,"diag":48},{"location":"충남 부여","crop":"방울토마토","detail":"작황 NDVI 0.35 · 진단 52점","farm_id":"충남_부여_방울토마토_13_1","vigor":0.35,"diag":52},{"location":"경기 평택","crop":"방울토마토","detail":"작황 NDVI 0.39 · 진단 55점","farm_id":"경기_평택_방울토마토_8_2","vigor":0.39,"diag":55},{"location":"경기 안성","crop":"오이","detail":"작황 NDVI 0.42 · 진단 57점","farm_id":"경기_안성_오이_9_1","vigor":0.42,"diag":57},{"location":"전남 장성","crop":"파프리카","detail":"작황 NDVI 0.45 · 진단 60점","farm_id":"전남_장성_파프리카_25_1","vigor":0.45,"diag":60},{"location":"경남 사천","crop":"완숙토마토","detail":"작황 NDVI 0.48 · 진단 62점","farm_id":"경남_사천_완숙토마토_58_1","vigor":0.48,"diag":62}]};
const VCOL=v=>v>=0.62?'#16a34a':v>=0.55?'#f59e0b':'#dc2626';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
window.addEventListener('DOMContentLoaded',()=>{
  try{ if(localStorage.getItem('sf_signup_role')==='public') document.getElementById('publicRoleBanner').style.display='block'; }catch(e){}
  _ensureToken().then(t=>{ _tokG=t; _reload(); });
});
async function _ensureToken(){const s=sessionStorage.getItem('sf_token');if(s)return s;try{const a=sessionStorage.getItem('sf_api')||location.origin;const r=await fetch(`${a}/api/v1/auth/demo-token`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});if(r.ok){const d=await r.json();sessionStorage.setItem('sf_token',d.access_token);return d.access_token;}}catch{}return '';}
function _drill(fid){ sessionStorage.setItem('sf_farm_id',fid); location.href='c17_diagnosis.html?farm='+encodeURIComponent(fid); }
async function _reload(){
  const api=(window.KaasaData&&KaasaData.getApiBase)?KaasaData.getApiBase():location.origin;
  const region=document.getElementById('fRegion').value, crop=document.getElementById('fCrop').value;
  let d, isDemo=false;
  try{
    const qs=`region=${encodeURIComponent(region)}&crop=${encodeURIComponent(crop)}`;
    let r=await fetch(`${api}/api/admin/cluster/overview?${qs}`,{headers:{Authorization:`Bearer ${_tokG}`}});
    if(r.ok){ d=await r.json(); }
    else {
      // 비관리자(공공기관 등) → 조회 전용 공개 엔드포인트 폴백(실데이터)
      const rp=await fetch(`${api}/api/cluster/overview?${qs}`);
      if(rp.ok){ d=await rp.json(); }
      else { d=_DEMO_OVERVIEW; isDemo=true; }   // 그래도 실패 시 샘플 시연
    }
  }
  catch(e){ d=_DEMO_OVERVIEW; isDemo=true; }   // 네트워크 차단 시에도 샘플로 시연
  if(!d || d.total_farms==null){ document.getElementById('caSub').textContent='데이터 없음'; return; }
  _DATA=d; _isDemo=isDemo;
  const s=d.summary||{};
  document.getElementById('caTotal').textContent=`${d.total_farms.toLocaleString()} 농가`;
  document.getElementById('caSub').textContent=`평균 작황 NDVI ${s.avg_vigor} · 평균 진단 ${s.avg_diag}점`+(_isDemo?' · 🧪 샘플 시뮬레이션(데모)':'');
  document.getElementById('caStats').innerHTML=`
    <div class="ca-stat"><div class="ca-stat-v" style="color:var(--red)">${s.anomaly}</div><div class="ca-stat-l">이상 (${s.anomaly_pct}%)</div></div>
    <div class="ca-stat"><div class="ca-stat-v" style="color:var(--orange)">${s.warn}</div><div class="ca-stat-l">주의</div></div>
    <div class="ca-stat"><div class="ca-stat-v" style="color:var(--green)">${s.normal}</div><div class="ca-stat-l">정상</div></div>`;
  if(!_inited){
    document.getElementById('fRegion').innerHTML='<option value="">전체 지역</option>'+(d.regions||[]).map(r=>`<option value="${esc(r)}">${esc(r)}</option>`).join('');
    document.getElementById('fCrop').innerHTML='<option value="">전체 작목</option>'+(d.crops||[]).map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
    _inited=true;
  }
  const maxR=Math.max(...(d.by_region||[]).map(r=>r.count),1);
  document.getElementById('caRegion').innerHTML=(d.by_region||[]).map(r=>`
    <div class="ca-row"><span class="ca-row-n">${esc(r.name)}</span>
      <div class="ca-bar"><i style="width:${Math.round(r.count/maxR*100)}%;background:${VCOL(r.avg_vigor)}"></i></div>
      <span class="ca-row-c">${r.count}농가·작황${r.avg_vigor}</span>
      ${r.anomaly?`<span class="ca-row-a">⚠${r.anomaly}</span>`:''}</div>`).join('')||'<div style="color:var(--muted);font-size:12px;">데이터 없음</div>';
  const maxC=Math.max(...(d.by_crop||[]).map(r=>r.count),1);
  document.getElementById('caCrop').innerHTML=(d.by_crop||[]).map(r=>`
    <div class="ca-row"><span class="ca-row-n">${esc(r.name)}</span>
      <div class="ca-bar"><i style="width:${Math.round(r.count/maxC*100)}%;background:${VCOL(r.avg_vigor)}"></i></div>
      <span class="ca-row-c">${r.count}농가</span>
      ${r.anomaly?`<span class="ca-row-a">⚠${r.anomaly}</span>`:''}</div>`).join('')||'<div style="color:var(--muted);font-size:12px;">데이터 없음</div>';
  document.getElementById('caAlerts').innerHTML=(d.alerts||[]).slice(0,12).map(a=>`
    <div class="al-card">
      <div style="flex:1;"><div class="al-loc">📍 ${esc(a.location)} · ${esc(a.crop)}</div><div class="al-d">${esc(a.detail)}</div></div>
      <button class="al-go" onclick="_drill('${esc(a.farm_id)}')">진단 →</button>
    </div>`).join('')||'<div style="text-align:center;padding:16px;color:var(--green);font-size:13px;">✅ 이상 농가 없음</div>';
}
</script>
</body>
</html>
