<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>F5 — 원격탐사 | KAASA SmartOS</title>
  <link rel="stylesheet" href="../components/base.css"/>
  <style>
    .layer-tabs{display:flex;gap:6px;margin-bottom:10px;}
    .layer-tab{flex:1;padding:9px 4px;border-radius:var(--radius-sm);border:1.5px solid var(--border);background:var(--panel);font-size:12px;font-weight:700;text-align:center;cursor:pointer;color:var(--muted);}
    .layer-tab.active{border-color:var(--green);background:var(--green-soft);color:var(--green-dark);}
    .ndvi-map{border-radius:var(--radius);height:240px;position:relative;overflow:hidden;box-shadow:var(--shadow);margin-bottom:6px;}
    .ndvi-cell{position:absolute;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;}
    .map-mock-tag{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.5);color:#fff;font-size:9px;padding:2px 6px;border-radius:6px;z-index:5;}
    .legend{display:flex;gap:12px;justify-content:center;font-size:10px;color:var(--muted);margin-bottom:12px;}
    .legend-dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:3px;vertical-align:middle;}
    .check-item{display:flex;gap:10px;padding:11px 13px;background:var(--panel);border-radius:var(--radius-sm);margin-bottom:8px;box-shadow:var(--shadow);border-left:4px solid var(--orange);}
    .ci-t{font-size:13px;font-weight:800;}.ci-d{font-size:12px;color:var(--muted);margin-top:2px;}
    .mock-note{font-size:10px;color:var(--muted);background:var(--panel-soft);border-radius:8px;padding:8px 10px;margin:12px 0;}
  </style>
</head>
<body>
<header class="sf-header">
  <span style="font-size:13px;color:rgba(255,255,255,.85);cursor:pointer;" onclick="location.href='f1_field.html'">‹ 노지</span>
  <span style="font-size:15px;font-weight:800;color:#fff;">F5 원격탐사</span><span style="width:40px;"></span>
</header>
<main class="sf-main" style="padding:14px;max-width:480px;margin:0 auto;">
  <div class="section-label">탐사 레이어</div>
  <div class="layer-tabs" id="layerTabs"></div>
  <div class="ndvi-map" id="ndviMap"><span class="map-mock-tag" id="layerTag">NDVI Mock</span></div>
  <div class="legend"><span><span class="legend-dot" style="background:#dc2626;"></span>저활력</span><span><span class="legend-dot" style="background:#f59e0b;"></span>보통</span><span><span class="legend-dot" style="background:#16a34a;"></span>고활력</span></div>
  <div class="mock-note">ℹ️ 원격탐사 이미지는 위성/드론 미연동 상태로 예시(Mock)입니다. NDVI/NDRE/열화상 영상 연동 시 실제 생육 편차로 교체됩니다.</div>
  <div class="section-label">현장 확인 필요 구역</div>
  <div id="checkList"></div>
</main>
<nav class="sf-bottom-nav">
  <button class="bnav-tab" onclick="location.href='c3_home.html'"><span class="bnav-icon">🏠</span>홈</button>
  <button class="bnav-tab" onclick="location.href='g1_home.html'"><span class="bnav-icon">🌱</span>온실</button>
  <button class="bnav-tab" onclick="location.href='f1_field.html'"><span class="bnav-icon">🌾</span>노지</button>
  <button class="bnav-tab" onclick="location.href='c12_joint.html'"><span class="bnav-icon">🚚</span>출하</button>
  <button class="bnav-tab" onclick="location.href='../index.html'"><span class="bnav-icon">≡</span>메뉴</button>
</nav>
<script>
'use strict';
const LAYERS=['NDVI','NDRE','열화상','RGB'];
let _layer='NDVI';
// Mock 12셀 활력값
const CELLS=[0.82,0.78,0.45,0.71,0.88,0.52,0.39,0.76,0.81,0.69,0.58,0.84];
function _color(v){return v>=0.7?'#16a34a':v>=0.5?'#f59e0b':'#dc2626';}
window.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('layerTabs').innerHTML=LAYERS.map(l=>`<div class="layer-tab ${l===_layer?'active':''}" onclick="_sel('${l}',this)">${l}</div>`).join('');
  _renderMap(); _renderCheck();
});
function _sel(l,el){_layer=l;document.querySelectorAll('.layer-tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('layerTag').textContent=l+' Mock';_renderMap();}
function _renderMap(){
  const map=document.getElementById('ndviMap');
  map.querySelectorAll('.ndvi-cell').forEach(e=>e.remove());
  const cols=4,rows=3,gap=2;
  let html='';
  CELLS.forEach((v,i)=>{
    const c=i%cols,r=Math.floor(i/cols);
    const w=(100-gap*(cols+1))/cols, h=(100-gap*(rows+1))/rows;
    const x=gap+c*(w+gap), y=gap+r*(h+gap);
    // 열화상이면 색 반전 느낌, RGB면 녹색계열
    let col=_color(v);
    if(_layer==='열화상') col=v>=0.7?'#3b82f6':v>=0.5?'#f59e0b':'#dc2626';
    else if(_layer==='RGB') col='#4d7c0f';
    html+=`<div class="ndvi-cell" style="left:${x}%;top:${y}%;width:${w}%;height:${h}%;background:${col};">${_layer==='RGB'?'':v.toFixed(2)}</div>`;
  });
  map.insertAdjacentHTML('beforeend',html);
}
function _renderCheck(){
  const low=CELLS.map((v,i)=>({v,i})).filter(x=>x.v<0.5);
  const el=document.getElementById('checkList');
  if(!low.length){el.innerHTML='<div class="card" style="padding:14px;text-align:center;color:var(--green);">✅ 저활력 구역 없음</div>';return;}
  el.innerHTML=low.map(x=>`<div class="check-item"><span style="font-size:20px;">📍</span><div><div class="ci-t">${Math.floor(x.i/4)+1}행 ${x.i%4+1}열 구역 — 생육 저조</div><div class="ci-d">NDVI ${x.v.toFixed(2)} (저활력) · 현장 확인 권장. 관수·시비 점검 또는 병해 의심.</div></div></div>`).join('');
}
</script>
</body>
</html>
