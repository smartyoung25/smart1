<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>C4 — AI 진단 | KAASA SmartOS</title>
  <link rel="stylesheet" href="../components/base.css"/>
  <style>
    .diag-hero { background:linear-gradient(135deg,#1e3a5f 0%,#7c3aed 100%); border-radius:var(--radius); padding:18px 20px; margin-bottom:14px; color:#fff; }
    .diag-score { font-size:34px; font-weight:900; line-height:1; }
    .diag-grade { font-size:14px; opacity:.85; margin-top:4px; }
    .diag-sub { font-size:12px; opacity:.7; margin-top:8px; }

    .rec-card { background:var(--panel); border-radius:var(--radius-sm); box-shadow:var(--shadow); margin-bottom:10px; overflow:hidden; border:1.5px solid var(--border); }
    .rec-head { display:flex; align-items:center; gap:10px; padding:12px 14px; cursor:pointer; }
    .rec-rank { width:26px; height:26px; border-radius:50%; background:var(--purple); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900; flex-shrink:0; }
    .rec-title { flex:1; font-size:14px; font-weight:800; }
    .rec-conf { font-size:12px; font-weight:800; color:var(--green); }
    .rec-chev { font-size:12px; color:var(--muted); transition:transform .2s; }
    .rec-card.open .rec-chev { transform:rotate(180deg); }
    .rec-body { display:none; padding:0 14px 14px; }
    .rec-card.open .rec-body { display:block; }
    .rec-metric { display:flex; justify-content:space-between; font-size:12px; padding:6px 0; border-bottom:1px solid var(--border); }
    .rec-metric .k { color:var(--muted); } .rec-metric .v { font-weight:700; }

    .anom-item { display:flex; gap:10px; padding:11px 13px; border-radius:var(--radius-sm); margin-bottom:8px; border:1px solid var(--border); }
    .anom-item.major { background:var(--orange-soft); border-color:var(--orange); }
    .anom-item.minor { background:var(--blue-soft); border-color:#93c5fd; }
    .anom-v { font-size:13px; font-weight:800; } .anom-m { font-size:11px; color:var(--muted); margin-top:2px; }

    /* 전문가 예약 버튼 */
    .expert-btn { width:100%; padding:14px; background:var(--purple); color:#fff; border:none; border-radius:var(--radius-sm); font-size:15px; font-weight:800; cursor:pointer; }
    .sheet-bd{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;}
    .sheet{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-radius:var(--radius) var(--radius) 0 0;padding:20px;z-index:400;box-shadow:0 -4px 24px rgba(0,0,0,.15);}
    .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px;}
    .expert-opt{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;cursor:pointer;}
    .expert-opt.sel{border-color:var(--purple);background:var(--purple-soft);}

    .ws-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;}
    .ws-dot.connected{background:var(--green);box-shadow:0 0 0 3px rgba(31,122,77,.2);}
  </style>
</head>
<body>

<header class="sf-header">
  <div style="display:flex;align-items:center;gap:6px;">
    <span class="ws-dot" id="wsDot"></span>
    <span style="font-size:12px;color:rgba(255,255,255,.8)" id="wsLabel">연결 중…</span>
  </div>
  <span style="font-size:15px;font-weight:800;color:#fff;">C4 AI 진단</span>
  <select id="farmSel" aria-label="농장 선택" onchange="onFarmChange(this.value)"
          style="font-size:12px;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:8px;padding:4px 8px;cursor:pointer;outline:none;">
    <option value="farm_001">farm_001</option>
  </select>
</header>

<main class="sf-main" style="padding:14px;max-width:480px;margin:0 auto;">

  <div class="diag-hero">
    <div style="font-size:12px;opacity:.75;">AI 종합 진단 점수</div>
    <div class="diag-score" id="diagScore">—</div>
    <div class="diag-grade" id="diagGrade">분석 중…</div>
    <div class="diag-sub" id="diagSub">recommendations·anomalies 기반 종합 평가</div>
  </div>

  <!-- AI 추천 (Accordion) -->
  <div class="section-label">AI 1차 진단 — 개선 추천</div>
  <div id="recList"><div style="text-align:center;padding:14px;color:var(--muted);"><div class="spinner"></div></div></div>

  <!-- 이상 감지 -->
  <div class="section-label" style="margin-top:16px;">환경 이상 감지</div>
  <div id="anomList"></div>

  <!-- 전문가 상담 -->
  <div class="section-label" style="margin-top:16px;">전문가 컨설팅</div>
  <div class="card" style="padding:14px;">
    <div style="font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.5;">AI 진단으로 해결이 어려운 경우, 분야별 전문가 미팅을 예약할 수 있습니다.</div>
    <button class="expert-btn" onclick="_openSheet()">전문가 미팅 예약</button>
  </div>

</main>

<!-- Bottom Sheet: 전문가 예약 -->
<div class="sheet-bd" id="sheetBd" onclick="_closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <h4 style="font-size:16px;font-weight:800;margin-bottom:12px;">전문가 미팅 예약</h4>
  <div class="expert-opt" onclick="_selExpert('재배기술',this)"><span style="font-size:22px;">🌱</span><div><div style="font-size:14px;font-weight:800;">재배 기술 전문가</div><div style="font-size:11px;color:var(--muted);">환경·관수·생육 최적화</div></div></div>
  <div class="expert-opt" onclick="_selExpert('병해방제',this)"><span style="font-size:22px;">🔬</span><div><div style="font-size:14px;font-weight:800;">병해 방제 전문가</div><div style="font-size:11px;color:var(--muted);">병해충 진단·방제 처방</div></div></div>
  <div class="expert-opt" onclick="_selExpert('경영컨설팅',this)"><span style="font-size:22px;">💼</span><div><div style="font-size:14px;font-weight:800;">경영 컨설턴트</div><div style="font-size:11px;color:var(--muted);">수익성·출하 전략</div></div></div>
  <div style="display:flex;gap:8px;margin-top:14px;">
    <button onclick="_confirmExpert()" style="flex:1;padding:13px;background:var(--purple);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:800;cursor:pointer;">예약 신청</button>
    <button onclick="_closeSheet()" style="flex:1;padding:13px;background:var(--panel);color:var(--muted);border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;">취소</button>
  </div>
  <div id="expertResult" style="margin-top:10px;font-size:12px;text-align:center;color:var(--green);"></div>
</div>

<nav class="sf-bottom-nav">
  <button class="bnav-tab" onclick="location.href='c3_home.html'"><span class="bnav-icon">🏠</span>홈</button>
  <button class="bnav-tab" onclick="location.href='g1_home.html'"><span class="bnav-icon">🌱</span>온실</button>
  <button class="bnav-tab" onclick="location.href='f1_field.html'"><span class="bnav-icon">🌾</span>노지</button>
  <button class="bnav-tab" onclick="location.href='c12_joint.html'"><span class="bnav-icon">🚚</span>출하</button>
  <button class="bnav-tab" onclick="location.href='../index.html'"><span class="bnav-icon">≡</span>메뉴</button>
</nav>

<script src="../components/data.js"></script>
<script>
'use strict';
let _expert='';
let _tokenG='', _farmG='farm_001';

window.addEventListener('DOMContentLoaded', ()=>{
  const farmId=new URLSearchParams(location.search).get('farm')||sessionStorage.getItem('sf_farm_id')||'farm_001';
  _farmG=farmId;
  _ensureToken().then(token=>{ _tokenG=token; KaasaData.init({farmId,token,onStatus:_onWsStatus}); _loadAll(token,farmId); });
});
async function _logActivity(rec){
  try{ const api=KaasaData.getApiBase?KaasaData.getApiBase():location.origin;
    await fetch(`${api}/api/farms/${_farmG}/activity`,{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+_tokenG},
      body:JSON.stringify(rec)}); }catch(e){}
}
function onFarmChange(id){sessionStorage.setItem('sf_farm_id',id);location.reload();}
async function _ensureToken(){
  const s=sessionStorage.getItem('sf_token');if(s)return s;
  try{const api=sessionStorage.getItem('sf_api')||location.origin;
    const r=await fetch(`${api}/api/v1/auth/token`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'admin',password:'1250'})});
    if(r.ok){const d=await r.json();sessionStorage.setItem('sf_token',d.access_token);return d.access_token;}}catch{}return '';
}
function _onWsStatus(s){const dot=document.getElementById('wsDot'),lbl=document.getElementById('wsLabel');if(dot)dot.className='ws-dot '+s;if(lbl)lbl.textContent=s==='connected'?'실시간 연결 중':s==='reconnecting'?'재연결 중…':'연결 안 됨';}

async function _loadAll(token, farmId){
  const api=KaasaData.getApiBase(), H={Authorization:`Bearer ${token}`};
  const [rec, anom, summary] = await Promise.all([
    fetch(`${api}/api/farms/${farmId}/recommendations`,{headers:H}).then(r=>r.ok?r.json():null).catch(()=>null),
    fetch(`${api}/api/farms/${farmId}/anomalies/latest`,{headers:H}).then(r=>r.ok?r.json():null).catch(()=>null),
    fetch(`${api}/api/farms/${farmId}/summary`,{headers:H}).then(r=>r.ok?r.json():null).catch(()=>null),
  ]);
  _renderScore(rec, anom, summary);
  _renderRecs(rec);
  _renderAnoms(anom);
}

function _renderScore(rec, anom, summary){
  // 종합 점수 = 추천 신뢰도 평균 × 100 - 이상값 패널티
  const recs=rec?.recommendations||[];
  const avgConf = recs.length ? recs.reduce((s,r)=>s+(r.confidence||0),0)/recs.length : 0.7;
  const anomCount = anom?.count||0, critical=anom?.critical_count||0;
  let score = Math.round(avgConf*100 - anomCount*3 - critical*10);
  score = Math.max(40, Math.min(99, score));
  const grade = score>=85?'우수':score>=70?'양호':score>=55?'주의':'개선 필요';
  document.getElementById('diagScore').textContent=`${score}점`;
  document.getElementById('diagGrade').textContent=`${grade} · 이상값 ${anomCount}건${critical?` (위험 ${critical})`:''}`;
  document.getElementById('diagSub').textContent=`추천 신뢰도 평균 ${Math.round(avgConf*100)}% · 수확 D-${summary?.harvest_days_remaining??'?'}`;
}

function _renderRecs(rec){
  const recs=rec?.recommendations||[];
  const el=document.getElementById('recList');
  if(!recs.length){ el.innerHTML='<div class="card" style="padding:16px;text-align:center;color:var(--green);">✅ 현재 개선 추천 없음 — 양호</div>'; return; }
  el.innerHTML=recs.slice(0,5).map((r,i)=>`
    <div class="rec-card" id="rec${i}">
      <div class="rec-head" onclick="document.getElementById('rec${i}').classList.toggle('open')">
        <div class="rec-rank">${r.rank||i+1}</div>
        <div class="rec-title">${r.action_ko||'추천'}</div>
        <div class="rec-conf">${Math.round((r.confidence||0)*100)}%</div>
        <div class="rec-chev">▼</div>
      </div>
      <div class="rec-body">
        <div class="rec-metric"><span class="k">예상 이익 증가</span><span class="v" style="color:var(--green)">+${Math.round((r.profit_delta||0)/10000).toLocaleString()}만원</span></div>
        <div class="rec-metric"><span class="k">예상 매출 증가</span><span class="v">+${Math.round((r.revenue_delta||0)/10000).toLocaleString()}만원</span></div>
        <div class="rec-metric"><span class="k">예상 비용 증가</span><span class="v">+${Math.round((r.cost_delta||0)/10000).toLocaleString()}만원</span></div>
        <div class="rec-metric"><span class="k">실행 방식</span><span class="v">${r.tier_action||'—'}</span></div>
      </div>
    </div>`).join('');
}

function _renderAnoms(anom){
  const items=anom?.anomalies||[];
  const el=document.getElementById('anomList');
  if(!items.length){ el.innerHTML='<div class="card" style="padding:14px;text-align:center;color:var(--green);">✅ 환경 이상값 없음</div>'; return; }
  const ICON={vpd:'💧',temp_internal:'🌡️',humidity_int:'💦',co2_ppm:'🌿',solar_rad:'☀️',ec_dsm:'⚡'};
  el.innerHTML=items.map(a=>{
    const cls=a.severity==='major'?'major':'minor';
    const val=a.value!=null?`${Number(a.value).toFixed(a.unit&&a.unit.includes('ppm')?0:2)} ${a.unit||''}`:'—';
    return `<div class="anom-item ${cls}"><span style="font-size:18px;">${ICON[a.variable]||'📊'}</span>
      <div style="flex:1;"><div class="anom-v">${a.variable_ko||a.variable}: ${val}</div>
      <div class="anom-m">정상 ${a.normal_min}~${a.normal_max} ${a.unit||''}</div></div></div>`;
  }).join('');
}

function _openSheet(){document.getElementById('sheetBd').style.display='block';document.getElementById('sheet').style.display='block';document.getElementById('expertResult').textContent='';}
function _closeSheet(){document.getElementById('sheetBd').style.display='none';document.getElementById('sheet').style.display='none';}
function _selExpert(t,el){_expert=t;document.querySelectorAll('.expert-opt').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');}
function _confirmExpert(){
  if(!_expert){alert('전문가 유형을 선택하세요');return;}
  const r=document.getElementById('expertResult');
  r.textContent='예약 신청 중…';
  _logActivity({kind:'consult', item:`전문가 예약: ${_expert}`, detail:`${_expert} 미팅 신청 · ${new Date().toISOString().slice(0,10)}`})
    .then(()=>{ r.textContent=`✓ ${_expert} 미팅 예약 신청 완료 (영업일 1일 내 연락)`; setTimeout(_closeSheet,1800); });
}
</script>
</body>
</html>
