<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>C22 — 등급 비교·업그레이드 | KAASA smartfarmingsight</title>
  <meta name="description" content="등급 비교·업그레이드 — basic·smart·pro·enterprise 4등급 기능 매트릭스와 접근 경로. 스마트팜 구독 등급 안내."/>
  <meta name="keywords" content="스마트팜 등급,구독 요금제,기능 비교,업그레이드,basic smart pro enterprise"/>
  <link rel="canonical" href="https://farmingsight.org/screens/c22_tiers.html"/>
  <meta name="robots" content="index,follow"/>
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="C22 — 등급 비교·업그레이드 | KAASA smartfarmingsight"/>
  <meta property="og:description" content="등급 비교·업그레이드 — basic·smart·pro·enterprise 4등급 기능 매트릭스와 접근 경로. 스마트팜 구독 등급 안내."/>
  <meta property="og:image" content="https://farmingsight.org/og-image.png"/>
  <link rel="stylesheet" href="../components/base.css"/>
  <style>
    .tz-body{padding:14px;max-width:480px;margin:0 auto;}
    .tz-cards{display:flex;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
    .tz-card{flex:0 0 150px;border:1.5px solid var(--border);border-radius:14px;padding:13px;background:var(--panel);box-shadow:var(--shadow);}
    .tz-card.cur{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft);}
    .tz-name{font-size:15px;font-weight:900;}
    .tz-price{font-size:12px;color:var(--muted);margin-top:2px;}
    .tz-quota{font-size:11px;color:var(--muted);margin-top:6px;}
    .tz-cnt{font-size:11px;font-weight:800;margin-top:6px;}
    .tz-btn{width:100%;margin-top:9px;min-height:38px;border:none;border-radius:9px;font-size:12px;font-weight:800;cursor:pointer;}
    .tz-sec{font-size:12.5px;font-weight:900;margin:16px 2px 7px;color:var(--text);display:flex;align-items:center;gap:7px;}
    .tz-sec::before{content:"";width:4px;height:14px;border-radius:3px;background:var(--green);}
    .tz-row{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--border);border-radius:10px;margin-bottom:6px;background:var(--panel);}
    .tz-row .lbl{flex:1;font-size:13px;font-weight:600;}
    .tz-need{font-size:10px;font-weight:800;padding:2px 7px;border-radius:7px;}
    .tz-state{font-size:15px;width:22px;text-align:center;}
    .tz-preview{display:flex;gap:6px;align-items:center;background:var(--panel-soft);border-radius:10px;padding:9px 11px;margin-bottom:6px;font-size:12px;font-weight:700;}
    .tz-preview select{flex:1;min-height:38px;border:1.5px solid var(--border);border-radius:8px;padding:6px 9px;font-size:13px;background:var(--panel);color:var(--text);}
  </style>
</head>
<body>
<header class="sf-header">
  <span style="font-size:13px;color:rgba(255,255,255,.85);cursor:pointer;" onclick="location.href='../index.html'">‹ 메뉴</span>
  <span style="font-size:15px;font-weight:800;color:#fff;">등급 비교·업그레이드</span>
  <span style="width:40px;"></span>
</header>
<main class="tz-body">
  <div class="section-label">등급별 요금·기능</div>
  <div class="tz-cards" id="tzCards"><div style="color:var(--muted);font-size:12px;padding:8px;">불러오는 중…</div></div>

  <div class="tz-preview">
    <span>👁️ 미리보기 등급</span>
    <select id="tzView" onchange="_render()"><option value="">내 등급</option></select>
  </div>
  <div id="tzMatrix"></div>

  <div id="tzMsg" style="font-size:12px;font-weight:700;text-align:center;margin-top:10px;min-height:14px;"></div>
</main>
<nav class="sf-bottom-nav">
  <button class="bnav-tab" onclick="location.href='c3_home.html'"><span class="bnav-icon">🏠</span>홈</button>
  <button class="bnav-tab" onclick="location.href='g1_home.html'"><span class="bnav-icon">🌱</span>온실</button>
  <button class="bnav-tab" onclick="location.href='f1_field.html'"><span class="bnav-icon">🌾</span>노지</button>
  <button class="bnav-tab" onclick="location.href='c12_joint.html'"><span class="bnav-icon">🚚</span>출하</button>
  <button class="bnav-tab" onclick="location.href='../index.html'"><span class="bnav-icon">≡</span>메뉴</button>
</nav>
<script src="../components/data.js"></script>
<script>
'use strict';
const TIERS=[['basic','기본',0,0],['smart','스마트',79000,30],['pro','프로',199000,200],['enterprise','엔터프라이즈',499000,-1]];
const RANK={basic:1,smart:2,pro:3,enterprise:4};
const SEC_KO={environ:'환경',irrigation:'관수·양액',growth:'생육·병해',market:'시장·출하',energy:'에너지·경영',control:'제어·모델',ai_chat:'AI 비서'};
const TCOL={basic:'#8892a4',smart:'#4f8ef7',pro:'#a78bfa',enterprise:'#f9a825'};
let _api,_token,_farm,_myTier='basic',_feats=[];

async function _load(){
  _api=sessionStorage.getItem('sf_api')||location.origin;
  _token=sessionStorage.getItem('sf_token');
  if(!_token){const r=await fetch(`${_api}/api/v1/auth/token`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'admin',password:'1250'})});if(r.ok){_token=(await r.json()).access_token;sessionStorage.setItem('sf_token',_token);}}
  _farm=sessionStorage.getItem('sf_farm_id')||'farm_001';
  try{
    const d=await fetch(`${_api}/api/farms/${_farm}/billing/features`,{headers:{Authorization:`Bearer ${_token}`}}).then(r=>r.json());
    _myTier=d.tier||'basic'; _feats=d.features||[];
  }catch(e){}
  document.getElementById('tzView').innerHTML='<option value="">내 등급 ('+(TIERS.find(t=>t[0]===_myTier)||[,'?'])[1]+')</option>'+
    TIERS.map(t=>`<option value="${t[0]}">${t[1]} 기준 보기</option>`).join('');
  _renderCards(); _render();
}
function _renderCards(){
  document.getElementById('tzCards').innerHTML=TIERS.map(([k,n,p,q])=>{
    const cur=k===_myTier; const cnt=_feats.filter(f=>RANK[f.min_tier]<=RANK[k]).length;
    const btn=cur?`<button class="tz-btn" style="background:var(--green-soft);color:var(--green-dark);" disabled>현재 등급</button>`
      :(RANK[k]>RANK[_myTier]?`<button class="tz-btn" style="background:${TCOL[k]};color:#fff;" onclick="_upgrade('${k}')">업그레이드</button>`
        :`<button class="tz-btn" style="background:var(--panel-soft);color:var(--muted);" disabled>하위 등급</button>`);
    return `<div class="tz-card${cur?' cur':''}"><div class="tz-name" style="color:${TCOL[k]}">${n}</div>
      <div class="tz-price">${p?(p.toLocaleString()+'원/월'):'무료'}</div>
      <div class="tz-quota">AI 상담 ${q<0?'무제한':q+'회/월'}</div>
      <div class="tz-cnt">기능 ${cnt}/${_feats.length}</div>${btn}</div>`;
  }).join('');
}
function _render(){
  const view=document.getElementById('tzView').value||_myTier;
  const secs={};
  _feats.forEach(f=>{ (secs[f.section]=secs[f.section]||[]).push(f); });
  let h='';
  Object.keys(secs).forEach(sec=>{
    h+=`<div class="tz-sec">${SEC_KO[sec]||sec}</div>`;
    h+=secs[sec].map(f=>{
      const ok=RANK[f.min_tier]<=RANK[view];
      return `<div class="tz-row"><span class="tz-state">${ok?'🔓':'🔒'}</span>
        <span class="lbl" style="${ok?'':'color:var(--muted);'}">${f.label_ko}</span>
        <span class="tz-need" style="background:${TCOL[f.min_tier]}22;color:${TCOL[f.min_tier]};">${(TIERS.find(t=>t[0]===f.min_tier)||[,'?'])[1]}</span></div>`;
    }).join('');
  });
  document.getElementById('tzMatrix').innerHTML=h;
}
async function _upgrade(target){
  const msg=document.getElementById('tzMsg'); msg.style.color='var(--muted)'; msg.textContent='업그레이드 요청 중…';
  try{
    const r=await fetch(`${_api}/api/farms/${_farm}/billing/upgrade`,{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${_token}`},body:JSON.stringify({target_tier:target,pg_channel:'manual'})});
    const d=await r.json().catch(()=>({}));
    if(r.ok){ msg.style.color='var(--green)'; msg.textContent=`✓ ${(TIERS.find(t=>t[0]===target)||[,''])[1]} 등급으로 변경되었습니다.`; setTimeout(_load,900); }
    else if(r.status===403){ msg.style.color='var(--orange)'; msg.textContent='데모(읽기전용) — 업그레이드는 운영에서 가능합니다.'; }
    else { msg.style.color='var(--red)'; msg.textContent=d.detail||`오류 ${r.status}`; }
  }catch(e){ msg.style.color='var(--red)'; msg.textContent='네트워크 오류'; }
}
window.addEventListener('DOMContentLoaded',_load);
</script>
</body>
</html>
