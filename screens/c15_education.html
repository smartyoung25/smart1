<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>스마트팜 운영교육 | KAASA smartfarmingsight</title>
  <link rel="stylesheet" href="../components/base.css"/>
  <style>
    .edu-hero{background:linear-gradient(135deg,#5b21b6 0%,#7c3aed 100%);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;color:#fff;}
    .edu-rate{font-size:30px;font-weight:900;}
    .edu-bar{height:8px;background:rgba(255,255,255,.25);border-radius:4px;margin-top:10px;overflow:hidden;}
    .edu-bar-f{height:100%;background:#fff;border-radius:4px;transition:width .6s;}
    .mod-card{background:var(--panel);border-radius:var(--radius-sm);box-shadow:var(--shadow);margin-bottom:8px;overflow:hidden;border:1.5px solid var(--border);}
    .mod-card.done{border-color:var(--green);}
    .mod-head{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;}
    .mod-ico{font-size:24px;flex-shrink:0;}
    .mod-title{flex:1;font-size:14px;font-weight:800;}
    .mod-sub{font-size:11px;color:var(--muted);margin-top:1px;}
    .mod-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;}
    .mod-card.done .mod-check{background:var(--green);border-color:var(--green);color:#fff;}
    .mod-body{display:none;padding:0 14px 14px;}
    .mod-card.expanded .mod-body{display:block;}
    .lesson{font-size:12px;color:var(--text);padding:5px 0 5px 18px;position:relative;}
    .lesson::before{content:'•';position:absolute;left:4px;color:var(--purple);}
    .mod-btn{width:100%;margin-top:10px;padding:11px;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:800;cursor:pointer;}
    .ws-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;}
  </style>
</head>
<body>
<header class="sf-header">
  <span style="font-size:13px;color:rgba(255,255,255,.85);cursor:pointer;" onclick="location.href='../index.html'">‹ 메뉴</span>
  <span style="font-size:15px;font-weight:800;color:#fff;">스마트팜 운영교육</span>
  <span style="width:40px;"></span>
</header>
<main class="sf-main" style="padding:14px;max-width:480px;margin:0 auto;">
  <div class="edu-hero">
    <div style="font-size:12px;opacity:.75;">경영성과 기반 운영관리 교육과정</div>
    <div class="edu-rate"><span id="eduRate">0</span>% 이수</div>
    <div style="font-size:13px;opacity:.85;" id="eduDone">0 / 8 모듈 완료</div>
    <div class="edu-bar"><div class="edu-bar-f" id="eduBar" style="width:0%"></div></div>
  </div>
  <div class="section-label">6대 운영관리 교육모듈 + 심화</div>
  <div id="modList"></div>
  <div style="font-size:10px;color:var(--muted);margin-top:12px;text-align:center;">
    스마트농업법 제8조 교육과정 · 이수 시 C7 학습보상 포인트 적립
  </div>
</main>
<nav class="sf-bottom-nav">
  <button class="bnav-tab" onclick="location.href='c3_home.html'"><span class="bnav-icon">🏠</span>홈</button>
  <button class="bnav-tab" onclick="location.href='g1_home.html'"><span class="bnav-icon">🌱</span>온실</button>
  <button class="bnav-tab" onclick="location.href='f1_field.html'"><span class="bnav-icon">🌾</span>노지</button>
  <button class="bnav-tab" onclick="location.href='c12_joint.html'"><span class="bnav-icon">🚚</span>출하</button>
  <button class="bnav-tab active"><span class="bnav-icon">≡</span>메뉴</button>
</nav>
<script>
'use strict';
const MODULES=[
  ['m1','💰','경영전략 수립','채널·매출·비용·소득률·ROI',['손익구조 이해','채널별 수취가 분석','목표 소득률 설정','ROI 시뮬레이션 활용']],
  ['m2','🌡️','환경관리','온도·습도·VPD·CO₂·일사·환기·차광·보온',['VPD 개념과 관리','CO₂ 시비 타이밍','환기·차광·보온 연동제어','환경데이터 해석']],
  ['m3','💧','관수·양액관리','급액시점·급액량·배액률·EC·pH',['Priva ET₀ 관수 원리','배액률 20~30% 관리','EC·pH 조정','관수 기록·분석']],
  ['m4','⚡','에너지관리','전력·연료·피크요금·에너지비/kg',['시간대별 요금제 이해','피크 회피 운영','보온커튼·이중화','에너지비/kg 절감']],
  ['m5','🔬','병해관리','결로시간·병해위험도·이미지진단·IPM',['결로 조기경보 활용','환경기반 병해예방','이미지 진단','IPM·약제저항성 관리']],
  ['m6','🚚','수확·출하관리','수확량·상품률·출하시기·채널·수취가',['수확 예측 활용','상품률 향상','출하 시기 결정','공동출하 전략']],
  ['m7','📋','경영성과 리포트 해석','월간 리포트·성과지표',['9대 성과지표 이해','취약항목 진단','변화율 추세 분석']],
  ['m8','✅','실행계획 수립·점검','To-do·이행점검',['실행 To-do 작성','2~4주 이행점검','전문가 컨설팅 연계']],
];
window.addEventListener('DOMContentLoaded',_render);
function _key(){return 'sf_edu_done';}
function _doneSet(){return new Set(JSON.parse(localStorage.getItem(_key())||'[]'));}
function _render(){
  const done=_doneSet();
  document.getElementById('modList').innerHTML=MODULES.map(([id,ic,t,sub,lessons])=>`
    <div class="mod-card ${done.has(id)?'done':''}" id="mod-${id}">
      <div class="mod-head" onclick="document.getElementById('mod-${id}').classList.toggle('expanded')">
        <span class="mod-ico">${ic}</span>
        <div class="mod-title">${t}<div class="mod-sub">${sub}</div></div>
        <div class="mod-check">${done.has(id)?'✓':''}</div>
      </div>
      <div class="mod-body">
        ${lessons.map(l=>`<div class="lesson">${l}</div>`).join('')}
        <button class="mod-btn" style="background:${done.has(id)?'var(--gray-soft)':'var(--purple)'};color:${done.has(id)?'var(--muted)':'#fff'};" onclick="event.stopPropagation();_toggle('${id}')">
          ${done.has(id)?'이수 취소':'이수 완료 체크'}</button>
      </div>
    </div>`).join('');
  const n=done.size, rate=Math.round(n/MODULES.length*100);
  document.getElementById('eduRate').textContent=rate;
  document.getElementById('eduDone').textContent=`${n} / ${MODULES.length} 모듈 완료`;
  document.getElementById('eduBar').style.width=`${rate}%`;
}
function _toggle(id){
  const arr=JSON.parse(localStorage.getItem(_key())||'[]');
  const i=arr.indexOf(id);
  const isNewDone = i<0;
  if(i>=0)arr.splice(i,1); else arr.push(id);
  localStorage.setItem(_key(),JSON.stringify(arr));
  _render();
  localStorage.setItem('sf_edu_rate', String(Math.round(arr.length/MODULES.length*100)));
  // 폐루프: 이수 완료 시 서버 활동 로그 적재 (학습 기여)
  if(isNewDone) _logActivity(id);
}
async function _logActivity(modId){
  try{
    const api=sessionStorage.getItem('sf_api')||location.origin;
    let token=sessionStorage.getItem('sf_token');
    if(!token){ const r=await fetch(`${api}/api/v1/auth/token`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'admin',password:'1250'})}); if(r.ok){token=(await r.json()).access_token; sessionStorage.setItem('sf_token',token);} }
    const farmId=sessionStorage.getItem('sf_farm_id')||'farm_001';
    const mod=MODULES.find(m=>m[0]===modId);
    await fetch(`${api}/api/farms/${farmId}/activity`,{method:'POST',
      headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},
      body:JSON.stringify({kind:'education',item:mod?mod[2]:modId,detail:'교육 이수'})});
  }catch(e){/* 오프라인 시 무시 */}
}
</script>
<script src="../components/data.js"></script>
</body>
</html>
