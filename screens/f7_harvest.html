<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>F7 — 노지 수확·유통 | KAASA SmartOS</title>
  <link rel="stylesheet" href="../components/base.css"/>
  <style>
    .f7-kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
    .f7-kpi{background:var(--panel);border-radius:var(--radius-sm);padding:14px 8px;box-shadow:var(--shadow);text-align:center;}
    .f7-kpi-ico{font-size:18px;}.f7-kpi-val{font-size:16px;font-weight:900;margin:3px 0;}.f7-kpi-label{font-size:10px;color:var(--muted);}
    .parcel-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;}
    .parcel-strip::-webkit-scrollbar{display:none;}
    .parcel-card{flex-shrink:0;width:160px;background:var(--panel);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border:1.5px solid var(--border);}
    .pc-name{font-size:14px;font-weight:900;}.pc-row{display:flex;justify-content:space-between;font-size:12px;margin-top:6px;}.pc-row .k{color:var(--muted);}.pc-row .v{font-weight:700;}
    .pc-btn{width:100%;margin-top:10px;padding:9px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);font-size:12px;font-weight:800;cursor:pointer;}
    .mock-note{font-size:10px;color:var(--muted);background:var(--panel-soft);border-radius:8px;padding:8px 10px;margin-bottom:12px;}
    .profit-table{width:100%;border-collapse:collapse;}.profit-table td{padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}.profit-table td:last-child{text-align:right;font-weight:800;}.profit-table tr:last-child td{border-bottom:none;color:var(--green);}
    .ws-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;}
    .ws-dot.connected{background:var(--green);box-shadow:0 0 0 3px rgba(31,122,77,.2);}
  </style>
</head>
<body>
<header class="sf-header">
  <div style="display:flex;align-items:center;gap:6px;"><span class="ws-dot" id="wsDot"></span><span style="font-size:12px;color:rgba(255,255,255,.8)" id="wsLabel">연결 중…</span></div>
  <span style="font-size:15px;font-weight:800;color:#fff;">F7 노지 수확·유통</span><span style="width:40px;"></span>
</header>
<main class="sf-main" style="padding:14px;max-width:480px;margin:0 auto;">
  <div class="f7-kpi-row">
    <div class="f7-kpi"><div class="f7-kpi-ico">⚖️</div><div class="f7-kpi-val" id="kYield">—</div><div class="f7-kpi-label">예상 수확량</div></div>
    <div class="f7-kpi"><div class="f7-kpi-ico">💰</div><div class="f7-kpi-val" id="kPrice">—</div><div class="f7-kpi-label">공동출하 단가</div></div>
    <div class="f7-kpi"><div class="f7-kpi-ico">📅</div><div class="f7-kpi-val" id="kDday">—</div><div class="f7-kpi-label">수확 D-day</div></div>
  </div>
  <div class="mock-note">수확량·단가·매출은 ML/KAMIS 실연동, 필지별 분할은 면적 비례 추정입니다.</div>
  <div class="section-label">필지별 수확 예측</div>
  <div class="parcel-strip" id="parcelStrip"></div>
  <div class="section-label" style="margin-top:14px;">노지 수익성 요약 <span class="trust-badge trust-model">🔵 모델</span></div>
  <div class="card" style="padding:14px;">
    <table class="profit-table">
      <tr><td>총 예상 수확량</td><td id="pYield">—</td></tr>
      <tr><td>공동출하 단가</td><td id="pPrice">—</td></tr>
      <tr><td>예상 매출</td><td id="pRevenue">—</td></tr>
      <tr><td>예상 순이익</td><td id="pProfit">—</td></tr>
    </table>
  </div>
  <div style="margin-top:14px;display:flex;gap:8px;">
    <button class="pc-btn" style="padding:14px;font-size:15px;flex:1;background:var(--blue,#2563eb);" onclick="_openHarvestRecord()">🚜 수확 실적 입력</button>
    <button class="pc-btn" style="padding:14px;font-size:15px;flex:1;" onclick="location.href='c12_joint.html'">공동출하 Pool →</button>
  </div>
</main>
<nav class="sf-bottom-nav">
  <button class="bnav-tab" onclick="location.href='c3_home.html'"><span class="bnav-icon">🏠</span>홈</button>
  <button class="bnav-tab" onclick="location.href='g1_home.html'"><span class="bnav-icon">🌱</span>온실</button>
  <button class="bnav-tab" onclick="location.href='f1_field.html'"><span class="bnav-icon">🌾</span>노지</button>
  <button class="bnav-tab" onclick="location.href='c12_joint.html'"><span class="bnav-icon">🚚</span>출하</button>
  <button class="bnav-tab" onclick="location.href='../index.html'"><span class="bnav-icon">≡</span>메뉴</button>
</nav>
<script src="../components/data.js"></script>
<script src="../components/record_sheet.js"></script>
<script>
'use strict';
let _tokenG='', _farmG='farm_001';
const PARCELS=[{n:'1번 필지',a:0.5},{n:'2번 필지',a:0.8},{n:'3번 필지',a:0.4},{n:'4번 필지',a:0.6}];
window.addEventListener('DOMContentLoaded',()=>{
  const farmId=new URLSearchParams(location.search).get('farm')||sessionStorage.getItem('sf_farm_id')||'farm_001';
  _farmG=farmId;
  _ensureToken().then(t=>{_tokenG=t;KaasaData.init({farmId,token:t,onStatus:_ws});_load(t,farmId);});
});

function _openHarvestRecord(){
  RecordSheet.open({
    title:'🚜 필지별 수확 실적 입력',
    submitLabel:'수확 실적 저장',
    fields:[
      {id:'parcel', label:'필지', type:'select', options:PARCELS.map(p=>p.n), required:true},
      {id:'qty',    label:'수확량', type:'number', unit:'kg', placeholder:'예: 320', required:true},
      {id:'grade',  label:'등급', type:'select', options:['특','상','보통','등외']},
      {id:'date',   label:'수확일', type:'date'},
    ],
    onSubmit: async (v)=> RecordSheet.logActivity(_farmG,_tokenG,{
      kind:'harvest', item:`${v.parcel} 수확`, value:parseFloat(v.qty)||null,
      detail:`${v.qty||'-'}kg · 등급 ${v.grade||'-'} · ${v.date||'오늘'}` })
  });
}
async function _ensureToken(){const s=sessionStorage.getItem('sf_token');if(s)return s;try{const a=sessionStorage.getItem('sf_api')||location.origin;const r=await fetch(`${a}/api/v1/auth/token`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'admin',password:'1250'})});if(r.ok){const d=await r.json();sessionStorage.setItem('sf_token',d.access_token);return d.access_token;}}catch{}return '';}
function _ws(s){const d=document.getElementById('wsDot'),l=document.getElementById('wsLabel');if(d)d.className='ws-dot '+s;if(l)l.textContent=s==='connected'?'실시간 연결 중':'연결 안 됨';}
async function _load(token,farmId){
  const api=KaasaData.getApiBase(),H={Authorization:`Bearer ${token}`};
  const [rev,ws,harvest]=await Promise.all([
    fetch(`${api}/api/farms/${farmId}/revenue`,{headers:H}).then(r=>r.ok?r.json():null).catch(()=>null),
    fetch(`${api}/api/farms/${farmId}/market/wholesale`,{headers:H}).then(r=>r.ok?r.json():null).catch(()=>null),
    fetch(`${api}/api/farms/${farmId}/harvest`,{headers:H}).then(r=>r.ok?r.json():null).catch(()=>null),
  ]);
  const fmt=v=>Math.round(v).toLocaleString();
  const yieldKg=rev?.yield_kg_forecast??18000;
  const price=ws?.price_krw_kg??rev?.kamis_price_krw_kg??1800;
  const totalArea=PARCELS.reduce((s,p)=>s+p.a,0);
  // KPI
  document.getElementById('kYield').textContent=`${fmt(yieldKg)}kg`;
  document.getElementById('kPrice').textContent=`${fmt(price)}원`;
  if(harvest?.predicted_date){const dd=Math.round((new Date(harvest.predicted_date)-new Date())/86400000);document.getElementById('kDday').textContent=`D-${dd}`;}
  // 필지 카드 (면적 비례)
  document.getElementById('parcelStrip').innerHTML=PARCELS.map(p=>{
    const pYield=Math.round(yieldKg*p.a/totalArea);
    const pRev=Math.round(pYield*price/10000);
    return `<div class="parcel-card"><div class="pc-name">${p.n}</div>
      <div class="pc-row"><span class="k">면적</span><span class="v">${p.a}ha</span></div>
      <div class="pc-row"><span class="k">예상수확</span><span class="v">${pYield.toLocaleString()}kg</span></div>
      <div class="pc-row"><span class="k">예상매출</span><span class="v">${pRev.toLocaleString()}만원</span></div>
      <button class="pc-btn" onclick="location.href='c12_joint.html'">출하 신청</button></div>`;
  }).join('');
  // 수익성
  const revenue=rev?.revenue_krw??(yieldKg*price);
  const profit=rev?.predicted_profit_krw??(revenue*0.85);
  document.getElementById('pYield').textContent=`${fmt(yieldKg)} kg`;
  document.getElementById('pPrice').textContent=`${fmt(price)} 원/kg`;
  document.getElementById('pRevenue').textContent=`${fmt(revenue/10000)} 만원`;
  document.getElementById('pProfit').textContent=`${fmt(profit/10000)} 만원`;
}
</script>
</body>
</html>
