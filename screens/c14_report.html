<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>월간 경영성과 리포트 | KAASA SmartOS</title>
  <link rel="stylesheet" href="../components/base.css"/>
  <style>
    .rep-hero{background:linear-gradient(135deg,#0f5132 0%,#2563eb 100%);border-radius:var(--radius);padding:20px;margin-bottom:14px;color:#fff;}
    .rep-period{font-size:12px;opacity:.75;}
    .rep-grade{font-size:30px;font-weight:900;margin:4px 0;}
    .rep-ach{font-size:13px;opacity:.85;}
    .rep-bar{height:8px;background:rgba(255,255,255,.25);border-radius:4px;margin-top:10px;overflow:hidden;}
    .rep-bar-f{height:100%;background:#fff;border-radius:4px;}

    /* 6대 영역 카드 */
    .area-card{background:var(--panel);border-radius:var(--radius-sm);padding:13px 14px;box-shadow:var(--shadow);margin-bottom:8px;}
    .area-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin-bottom:8px;}
    .area-metrics{display:flex;flex-wrap:wrap;gap:6px 14px;}
    .area-m{font-size:12px;}.area-m .k{color:var(--muted);}.area-m .v{font-weight:700;margin-left:3px;}

    /* KPI 막대 */
    .kpi-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
    .kpi-row:last-child{border-bottom:none;}
    .kpi-name{font-size:12px;font-weight:700;flex:1;min-width:0;}
    .kpi-bar-wrap{width:90px;height:8px;background:var(--gray-soft);border-radius:4px;overflow:hidden;flex-shrink:0;}
    .kpi-bar-f{height:100%;border-radius:4px;}
    .kpi-ach{font-size:11px;font-weight:800;min-width:38px;text-align:right;}
    .kf-good{background:var(--green);} .kf-warn{background:var(--orange);} .kf-low{background:var(--red);} .kf-na{background:var(--gray-soft);}

    .weak-item{display:flex;gap:10px;padding:10px 12px;background:var(--orange-soft);border-radius:var(--radius-sm);margin-bottom:6px;}
    .weak-item .wt{font-size:12px;color:var(--text);}
    .todo-item{display:flex;align-items:flex-start;gap:10px;background:var(--panel);border-radius:var(--radius-sm);padding:11px 13px;box-shadow:var(--shadow);margin-bottom:6px;}
    .todo-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;}

    .ws-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;}
    .ws-dot.connected{background:var(--green);box-shadow:0 0 0 3px rgba(31,122,77,.2);}
    .print-btn{width:100%;padding:13px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:800;cursor:pointer;margin-top:8px;}
  </style>
</head>
<body>
<header class="sf-header">
  <div style="display:flex;align-items:center;gap:6px;"><span class="ws-dot" id="wsDot"></span><span style="font-size:12px;color:rgba(255,255,255,.8)" id="wsLabel">연결 중…</span></div>
  <span style="font-size:15px;font-weight:800;color:#fff;">월간 경영성과 리포트</span>
  <select id="farmSel" aria-label="농장 선택" onchange="onFarmChange(this.value)" style="font-size:12px;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:8px;padding:4px 8px;cursor:pointer;outline:none;">
    <option value="farm_001">farm_001</option>
  </select>
</header>
<main class="sf-main" style="padding:14px;max-width:480px;margin:0 auto;">

  <div class="rep-hero">
    <div class="rep-period" id="repPeriod">—</div>
    <div class="rep-grade" id="repGrade">분석 중…</div>
    <div class="rep-ach" id="repAch">평균 달성률 —</div>
    <div class="rep-bar"><div class="rep-bar-f" id="repBar" style="width:0%"></div></div>
  </div>

  <div class="section-label">6대 영역 종합</div>
  <div id="areaList"><div style="text-align:center;padding:14px;color:var(--muted);"><div class="spinner"></div></div></div>

  <div class="section-label" style="margin-top:14px;">9대 성과지표 (목표 대비) <span class="trust-badge trust-model">🔵 목표대비</span></div>
  <div class="card" style="padding:14px;" id="kpiList"></div>

  <!-- 폐루프: 학습 기여 피드백 -->
  <div class="section-label" style="margin-top:14px;">데이터 학습 기여 <span class="trust-badge trust-live">🟢 폐루프</span></div>
  <div class="card" style="padding:14px;border-left:4px solid var(--purple);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <span style="font-size:13px;font-weight:800;">이번 달 이행 활동</span>
      <span style="font-size:13px;font-weight:800;color:var(--purple);"><span id="learnActs">0</span>건 · <span id="learnPts">0</span>P</span>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:6px;">모델 재학습 진척 (이행 데이터 축적)</div>
    <div style="height:8px;background:var(--gray-soft);border-radius:4px;overflow:hidden;"><div id="learnBar" style="height:100%;background:var(--purple);width:0%"></div></div>
    <div style="font-size:11px;color:var(--muted);margin-top:8px;" id="learnMsg">—</div>
  </div>

  <!-- 이행 활동 상세 (운영 기록 by_kind) -->
  <div class="section-label" style="margin-top:14px;">이행 활동 상세 <span class="trust-badge trust-live">🟢 운영기록</span></div>
  <div class="card" style="padding:14px;">
    <div id="actBreakdown" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
    <div style="font-size:11px;font-weight:700;color:var(--muted);margin:12px 0 4px;">최근 기록</div>
    <div id="actRecent"></div>
  </div>

  <div class="section-label" style="margin-top:14px;">취약 항목</div>
  <div id="weakList"></div>

  <div class="section-label" style="margin-top:14px;">이달의 실행 To-do <span id="todoRate" style="font-weight:400;color:var(--muted);font-size:11px;"></span></div>
  <div id="todoList"></div>

  <button class="print-btn" onclick="window.print()">📄 리포트 인쇄·PDF 저장</button>
  <div style="font-size:10px;color:var(--muted);margin-top:10px;text-align:center;" id="repNote"></div>
</main>

<nav class="sf-bottom-nav">
  <button class="bnav-tab" onclick="location.href='c3_home.html'"><span class="bnav-icon">🏠</span>홈</button>
  <button class="bnav-tab" onclick="location.href='g1_home.html'"><span class="bnav-icon">🌱</span>온실</button>
  <button class="bnav-tab" onclick="location.href='f1_field.html'"><span class="bnav-icon">🌾</span>노지</button>
  <button class="bnav-tab" onclick="location.href='c12_joint.html'"><span class="bnav-icon">🚚</span>출하</button>
  <button class="bnav-tab active"><span class="bnav-icon">≡</span>메뉴</button>
</nav>
<script src="../components/data.js"></script>
<script src="../components/record_sheet.js"></script>
<script>
'use strict';
const AREA_ICON={'경영':'💰','환경':'🌡️','관수':'💧','에너지':'⚡','병해':'🔬','수확':'🚚'};

window.addEventListener('DOMContentLoaded',()=>{
  const farmId=new URLSearchParams(location.search).get('farm')||sessionStorage.getItem('sf_farm_id')||'farm_001';
  _ensureToken().then(t=>{KaasaData.init({farmId,token:t,onStatus:_ws});_load(t,farmId);});
});
function onFarmChange(id){sessionStorage.setItem('sf_farm_id',id);location.reload();}
async function _ensureToken(){const s=sessionStorage.getItem('sf_token');if(s)return s;try{const a=sessionStorage.getItem('sf_api')||location.origin;const r=await fetch(`${a}/api/v1/auth/token`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'admin',password:'1250'})});if(r.ok){const d=await r.json();sessionStorage.setItem('sf_token',d.access_token);return d.access_token;}}catch{}return '';}
function _ws(s){const d=document.getElementById('wsDot'),l=document.getElementById('wsLabel');if(d)d.className='ws-dot '+s;if(l)l.textContent=s==='connected'?'실시간 연결 중':'연결 안 됨';}

// To-do 이행률 — 전 화면 localStorage 집계
function _todoRate(){
  let done=0,total=0;
  const today=new Date().toDateString();
  for(const key of ['sf_g1todo_','sf_f1todo_']){
    const arr=JSON.parse(localStorage.getItem(key+today)||'[]'); done+=arr.length;
  }
  // C3 홈 todo
  const c3=JSON.parse(localStorage.getItem('sf_todo_done_'+today)||'[]'); done+=c3.length;
  total=7+5+3; // c3 7 + g1 5 + f1 3
  return total?Math.round(done/total*100):0;
}

async function _load(token,farmId){
  const api=KaasaData.getApiBase();
  let d;
  try{ d=await fetch(`${api}/api/farms/${farmId}/report/monthly`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json()); }
  catch(e){ document.getElementById('repGrade').textContent='로드 실패'; return; }

  document.getElementById('repPeriod').textContent=`${d.period} · ${d.crop} · ${Math.round(d.area_m2)}m²`;
  document.getElementById('repGrade').textContent=`종합 ${d.overall_grade}`;
  document.getElementById('repAch').textContent=`평균 목표달성률 ${d.avg_achievement_pct}%`;
  document.getElementById('repBar').style.width=`${Math.min(d.avg_achievement_pct,100)}%`;

  // 6대 영역
  document.getElementById('areaList').innerHTML=Object.entries(d.areas).map(([name,m])=>`
    <div class="area-card"><div class="area-head">${AREA_ICON[name]||'📊'} ${name}관리</div>
      <div class="area-metrics">${Object.entries(m).map(([k,v])=>`<span class="area-m"><span class="k">${k}</span><span class="v">${v}</span></span>`).join('')}</div></div>`).join('');

  // 9대 KPI
  const todoR=_todoRate();
  document.getElementById('kpiList').innerHTML=d.kpis.map(k=>{
    let ach=k.achievement_pct, st=k.status;
    if(k.name.includes('To-do')){ ach=todoR; st=ach>=95?'good':ach>=80?'warn':'low'; }
    const w=ach!=null?Math.min(ach,100):0;
    return `<div class="kpi-row"><span class="kpi-name">${k.name}</span>
      <div class="kpi-bar-wrap"><div class="kpi-bar-f kf-${st}" style="width:${w}%"></div></div>
      <span class="kpi-ach" style="color:${st==='good'?'var(--green)':st==='warn'?'var(--orange)':st==='low'?'var(--red)':'var(--muted)'}">${ach!=null?ach+'%':'—'}</span></div>`;
  }).join('');

  // 학습 기여 (폐루프)
  const L=d.learning||{};
  document.getElementById('learnActs').textContent=L.month_activities??0;
  document.getElementById('learnPts').textContent=L.contribution_points??0;
  document.getElementById('learnBar').style.width=`${L.progress_pct??0}%`;
  document.getElementById('learnMsg').textContent=L.message||'';

  // 이행 활동 상세 (운영 기록 by_kind + 최근)
  _loadActivityDetail(token,farmId);

  // 취약항목
  document.getElementById('weakList').innerHTML=d.weak_points.map(w=>`
    <div class="weak-item"><span>⚠️</span><div class="wt"><b>${w.area}</b> · ${w.detail}</div></div>`).join('');

  // To-do
  document.getElementById('todoRate').textContent=`(이행률 ${todoR}%)`;
  document.getElementById('todoList').innerHTML=d.todos.map(t=>`
    <div class="todo-item"><div class="todo-check"></div><div style="font-size:12px;">${t.title}</div></div>`).join('')
    || '<div style="color:var(--muted);font-size:12px;text-align:center;padding:8px;">실행 항목 없음 — 양호</div>';

  document.getElementById('repNote').textContent=d.note||'';
}

const ACT_KIND={irrigation:['💧','관개'],disease_check:['🐛','방제·점검'],harvest:['🚜','수확'],
  env_setpoint:['🌡️','환경설정'],growth:['🌿','생육측정'],todo:['📋','작업계획'],
  education:['🎓','교육'],decision_apply:['🤖','AI결정'],consult:['🩺','전문가'],
  joint_ship:['🤝','공동출하'],consent:['📑','데이터동의']};
async function _loadActivityDetail(token,farmId){
  try{
    const api=KaasaData.getApiBase();
    const s=await fetch(`${api}/api/farms/${farmId}/activity/summary`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json());
    const bk=s.by_kind||{};
    const chips=Object.entries(bk).sort((a,b)=>b[1]-a[1]).map(([k,n])=>{
      const m=ACT_KIND[k]||['•',k];
      return `<span style="font-size:12px;font-weight:700;padding:6px 11px;border-radius:20px;background:var(--green-soft);color:var(--green-dark);">${m[0]} ${m[1]} <b>${n}</b></span>`;
    }).join('');
    document.getElementById('actBreakdown').innerHTML = chips ||
      '<span style="font-size:12px;color:var(--muted);">이번 달 운영 기록이 아직 없습니다.</span>';
    if(window.RecordSheet) RecordSheet.renderRecent(document.getElementById('actRecent'),farmId,token,{limit:6});
  }catch(e){ document.getElementById('actBreakdown').innerHTML='<span style="font-size:12px;color:var(--muted);">기록을 불러오지 못했습니다.</span>'; }
}
</script>
</body>
</html>
