<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>C16 — 시설 기자재 · 이기종 통합 | KAASA SmartOS</title>
  <link rel="stylesheet" href="../components/base.css"/>
  <style>
    .eq-body{padding:14px;max-width:480px;margin:0 auto;padding-bottom:90px;}
    .eq-card{background:var(--panel);border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow);}
    .eq-head{display:flex;align-items:center;gap:8px;}
    .eq-ico{font-size:20px;}
    .eq-name{font-size:14px;font-weight:800;flex:1;}
    .eq-del{font-size:11px;color:var(--red);background:none;border:none;cursor:pointer;}
    .eq-sub{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5;}
    .eq-proto{font-size:10px;font-weight:800;padding:2px 7px;border-radius:7px;background:var(--blue-soft);color:#1e40af;}
    .eq-dp{font-size:11px;color:var(--green-dark);background:var(--green-soft);border-radius:7px;padding:2px 7px;margin:2px 3px 0 0;display:inline-block;}
    .eq-empty{text-align:center;padding:24px;color:var(--muted);font-size:13px;}
    .lbl{font-size:12.5px;font-weight:700;margin:12px 0 5px;display:block;}
    .inp,.sel{width:100%;min-height:46px;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;background:var(--panel);color:var(--text);}
    .row2{display:flex;gap:8px;}.row2>*{flex:1;}
    .dp-row{border:1px dashed var(--border);border-radius:10px;padding:10px;margin-bottom:8px;}
    .addbtn{width:100%;padding:15px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:800;cursor:pointer;min-height:48px;}
    .ghost{background:var(--gray-soft);color:var(--muted);font-weight:700;}
    /* sheet */
    .mask{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:200;}
    .mask.open{display:flex;}
    .sheet{background:var(--panel);width:100%;max-width:480px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;}
  </style>
</head>
<body>
<header class="sf-header">
  <span style="font-size:13px;color:rgba(255,255,255,.85);cursor:pointer;" onclick="location.href='../index.html'">‹ 메뉴</span>
  <span style="font-size:15px;font-weight:800;color:#fff;">C16 시설 기자재</span>
  <span style="width:40px;"></span>
</header>
<main class="eq-body">
  <div style="font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:10px;">
    제조사·프로토콜이 다른 장비를 등록하고, 데이터 포인트를 <b>표준 변수</b>로 매핑하면
    화면·AI가 기종과 무관하게 동일하게 사용합니다.
  </div>
  <div id="mapSummary" class="eq-card" style="border-left:4px solid var(--green);display:none;"></div>
  <div class="section-label">등록 장비</div>
  <div id="eqList"><div class="eq-empty">불러오는 중…</div></div>
  <button class="addbtn" style="margin-top:12px;" onclick="_openAdd()">＋ 장비 추가</button>

  <div id="nextStep" style="display:none;margin-top:16px;">
    <div style="font-size:13px;color:var(--muted);text-align:center;margin-bottom:10px;line-height:1.5;">장비 연동을 마쳤습니다. 다음으로 <b>시스템 종합진단</b>으로 현재 역량과 개선 처방을 확인하세요.</div>
    <button onclick="location.href='c17_diagnosis.html'" style="width:100%;padding:14px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:800;cursor:pointer;min-height:48px;">🩺 종합진단 받기 →</button>
  </div>
</main>

<!-- 장비 추가 시트 -->
<div class="mask" id="mask" onclick="if(event.target===this)_close()">
  <div class="sheet">
    <div style="font-size:17px;font-weight:800;margin-bottom:8px;">시설 기자재 등록</div>
    <label class="lbl">분류</label>
    <select class="sel" id="fCat" onchange="_onCat()"></select>
    <label class="lbl">장비 종류</label>
    <select class="sel" id="fType"></select>
    <div class="row2">
      <div><label class="lbl">장비 ID *</label><input class="inp" id="fId" placeholder="예: HEAT-01"/></div>
      <div><label class="lbl">설치 위치</label><input class="inp" id="fLoc" placeholder="1동 2구역"/></div>
    </div>
    <div class="row2">
      <div><label class="lbl">제조사 *</label><input class="inp" id="fMaker" placeholder="프리바/국산 등"/></div>
      <div><label class="lbl">모델</label><input class="inp" id="fModel"/></div>
    </div>
    <label class="lbl">통신 프로토콜 *</label>
    <select class="sel" id="fProto"></select>
    <div class="row2">
      <div><label class="lbl">주소(IP/호스트)</label><input class="inp" id="fHost" placeholder="192.168.0.10"/></div>
      <div><label class="lbl">포트</label><input class="inp" id="fPort" type="number" placeholder="502"/></div>
    </div>
    <label class="lbl">데이터 포인트 (표준변수 매핑)</label>
    <div id="dpList"></div>
    <button class="addbtn ghost" style="min-height:42px;font-size:13px;" onclick="_addDp()">＋ 데이터 포인트 추가</button>
    <div id="eqMsg" style="font-size:12.5px;font-weight:700;text-align:center;margin-top:10px;min-height:16px;"></div>
    <div style="display:flex;gap:10px;margin-top:14px;">
      <button class="addbtn ghost" style="flex:0 0 96px;" onclick="_close()">취소</button>
      <button class="addbtn" id="saveBtn" onclick="_save()">장비 저장</button>
    </div>
  </div>
</div>

<nav class="sf-bottom-nav">
  <button class="bnav-tab" onclick="location.href='c3_home.html'"><span class="bnav-icon">🏠</span>홈</button>
  <button class="bnav-tab" onclick="location.href='g1_home.html'"><span class="bnav-icon">🌱</span>온실</button>
  <button class="bnav-tab" onclick="location.href='f1_field.html'"><span class="bnav-icon">🌾</span>노지</button>
  <button class="bnav-tab" onclick="location.href='c12_joint.html'"><span class="bnav-icon">🚚</span>출하</button>
  <button class="bnav-tab" onclick="location.href='../index.html'"><span class="bnav-icon">≡</span>메뉴</button>
</nav>

<script src="../components/data.js"></script>
<script>
'use strict';
let _tokenG='', _farmG='farm_001', _schema=null, _dps=[];
const CAT_ICO={env_actuator:'🌡️',irrigation:'💧',sensor:'📡',weather:'🌦️',energy:'⚡',field_irrig:'🚿',vision:'📷',control_comm:'🔌'};

window.addEventListener('DOMContentLoaded', ()=>{
  _farmG=new URLSearchParams(location.search).get('farm')||sessionStorage.getItem('sf_farm_id')||'farm_001';
  _ensureToken().then(async t=>{ _tokenG=t;
    const api=KaasaData.getApiBase();
    _schema=await fetch(`${api}/api/farms/${_farmG}/equipment/schema`,{headers:{Authorization:`Bearer ${t}`}}).then(r=>r.json()).catch(()=>null);
    _initForm(); _loadList();
  });
});
async function _ensureToken(){const s=sessionStorage.getItem('sf_token');if(s)return s;try{const a=sessionStorage.getItem('sf_api')||location.origin;const r=await fetch(`${a}/api/v1/auth/token`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'admin',password:'1250'})});if(r.ok){const d=await r.json();sessionStorage.setItem('sf_token',d.access_token);return d.access_token;}}catch{}return '';}
function onFarmChange(id){sessionStorage.setItem('sf_farm_id',id);location.reload();}

function _initForm(){
  if(!_schema) return;
  const cats=_schema.categories||[];
  document.getElementById('fCat').innerHTML=cats.map(c=>`<option value="${c.key}">${CAT_ICO[c.key]||'📦'} ${c.name_ko}</option>`).join('');
  const protos=(((_schema.integration_fields||{}).comm)||[]).find(f=>f.id==='protocol');
  document.getElementById('fProto').innerHTML=(protos?protos.options:['MQTT','Modbus-TCP']).map(p=>`<option>${p}</option>`).join('');
  _onCat();
}
function _onCat(){
  const cats=_schema.categories||[]; const c=cats.find(x=>x.key===document.getElementById('fCat').value);
  document.getElementById('fType').innerHTML=((c&&c.devices)||[]).map(d=>`<option>${d}</option>`).join('');
}
function _addDp(){
  const i=_dps.length; _dps.push({});
  const cn=(_schema&&_schema.canonical_names)||[];
  const dts=['float','int16','uint16','int32','bool','string'];
  const rws=['read','write','read/write'];
  const html=`<div class="dp-row" data-i="${i}">
    <div class="row2"><input class="inp" data-f="tag" placeholder="태그/포인트명 *"/><input class="inp" data-f="address" placeholder="레지스터/토픽"/></div>
    <div class="row2" style="margin-top:6px;">
      <select class="sel" data-f="data_type">${dts.map(d=>`<option>${d}</option>`).join('')}</select>
      <input class="inp" data-f="unit" placeholder="단위(°C,%,ppm)"/></div>
    <div class="row2" style="margin-top:6px;">
      <input class="inp" data-f="scale" type="number" placeholder="배율 1"/><input class="inp" data-f="offset" type="number" placeholder="오프셋 0"/>
      <input class="inp" data-f="poll_interval" type="number" placeholder="주기(초) 60"/></div>
    <div class="row2" style="margin-top:6px;">
      <select class="sel" data-f="rw">${rws.map(r=>`<option>${r}</option>`).join('')}</select>
      <select class="sel" data-f="canonical_name"><option value="">표준변수 매핑…</option>${cn.map(v=>`<option>${v}</option>`).join('')}</select></div>
    <div style="font-size:10px;color:var(--muted);margin-top:6px;">물리 성능 캘리브레이션 (제어/액추에이터 포인트)</div>
    <div class="row2" style="margin-top:4px;">
      <input class="inp" data-f="actuator_response_s" type="number" placeholder="액추에이터 응답(초)"/>
      <input class="inp" data-f="cmd_feedback_offset" type="number" placeholder="명령-실반응 편차"/></div>
    <button class="eq-del" style="margin-top:6px;" onclick="this.parentNode.remove()">− 이 포인트 삭제</button>
  </div>`;
  document.getElementById('dpList').insertAdjacentHTML('beforeend',html);
}
function _collectDps(){
  return [...document.querySelectorAll('#dpList .dp-row')].map(row=>{
    const o={}; row.querySelectorAll('[data-f]').forEach(el=>{ const v=el.value.trim(); if(v) o[el.dataset.f]=el.type==='number'?parseFloat(v):v; });
    return o;
  }).filter(o=>o.tag);
}
function _openAdd(){ _dps=[]; document.getElementById('dpList').innerHTML=''; _addDp();
  document.getElementById('fId').value=''; document.getElementById('eqMsg').textContent='';
  document.getElementById('mask').classList.add('open'); }
function _close(){ document.getElementById('mask').classList.remove('open'); }

async function _save(){
  const body={
    device_id:document.getElementById('fId').value.trim(),
    category:document.getElementById('fCat').value,
    device_type:document.getElementById('fType').value,
    location:document.getElementById('fLoc').value.trim(),
    maker:document.getElementById('fMaker').value.trim(),
    model:document.getElementById('fModel').value.trim(),
    protocol:document.getElementById('fProto').value,
    host:document.getElementById('fHost').value.trim(),
    port:parseInt(document.getElementById('fPort').value)||null,
    datapoints:_collectDps(),
  };
  const msg=document.getElementById('eqMsg');
  if(!body.device_id){ msg.style.color='var(--red)'; msg.textContent='장비 ID를 입력하세요'; return; }
  if(!body.maker){ msg.style.color='var(--red)'; msg.textContent='제조사를 입력하세요'; return; }
  const btn=document.getElementById('saveBtn'); btn.disabled=true; btn.textContent='저장 중…';
  try{
    const api=KaasaData.getApiBase();
    const r=await fetch(`${api}/api/farms/${_farmG}/equipment`,{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${_tokenG}`},body:JSON.stringify(body)});
    if(!r.ok) throw new Error('HTTP '+r.status);
    msg.style.color='var(--green)'; msg.textContent='✓ 저장됨'; setTimeout(()=>{_close();_loadList();},700);
  }catch(e){ msg.style.color='var(--orange)'; msg.textContent='저장 실패: '+e.message; }
  btn.disabled=false; btn.textContent='장비 저장';
}

async function _loadList(){
  const api=KaasaData.getApiBase();
  const d=await fetch(`${api}/api/farms/${_farmG}/equipment`,{headers:{Authorization:`Bearer ${_tokenG}`}}).then(r=>r.json()).catch(()=>({items:[]}));
  const items=d.items||[];
  const el=document.getElementById('eqList');
  var _ns=document.getElementById('nextStep');
  if(!items.length){ el.innerHTML='<div class="eq-empty">등록된 장비가 없습니다. ＋ 장비 추가로 시작하세요.</div>'; document.getElementById('mapSummary').style.display='none'; if(_ns)_ns.style.display='none'; return; }
  if(_ns)_ns.style.display='block';
  el.innerHTML=items.map(it=>{
    const dps=(it.datapoints||[]);
    const mapped=dps.filter(p=>p.canonical_name);
    return `<div class="eq-card"><div class="eq-head">
        <span class="eq-ico">${CAT_ICO[it.category]||'📦'}</span>
        <span class="eq-name">${it.device_id} · ${it.device_type||''}</span>
        <span class="eq-proto">${it.protocol||'-'}</span>
        <button class="eq-del" onclick="_del('${it.device_id}')">삭제</button></div>
      <div class="eq-sub">${it.maker||'-'} ${it.model||''} · ${it.location||'위치 미지정'}${it.host?` · ${it.host}${it.port?':'+it.port:''}`:''}</div>
      <div style="margin-top:6px;">${dps.map(p=>`<span class="eq-dp">${p.tag}${p.canonical_name?` → ${p.canonical_name}`:''}</span>`).join('')||'<span class="eq-sub">데이터 포인트 없음</span>'}</div>
    </div>`;
  }).join('');
  // 매핑 요약
  const mappedVars=[...new Set(items.flatMap(i=>(i.datapoints||[]).map(p=>p.canonical_name).filter(Boolean)))];
  const ms=document.getElementById('mapSummary');
  ms.style.display='block';
  ms.innerHTML=`<div style="font-size:13px;font-weight:800;">통합 현황</div>
    <div class="eq-sub">장비 ${items.length}대 · 표준변수 매핑 ${mappedVars.length}종</div>
    <div style="margin-top:5px;">${mappedVars.map(v=>`<span class="eq-dp">${v}</span>`).join('')||'<span class="eq-sub">아직 매핑된 표준변수가 없습니다.</span>'}</div>`;
}
async function _del(id){
  if(!confirm(id+' 장비를 삭제할까요?')) return;
  const api=KaasaData.getApiBase();
  await fetch(`${api}/api/farms/${_farmG}/equipment/${encodeURIComponent(id)}`,{method:'DELETE',headers:{Authorization:`Bearer ${_tokenG}`}});
  _loadList();
}
</script>
</body>
</html>
