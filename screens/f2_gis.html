<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>F2 — 필지 GIS | KAASA smartfarmingsight</title>
  <link rel="stylesheet" href="../components/base.css"/>
  <style>
    .map-box{background:linear-gradient(135deg,#dcfce7,#bbf7d0);border-radius:var(--radius);height:240px;position:relative;overflow:hidden;box-shadow:var(--shadow);margin-bottom:6px;}
    .map-parcel{position:absolute;border:2px solid rgba(255,255,255,.7);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#14532d;cursor:pointer;}
    .map-mock-tag{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.5);color:#fff;font-size:9px;padding:2px 6px;border-radius:6px;}
    .parcel-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
    .parcel-row:last-child{border-bottom:none;}
    .pr-ico{font-size:20px;}.pr-name{flex:1;}.pr-title{font-size:13px;font-weight:800;}.pr-sub{font-size:11px;color:var(--muted);margin-top:1px;}
    .pr-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;}
    .mock-note{font-size:10px;color:var(--muted);background:var(--panel-soft);border-radius:8px;padding:8px 10px;margin:12px 0;}
    .ws-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;}
    /* peelable 레이어 토글 (FieldView 벤치마킹) */
    .layer-bar{display:flex;gap:6px;margin-bottom:8px;}
    .layer-chip{flex:1;padding:8px 4px;border-radius:10px;border:1.5px solid var(--border);background:var(--panel);
      font-size:11px;font-weight:800;color:var(--muted);cursor:pointer;text-align:center;min-height:40px;}
    .layer-chip.active{border-color:var(--green);background:var(--green-soft);color:var(--green-dark);}
    .layer-legend{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--muted);margin:4px 0 10px;flex-wrap:wrap;}
    .lg-grad{display:inline-block;width:60px;height:9px;border-radius:3px;vertical-align:middle;}
    .map-parcel-val{font-size:13px;font-weight:900;}
  </style>
</head>
<body>
<header class="sf-header">
  <span style="font-size:13px;color:rgba(255,255,255,.85);cursor:pointer;" onclick="location.href='f1_field.html'">‹ 노지</span>
  <span style="font-size:15px;font-weight:800;color:#fff;">F2 필지 GIS</span><span style="width:40px;"></span>
</header>
<main class="sf-main" style="padding:14px;max-width:480px;margin:0 auto;">
  <div class="section-label">필지 지도 <span class="trust-badge trust-mock">⚪ Mock</span></div>
  <!-- peelable 레이어 토글 (FieldView 벤치마킹) -->
  <div class="layer-bar" id="layerBar">
    <div class="layer-chip active" data-layer="boundary" onclick="setLayer('boundary')">🗺️ 필지경계</div>
    <div class="layer-chip" data-layer="moisture" onclick="setLayer('moisture')">💧 토양수분</div>
    <div class="layer-chip" data-layer="ndvi" onclick="setLayer('ndvi')">🌿 NDVI</div>
  </div>
  <div class="map-box" id="mapBox"><span class="map-mock-tag" id="mapTag">GIS Mock</span></div>
  <div class="layer-legend" id="layerLegend"></div>
  <div class="mock-note">ℹ️ 필지 경계·구획 데이터는 실측 GIS 미연동 상태로 예시(Mock)입니다. 농지 좌표 연동 시 네이버/카카오 지도로 교체됩니다.</div>
  <div class="section-label">필지 목록</div>
  <div class="card" style="padding:14px;" id="parcelList"></div>
</main>
<nav class="sf-bottom-nav">
  <button class="bnav-tab" onclick="location.href='c3_home.html'"><span class="bnav-icon">🏠</span>홈</button>
  <button class="bnav-tab" onclick="location.href='g1_home.html'"><span class="bnav-icon">🌱</span>온실</button>
  <button class="bnav-tab" onclick="location.href='f1_field.html'"><span class="bnav-icon">🌾</span>노지</button>
  <button class="bnav-tab" onclick="location.href='c12_joint.html'"><span class="bnav-icon">🚚</span>출하</button>
  <button class="bnav-tab" onclick="location.href='../index.html'"><span class="bnav-icon">≡</span>메뉴</button>
</nav>
<script>
'use strict';
// 기본 Mock 좌표 (팜맵 미연동 시) — 그리드 배치
let PARCELS=[
  {n:'1번 필지',x:6,y:10,w:42,h:40,crop:'배추',area:0.5,status:'정상',c:'var(--green)',moisture:62,ndvi:0.74},
  {n:'2번 필지',x:52,y:10,w:42,h:40,crop:'무',area:0.8,status:'관개필요',c:'var(--orange)',moisture:38,ndvi:0.58},
  {n:'3번 필지',x:6,y:54,w:42,h:38,crop:'대파',area:0.4,status:'정상',c:'var(--green)',moisture:71,ndvi:0.81},
  {n:'4번 필지',x:52,y:54,w:42,h:38,crop:'양파',area:0.6,status:'병해주의',c:'var(--red)',moisture:45,ndvi:0.42},
];
let _layer='boundary';
window.addEventListener('DOMContentLoaded',()=>{
  _render();
  const farmId=new URLSearchParams(location.search).get('farm')||sessionStorage.getItem('sf_farm_id')||'farm_001';
  _loadParcels(farmId);
});

async function _ensureToken(){
  const s=sessionStorage.getItem('sf_token');if(s)return s;
  try{const a=sessionStorage.getItem('sf_api')||location.origin;
    const r=await fetch(`${a}/api/v1/auth/token`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'admin',password:'1250'})});
    if(r.ok){const d=await r.json();sessionStorage.setItem('sf_token',d.access_token);return d.access_token;}}catch{}return '';
}

async function _loadParcels(farmId){
  try{
    const token=await _ensureToken();
    const api=sessionStorage.getItem('sf_api')||location.origin;
    const r=await fetch(`${api}/api/farms/${farmId}/field/parcels`,{headers:{Authorization:`Bearer ${token}`}});
    if(!r.ok) return;
    const d=await r.json();
    const isLive = d.source==='farmmap' || d.source==='farmmap_real';
    // 신뢰도 뱃지 동적 갱신
    document.querySelectorAll('.trust-badge.trust-mock').forEach(b=>{
      if(isLive){ b.className='trust-badge trust-live'; b.textContent='🟢 팜맵 실데이터'; }
    });
    if(isLive){ const mt=document.getElementById('mapTag'); if(mt) mt.textContent='🟢 팜맵 실데이터';
      const mn=document.querySelector('.mock-note'); if(mn) mn.innerHTML='🟢 <b>팜맵 농경지전자지도 실데이터</b> 연동됨'+(d.note?` — ${d.note}`:''); }
    const list = d.parcels || [];
    if(list.length){
      // 그리드 좌표 자동 배치 (2열)
      PARCELS = list.map((p,i)=>({
        n:p.name||`${i+1}번 필지`, crop:p.crop||p.jimok||'-', area:p.area_ha??0.5,
        status:'정상', c:'var(--green)',
        moisture: p.moisture ?? (45+((i*17)%35)),   // 실데이터 없으면 예시값
        ndvi: p.ndvi ?? (0.45+((i*13)%40)/100),
        x: i%2===0?6:52, y: 10+Math.floor(i/2)*44, w:42, h:40,
      }));
      _render(isLive);
    }
  }catch(e){ /* Mock 유지 */ }
}

// 레이어별 색상 (히트맵): 값 → rgba
function _heat(v,lo,hi){ // lo=나쁨(빨강) → hi=좋음(녹색)
  if(v==null) return 'rgba(148,163,184,.4)';
  const t=Math.max(0,Math.min(1,(v-lo)/(hi-lo)));
  const r=Math.round(220-(220-34)*t), g=Math.round(60+(197-60)*t), b=Math.round(60+(94-60)*t);
  return `rgba(${r},${g},${b},.62)`;
}
function _parcelFill(p){
  if(_layer==='moisture') return _heat(p.moisture,30,75);
  if(_layer==='ndvi')     return _heat(p.ndvi,0.3,0.85);
  return 'rgba(34,197,94,.4)'; // 필지경계
}
function _parcelLabel(p){
  if(_layer==='moisture') return `${p.n.replace(' 필지','')}<br><span class="map-parcel-val">${p.moisture??'—'}%</span>`;
  if(_layer==='ndvi')     return `${p.n.replace(' 필지','')}<br><span class="map-parcel-val">${p.ndvi!=null?p.ndvi.toFixed(2):'—'}</span>`;
  return `${p.n}<br>${p.crop}`;
}
function setLayer(layer){
  _layer=layer;
  document.querySelectorAll('.layer-chip').forEach(c=>c.classList.toggle('active',c.dataset.layer===layer));
  _render(window.__isLive);
  const lg=document.getElementById('layerLegend');
  if(layer==='moisture') lg.innerHTML=`토양수분 <span class="lg-grad" style="background:linear-gradient(90deg,#dc3c3c,#ea8a00,#22c55e)"></span> 건조 30% → 충분 75% · 출처 ⚪ 흙토람 미연동(예시)`;
  else if(layer==='ndvi') lg.innerHTML=`식생지수 <span class="lg-grad" style="background:linear-gradient(90deg,#dc3c3c,#ea8a00,#22c55e)"></span> 저활력 0.3 → 고활력 0.85 · 출처 ⚪ 위성 NDVI 미연동(예시)`;
  else lg.innerHTML='';
}

function _render(isLive){
  window.__isLive = isLive;
  const tag = isLive?'팜맵':'Mock';
  const mb=document.getElementById('mapBox');
  mb.querySelectorAll('.map-parcel').forEach(e=>e.remove());
  mb.insertAdjacentHTML('beforeend',PARCELS.map(p=>`
    <div class="map-parcel" style="left:${p.x}%;top:${p.y}%;width:${p.w}%;height:${p.h}%;background:${_parcelFill(p)};"
      onclick="alert('${p.n}: ${p.crop} ${p.area}ha · 수분 ${p.moisture??'-'}% · NDVI ${p.ndvi??'-'} — ${tag}')">${_parcelLabel(p)}</div>`).join(''));
  document.getElementById('parcelList').innerHTML=PARCELS.map(p=>`
    <div class="parcel-row"><span class="pr-ico">🌾</span>
      <div class="pr-name"><div class="pr-title">${p.n} · ${p.crop}</div>
        <div class="pr-sub">면적 ${p.area}ha · 수분 ${p.moisture??'—'}% · NDVI ${p.ndvi!=null?p.ndvi.toFixed(2):'—'}</div></div>
      <span class="pr-badge" style="background:${p.c}22;color:${p.c};">${p.status}</span></div>`).join('');
}
</script>
<script src="../components/data.js"></script>
</body>
</html>
