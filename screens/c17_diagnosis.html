<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>C17 — 시스템 종합진단 | KAASA Farmingsight</title>
  <link rel="stylesheet" href="../components/base.css"/>
  <style>
    .dg-body{padding:14px;max-width:480px;margin:0 auto;padding-bottom:90px;}
    .dg-hero{background:linear-gradient(135deg,#1e3a5f,var(--chart-cool));border-radius:var(--radius);padding:18px 20px;color:#fff;margin-bottom:14px;}
    .dg-score{font-size:40px;font-weight:900;line-height:1;}
    .dg-grade{font-size:13px;font-weight:800;padding:3px 10px;border-radius:10px;background:rgba(255,255,255,.2);display:inline-block;margin-top:6px;}
    .dg-bar-row{display:flex;align-items:center;gap:10px;margin:9px 0;}
    .dg-bar-label{font-size:12px;font-weight:700;flex:0 0 96px;}
    .dg-bar-wrap{flex:1;height:9px;background:var(--gray-soft);border-radius:5px;overflow:hidden;}
    .dg-bar-fill{height:100%;border-radius:5px;}
    .dg-bar-val{font-size:11px;font-weight:800;flex:0 0 34px;text-align:right;}
    .rec-card{background:var(--panel);border:1.5px solid var(--border);border-left:4px solid var(--orange);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
    .rec-card.p-높음{border-left-color:var(--red);}
    .rec-card.p-중간{border-left-color:var(--orange);}
    .rec-head{display:flex;align-items:center;gap:8px;}
    .rec-title{font-size:14px;font-weight:800;flex:1;}
    .rec-prio{font-size:10px;font-weight:800;padding:2px 8px;border-radius:7px;}
    .rec-prio.높음{background:var(--red-soft);color:var(--red);}
    .rec-prio.중간{background:var(--orange-soft);color:var(--orange);}
    .rec-detail{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5;}
    .rec-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px;}
    .rec-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:7px;background:var(--green-soft);color:var(--green-dark);}
    .rec-btn{margin-top:9px;width:100%;padding:11px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;min-height:44px;}
    .stat-row{display:flex;gap:8px;margin-bottom:12px;}
    .stat{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center;}
    .stat-v{font-size:18px;font-weight:900;}.stat-l{font-size:10px;color:var(--muted);margin-top:2px;}
    .dom-card{background:var(--panel);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:9px;}
    .dom-head{display:flex;align-items:center;gap:8px;}
    .dom-name{font-size:14px;font-weight:800;flex:1;}
    .dom-score{font-size:15px;font-weight:900;}
    .dom-chip{font-size:10px;font-weight:800;padding:2px 8px;border-radius:7px;}
    .dom-chip.good{background:var(--green-soft);color:var(--green-dark);}
    .dom-chip.warn{background:var(--orange-soft);color:var(--orange);}
    .dom-chip.bad{background:var(--red-soft);color:var(--red);}
    .dom-bar{height:7px;background:var(--gray-soft);border-radius:4px;overflow:hidden;margin:8px 0;}
    .dom-find{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:2px;}
    .dec-card{background:var(--panel);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;border-left:4px solid var(--orange);}
    .dec-card.danger{border-left-color:var(--red);}
    .dec-card.info{border-left-color:var(--blue,var(--chart-cool));}
    .dec-head{display:flex;align-items:center;gap:8px;}
    .dec-title{font-size:13.5px;font-weight:800;flex:1;}
    .dec-sev{font-size:10px;font-weight:800;padding:2px 8px;border-radius:7px;}
    .dec-sev.danger{background:var(--red-soft);color:var(--red);}
    .dec-sev.warn{background:var(--orange-soft);color:var(--orange);}
    .dec-sev.info{background:var(--gray-soft);color:var(--muted);}
    .dec-detail{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5;}
    .dec-dom{font-size:10px;font-weight:700;color:var(--muted);}
    .dec-btns{display:flex;gap:8px;margin-top:9px;}
    .dec-go{flex:1;padding:10px;background:var(--green);color:#fff;border:none;border-radius:9px;font-size:12.5px;font-weight:800;cursor:pointer;min-height:44px;}
    .dec-log{flex:0 0 96px;padding:10px;background:var(--gray-soft);color:var(--text);border:none;border-radius:9px;font-size:12.5px;font-weight:800;cursor:pointer;min-height:44px;}
  </style>
</head>
<body>
<header class="sf-header">
  <span style="font-size:13px;color:rgba(255,255,255,.85);cursor:pointer;" onclick="location.href='../index.html'">‹ 메뉴</span>
  <span style="font-size:15px;font-weight:800;color:#fff;">C17 시스템 종합진단</span>
  <span style="width:40px;"></span>
</header>
<main class="dg-body">
  <div class="dg-hero">
    <div style="font-size:12px;opacity:.85;">시스템 성숙도 종합점수</div>
    <div class="dg-score" id="dgScore">—</div>
    <div class="dg-grade" id="dgGrade">진단 중…</div>
  </div>
  <div class="stat-row" id="dgStats"></div>
  <div class="strat-band" data-cur="c17" style="display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;"></div>
  <div id="dgTrend" style="display:none;" class="card">
    <div style="display:flex;align-items:center;margin-bottom:6px;">
      <span style="font-size:12px;font-weight:800;">진단 추세 (회차별)</span>
      <span id="dgDelta" style="margin-left:auto;font-size:12px;font-weight:800;"></span>
    </div>
    <svg id="dgSpark" width="100%" height="60" viewBox="0 0 300 60" preserveAspectRatio="none"></svg>
    <div id="dgTrendLabels" style="display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted);margin-top:2px;"></div>
  </div>
  <button onclick="location.href='c19_capability.html'" style="width:100%;padding:13px;margin-bottom:10px;background:linear-gradient(135deg,#0f5132,#1f9d55);border:none;color:#fff;border-radius:12px;font-size:13.5px;font-weight:800;cursor:pointer;min-height:48px;">🧭 내 역량 단계별 핵심 서비스 보기 →</button>
  <div style="display:flex;gap:8px;margin-bottom:12px;">
    <button onclick="location.href='c18_checklist.html'" style="flex:1;padding:12px;background:var(--panel);border:1.5px dashed var(--green);color:var(--green-dark);border-radius:12px;font-size:12.5px;font-weight:800;cursor:pointer;min-height:46px;">📋 현장 문진 입력</button>
    <button onclick="location.href='c17_report.html'" style="flex:1;padding:12px;background:var(--panel);border:1.5px dashed var(--blue,var(--chart-cool));color:var(--blue,var(--chart-cool));border-radius:12px;font-size:12.5px;font-weight:800;cursor:pointer;min-height:46px;">📄 결과보고서 PDF</button>
  </div>
  <div class="section-label">현장컨설팅 6대 영역 진단 <span class="trust-badge trust-model" style="font-size:9px;">RDA 체크리스트</span></div>
  <div class="card" id="dgRadarCard" style="display:none;padding:10px 4px;margin-bottom:10px;text-align:center;">
    <svg id="dgRadar" width="100%" height="260" viewBox="0 0 300 260" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <div id="dgDomains"><div style="text-align:center;padding:16px;color:var(--muted);"><div class="spinner"></div></div></div>
  <div class="section-label" style="margin-top:14px;">보유 기자재 평가 <span class="trust-badge trust-model">🔵 평가완료 DB</span></div>
  <div class="card" id="equipGrade" style="padding:13px 14px;margin-bottom:6px;font-size:12.5px;color:var(--muted);">불러오는 중…</div>
  <div class="section-label" style="margin-top:14px;">데이터 품질 점검 <span class="trust-badge trust-live">🟢 입력 모니터링</span></div>
  <div class="card" id="dataQuality" style="padding:13px 14px;margin-bottom:6px;font-size:12.5px;color:var(--muted);">불러오는 중…</div>
  <div class="section-label" style="margin-top:14px;">우선순위 처방 (의사결정) <span class="trust-badge trust-model">🔵 ROI</span></div>
  <div id="dgDecisions"></div>
  <details style="margin-top:10px;"><summary style="font-size:12px;color:var(--muted);cursor:pointer;padding:6px 0;">인프라 성숙도 상세 · 업그레이드 추천 ▾</summary>
    <div class="card" style="padding:14px;margin-top:8px;" id="dgScores"></div>
    <div id="dgRecs" style="margin-top:10px;"></div>
  </details>

  <!-- P1-C: 전문가 컨설팅 진입 CTA -->
  <div style="margin-top:20px;padding:14px 16px;background:linear-gradient(135deg,var(--panel) 0%,var(--panel-soft) 100%);border:1.5px solid var(--blue,#2563eb);border-radius:14px;">
    <div style="font-size:13px;font-weight:800;color:var(--blue,#2563eb);margin-bottom:4px;">🧑‍💼 전문가 컨설팅</div>
    <div style="font-size:11.5px;color:var(--muted);margin-bottom:10px;">진단 결과를 전문가와 함께 검토하고 맞춤 처방을 받아보세요.</div>
    <a href="c4_diagnosis.html" style="display:inline-flex;align-items:center;gap:6px;background:var(--blue,#2563eb);color:#fff;font-size:12.5px;font-weight:800;padding:10px 18px;border-radius:20px;text-decoration:none;min-height:44px;">전문가 컨설팅 신청하기 →</a>
  </div>
</main>
<nav class="sf-bottom-nav">
  <button class="bnav-tab" onclick="location.href='c3_home.html'"><span class="bnav-icon">🏠</span>홈</button>
  <button class="bnav-tab" onclick="location.href='g1_home.html'"><span class="bnav-icon">🌱</span>온실</button>
  <button class="bnav-tab" onclick="location.href='f1_field.html'"><span class="bnav-icon">🌾</span>노지</button>
  <button class="bnav-tab" onclick="location.href='c12_joint.html'"><span class="bnav-icon">🚚</span>출하</button>
  <button class="bnav-tab" onclick="location.href='../index.html'"><span class="bnav-icon">≡</span>메뉴</button>
</nav>
<script src="../components/data.js"></script>
<script src="../components/record_sheet.js"></script>
<script>
'use strict';
let _farmG='farm_001', _tokG='', _DECS=[];
function _col(v){ return v>=75?'var(--green)':v>=45?'var(--orange)':'var(--red)'; }
// 6대 영역 레이더(육각) 차트 — 의존성 0 SVG
function _drawRadar(doms){
  const cx=150, cy=130, R=92, n=doms.length;
  const ang=i=>(-Math.PI/2)+(2*Math.PI*i/n);
  const pt=(i,r)=>[cx+r*Math.cos(ang(i)), cy+r*Math.sin(ang(i))];
  let s='';
  // 격자 링(25/50/75/100)
  [0.25,0.5,0.75,1].forEach(f=>{
    const pts=doms.map((_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' ');
    s+=`<polygon points="${pts}" fill="none" stroke="var(--border)" stroke-width="1"/>`;
  });
  // 축
  doms.forEach((_,i)=>{ const [x,y]=pt(i,R); s+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`; });
  // 데이터 폴리곤
  const dp=doms.map((x,i)=>pt(i,R*Math.max(0,Math.min(100,x.score))/100).map(v=>v.toFixed(1)).join(',')).join(' ');
  s+=`<polygon points="${dp}" fill="rgba(37,99,235,.18)" stroke="var(--chart-cool)" stroke-width="2"/>`;
  doms.forEach((x,i)=>{ const [px,py]=pt(i,R*x.score/100); s+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="3" fill="${_col(x.score)}"/>`; });
  // 라벨
  const DI={sensor:'📡센서',actuator:'⚙️구동기',cultivation:'🌿재배',operation:'📋경영',sales:'🚚유통',data:'🗂️데이터'};
  doms.forEach((x,i)=>{ const [lx,ly]=pt(i,R+22); const a=Math.cos(ang(i));
    const anc=Math.abs(a)<0.3?'middle':(a>0?'start':'end');
    s+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" font-size="10" font-weight="700" fill="var(--text)" text-anchor="${anc}" dominant-baseline="middle">${DI[x.key]||x.name} ${x.score}</text>`; });
  document.getElementById('dgRadar').innerHTML=s;
  document.getElementById('dgRadarCard').style.display='block';
}
function _logDec(i){
  const p=_DECS[i]; if(!p||!window.RecordSheet) return;
  RecordSheet.open({ title:`진단 처방 기록 — ${p.title}`,
    fields:[{id:'detail',label:'조치 내용',type:'text',value:p.detail||'',placeholder:'실행한 조치를 적어주세요'}],
    submitLabel:'이행 기록 저장',
    onSubmit: async (v)=>{ await RecordSheet.logActivity(_farmG,_tokG,{kind:p.record,item:p.title,detail:v.detail||p.detail||'',value:null}); }
  });
}
window.addEventListener('DOMContentLoaded',()=>{
  _farmG=new URLSearchParams(location.search).get('farm')||sessionStorage.getItem('sf_farm_id')||'farm_001';
  _ensureToken().then(t=>{ _tokG=t; KaasaData.init({farmId:_farmG,token:t,onStatus:()=>{}}); _load(t); });
});
async function _ensureToken(){const s=sessionStorage.getItem('sf_token');if(s)return s;try{const a=sessionStorage.getItem('sf_api')||location.origin;const r=await fetch(`${a}/api/v1/auth/demo-token`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});if(r.ok){const d=await r.json();sessionStorage.setItem('sf_token',d.access_token);return d.access_token;}}catch{}return '';}
function onFarmChange(id){sessionStorage.setItem('sf_farm_id',id);location.reload();}

async function _loadTrend(token){
  try{
    const api=KaasaData.getApiBase();
    const h=await fetch(`${api}/api/farms/${_farmG}/diagnosis/history`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.ok?r.json():null).catch(()=>null);
    const snaps=(h.snapshots||[]).filter(s=>s.overall!=null);
    if(snaps.length<2) return;
    const box=document.getElementById('dgTrend'); box.style.display='block';
    const vals=snaps.map(s=>s.overall), W=300,Hh=60,pad=6;
    const mn=Math.min(...vals,40), mx=Math.max(...vals,100);
    const xs=i=>pad+(W-2*pad)*(snaps.length<2?0:i/(snaps.length-1));
    const ys=v=>Hh-pad-(Hh-2*pad)*((v-mn)/((mx-mn)||1));
    const pts=vals.map((v,i)=>`${xs(i).toFixed(1)},${ys(v).toFixed(1)}`).join(' ');
    const dots=vals.map((v,i)=>`<circle cx="${xs(i).toFixed(1)}" cy="${ys(v).toFixed(1)}" r="3" fill="var(--chart-cool)"/><text x="${xs(i).toFixed(1)}" y="${(ys(v)-6).toFixed(1)}" font-size="10" fill="var(--chart-cool)" text-anchor="middle" font-weight="700">${v}</text>`).join('');
    document.getElementById('dgSpark').innerHTML=`<polyline points="${pts}" fill="none" stroke="var(--chart-cool)" stroke-width="2"/>${dots}`;
    document.getElementById('dgTrendLabels').innerHTML=snaps.map(s=>`<span>${(s.date||'').slice(5)}</span>`).join('');
    const dl=h.latest_delta;
    const de=document.getElementById('dgDelta');
    if(dl!=null) de.innerHTML = dl>0?`<span style="color:var(--green)">▲ 전회比 +${dl}점</span>`:dl<0?`<span style="color:var(--red)">▼ 전회比 ${dl}점</span>`:`<span style="color:var(--muted)">전회比 ±0</span>`;
  }catch(e){}
}

// 데이터 품질 점검 — 입력 이상치(data_anomaly) 플래그 집계 → 진단 신호
async function _loadDataQuality(token){
  const el=document.getElementById('dataQuality'); if(!el) return;
  try{
    const api=KaasaData.getApiBase();
    const d=await fetch(`${api}/api/farms/${_farmG}/activity/summary`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.ok?r.json():null).catch(()=>null);
    const byKind=d.by_kind||{}; const recent=d.recent||[];
    const items=recent.filter(i=>i.kind==='data_anomaly');
    const n=byKind['data_anomaly'] || items.length;
    const manual=(byKind['env_manual']||0)+(byKind['irrigation']||0)+(byKind['env_setpoint']||0)
      || recent.filter(i=>['env_manual','irrigation','env_setpoint'].includes(i.kind)).length;
    const status = n===0 ? {ico:'🟢',txt:'양호',col:'var(--green-dark)'} : n<=2 ? {ico:'🟡',txt:'주의',col:'var(--orange)'} : {ico:'🔴',txt:'점검 필요',col:'var(--red)'};
    let html=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><span style="font-size:15px;">${status.ico}</span>`
      +`<b style="color:${status.col};font-size:13px;">입력 이상치 ${n}건 · ${status.txt}</b>`
      +`<span style="margin-left:auto;color:var(--muted);font-size:11px;">수동 입력 ${manual}건</span></div>`;
    if(n){ html+=items.slice(0,4).map(i=>`<div style="font-size:11.5px;color:var(--ink,#333);padding:3px 0;border-top:1px dashed var(--border);">⚠️ ${i.item||'이상치'} — ${(i.detail||'').slice(0,46)}</div>`).join('');
      html+=`<div style="font-size:11px;color:var(--muted);margin-top:6px;">정상 범위를 벗어난 입력이 반복되면 센서 점검·교정을 권장합니다.</div>`; }
    else { html+=`<div style="font-size:11.5px;color:var(--muted);">정상 범위를 벗어난 입력 이상치가 없습니다. 입력 데이터 품질 양호.</div>`; }
    el.innerHTML=html;
  }catch(e){ el.textContent='데이터 품질 정보를 불러올 수 없습니다.'; }
}

// 보유 기자재 평가 — 등록 장비의 종합등급 집계(C16 평가 요약과 동일 산식) → 진단 신호
async function _loadEquipGrade(token){
  const el=document.getElementById('equipGrade'); if(!el) return;
  try{
    const api=KaasaData.getApiBase();
    const d=await fetch(`${api}/api/farms/${_farmG}/equipment`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.ok?r.json():null).catch(()=>null);
    const items=(d.items||[]).filter(i=>i.grade);
    if(!items.length){ el.innerHTML='<span style="color:var(--muted);">평가된 기자재가 없습니다. <a href="c16_equipment.html" style="color:var(--blue);font-weight:700;">＋ 기자재 등록(C16)</a></span>'; return; }
    const GP={A:5,B:4,C:3,D:2,E:1}, PG={5:'A',4:'B',3:'C',2:'D',1:'E'};
    const GC={A:'#16a34a',B:'#65a30d',C:'#ca8a04',D:'#ea580c',E:'#dc2626'};
    const dist={A:0,B:0,C:0,D:0,E:0}; let sum=0;
    items.forEach(i=>{ dist[i.grade]++; sum+=GP[i.grade]; });
    const avgN=sum/items.length, avgG=PG[Math.round(avgN)]||'C';
    const weak=items.filter(i=>GP[i.grade]<=2).sort((a,b)=>GP[a.grade]-GP[b.grade]).slice(0,3);
    const bars=['A','B','C','D','E'].filter(g=>dist[g]).map(g=>{
      const w=Math.round(dist[g]/items.length*100);
      return `<div style="display:flex;align-items:center;gap:6px;font-size:11px;margin-top:3px;"><span style="width:13px;font-weight:800;color:${GC[g]};">${g}</span><div style="flex:1;background:var(--gray-soft);border-radius:5px;height:10px;overflow:hidden;"><div style="width:${w}%;height:100%;background:${GC[g]};"></div></div><span style="width:30px;text-align:right;color:var(--muted);">${dist[g]}대</span></div>`;
    }).join('');
    el.innerHTML=`<div style="display:flex;align-items:center;gap:10px;">
        <div style="text-align:center;"><div style="font-size:9px;color:var(--muted);font-weight:700;">평균</div><div style="font-size:24px;font-weight:900;color:${GC[avgG]};line-height:1;">${avgG}</div></div>
        <div style="flex:1;"><b style="font-size:13px;">평가완료 ${items.length}대 · 평균 ${avgN.toFixed(1)}/5</b><div style="margin-top:5px;">${bars}</div></div></div>
      ${weak.length?`<div style="margin-top:8px;border-top:1px dashed var(--border);padding-top:7px;font-size:11px;"><b style="color:var(--orange);">⚠ 교체·개선 우선순위</b> ${weak.map(i=>`<span style="color:#fff;background:${GC[i.grade]};border-radius:4px;padding:0 5px;font-weight:800;margin-left:4px;">${i.model_type||i.device_type||i.device_id} ${i.grade}</span>`).join('')}</div>`:''}`;
  }catch(e){ el.textContent='기자재 평가 정보를 불러올 수 없습니다.'; }
}

async function _load(token){
  const api=KaasaData.getApiBase();
  let d;
  try{ d=await fetch(`${api}/api/farms/${_farmG}/diagnosis`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.ok?r.json():null).catch(()=>null); }
  catch(e){ document.getElementById('dgGrade').textContent='진단 실패'; return; }
  document.getElementById('dgScore').textContent=d.overall_score;
  document.getElementById('dgGrade').textContent=`종합 ${d.grade} · ${d.tier} 등급`;
  _loadTrend(token);
  _loadDataQuality(token);
  _loadEquipGrade(token);
  const st=d.stats||{};
  document.getElementById('dgStats').innerHTML=`
    <div class="stat"><div class="stat-v">${st.devices||0}</div><div class="stat-l">등록 장비</div></div>
    <div class="stat"><div class="stat-v">${st.mapped_vars||0}</div><div class="stat-l">연동 표준변수</div></div>
    <div class="stat"><div class="stat-v">${st.month_activities||0}</div><div class="stat-l">이번달 이행</div></div>
    <div class="stat"><div class="stat-v">${st.calib_points||0}</div><div class="stat-l">캘리브 포인트</div></div>`;
  // ★ 현장컨설팅 6대 도메인 진단
  const DOM_ICO={sensor:'📡',actuator:'⚙️',cultivation:'🌿',operation:'📋',sales:'🚚',data:'🗂️'};
  const doms=d.domains||[];
  if(doms.length>=3) _drawRadar(doms);
  document.getElementById('dgDomains').innerHTML = doms.length ? doms.map(x=>`
    <div class="dom-card">
      <div class="dom-head"><span>${DOM_ICO[x.key]||'•'}</span><span class="dom-name">${x.name}</span>
        <span class="dom-chip ${x.status}">${x.status==='good'?'양호':x.status==='warn'?'주의':'개선'}</span>
        <span class="dom-score" style="color:${_col(x.score)}">${x.score}</span></div>
      <div class="dom-bar"><div style="height:100%;width:${x.score}%;background:${_col(x.score)};border-radius:4px;"></div></div>
      <div class="dom-find">${(x.findings||[]).map(f=>`· ${f}`).join('<br>')}</div>
    </div>`).join('') : '<div style="color:var(--muted);font-size:12px;text-align:center;padding:12px;">진단 데이터 없음</div>';
  // ★ 우선순위 처방 — 원탭 이동 + 이행기록(폐루프)
  const decs=d.priority_decisions||[];
  _DECS=decs;
  document.getElementById('dgDecisions').innerHTML = decs.length ? decs.map((p,i)=>`
    <div class="dec-card ${p.severity||'warn'}">
      <div class="dec-head"><span class="dec-title">${p.title}</span><span class="dec-sev ${p.severity||'warn'}">${p.severity==='danger'?'시급':p.severity==='info'?'권장':'주의'}</span></div>
      <div class="dec-dom">${p.domain} · 영역점수 ${p.domain_score}</div>
      <div class="dec-detail">${p.detail||''}</div>
      <div class="dec-btns">
        ${p.target?`<button class="dec-go" onclick="location.href='${p.target}'">조치하러 가기 →</button>`:''}
        ${p.record?`<button class="dec-log" onclick="_logDec(${i})">기록</button>`:''}
      </div>
    </div>`).join('') : '<div style="text-align:center;padding:16px;color:var(--green);font-size:13px;">✅ 우선 처방할 항목이 없습니다 — 6대 영역이 안정적입니다.</div>';

  document.getElementById('dgScores').innerHTML=Object.entries(d.scores).map(([k,v])=>`
    <div class="dg-bar-row"><span class="dg-bar-label">${k}</span>
      <div class="dg-bar-wrap"><div class="dg-bar-fill" style="width:${v}%;background:${_col(v)}"></div></div>
      <span class="dg-bar-val" style="color:${_col(v)}">${v}</span></div>`).join('');
  const recs=d.recommendations||[];
  document.getElementById('dgRecs').innerHTML = recs.length ? recs.map(r=>`
    <div class="rec-card p-${r.priority}">
      <div class="rec-head"><span class="rec-title">${r.title}</span><span class="rec-prio ${r.priority}">${r.priority}</span></div>
      <div class="rec-detail">${r.detail}</div>
      <div class="rec-meta"><span class="rec-tag">💡 ${r.roi}</span><span class="rec-tag" style="background:var(--gray-soft);color:var(--muted);">노력 ${r.effort}</span></div>
      ${r.target?`<button class="rec-btn" onclick="location.href='${r.target}'">개선하러 가기 →</button>`:''}
    </div>`).join('') : '<div style="text-align:center;padding:18px;color:var(--green);font-size:13px;">✅ 즉시 개선할 항목이 없습니다 — 시스템이 잘 운영되고 있습니다.</div>';
}
</script>
</body>
</html>
