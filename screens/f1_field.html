<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>F1 — 노지 홈 | KAASA SmartOS</title>
  <link rel="stylesheet" href="../components/base.css"/>
  <style>
    .fd-hero { background:linear-gradient(135deg,#365314 0%,#65a30d 100%); border-radius:var(--radius); padding:18px 20px; margin-bottom:14px; color:#fff; }
    .fd-hero-label { font-size:12px; opacity:.75; }
    .fd-hero-title { font-size:20px; font-weight:900; margin-top:2px; }
    .fd-hero-sub { font-size:13px; opacity:.85; margin-top:6px; }

    .fd-kpi-row { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
    .fd-kpi { background:var(--panel); border-radius:var(--radius-sm); padding:12px 10px; box-shadow:var(--shadow); text-align:center; }
    .fd-kpi-ico { font-size:18px; }
    .fd-kpi-val { font-size:18px; font-weight:900; margin:3px 0 1px; }
    .fd-kpi-label { font-size:10px; color:var(--muted); }

    /* 필지 지도 placeholder */
    .map-box { background:linear-gradient(135deg,#dcfce7,#bbf7d0); border-radius:var(--radius); height:200px; position:relative; overflow:hidden; box-shadow:var(--shadow); margin-bottom:6px; }
    .map-parcel { position:absolute; border:2px solid rgba(255,255,255,.7); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#14532d; cursor:pointer; }
    .map-legend { font-size:10px; color:var(--muted); text-align:center; margin-bottom:12px; }
    .map-mock-tag { position:absolute; top:8px; right:8px; background:rgba(0,0,0,.5); color:#fff; font-size:9px; padding:2px 6px; border-radius:6px; }

    .todo-list{display:flex;flex-direction:column;gap:8px;}
    .todo-item{display:flex;align-items:flex-start;gap:12px;background:var(--panel);border-radius:var(--radius-sm);padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;border:1.5px solid transparent;}
    .todo-item.done{opacity:.55;} .todo-item.done .todo-title{text-decoration:line-through;}
    .todo-item.urgent{border-color:var(--red);}
    .todo-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;margin-top:1px;}
    .todo-item.done .todo-check{background:var(--green);border-color:var(--green);color:#fff;}
    .todo-title{font-size:14px;font-weight:700;} .todo-desc{font-size:12px;color:var(--muted);margin-top:2px;}

    .sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .sub-card{background:var(--panel);border-radius:var(--radius-sm);padding:14px;box-shadow:var(--shadow);text-decoration:none;color:var(--text);border:1.5px solid var(--border);display:block;}
    .sub-card:active{transform:scale(.97);}
    .sub-ico{font-size:24px;} .sub-name{font-size:13px;font-weight:800;margin-top:6px;} .sub-desc{font-size:11px;color:var(--muted);margin-top:2px;}

    .ws-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;}
    .ws-dot.connected{background:var(--green);box-shadow:0 0 0 3px rgba(31,122,77,.2);}
  </style>
</head>
<body>

<header class="sf-header">
  <div style="display:flex;align-items:center;gap:6px;">
    <span class="ws-dot" id="wsDot"></span>
    <span style="font-size:12px;color:rgba(255,255,255,.8)" id="wsLabel">연결 중…</span>
  </div>
  <span style="font-size:15px;font-weight:800;color:#fff;letter-spacing:-.3px">F1 노지 홈</span>
  <select id="farmSel" onchange="onFarmChange(this.value)"
          style="font-size:12px;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:8px;padding:4px 8px;cursor:pointer;outline:none;">
    <option value="farm_001">farm_001</option>
  </select>
</header>

<main class="sf-main" style="padding:14px;max-width:480px;margin:0 auto;">

  <div class="fd-hero">
    <div class="fd-hero-label" id="fdDate">—</div>
    <div class="fd-hero-title">노지 현황</div>
    <div class="fd-hero-sub" id="fdSub">필지·토양수분·기상을 한눈에</div>
  </div>

  <div class="fd-kpi-row">
    <div class="fd-kpi"><div class="fd-kpi-ico">💧</div><div class="fd-kpi-val" id="kpiIrrNeed" style="color:var(--orange)">—</div><div class="fd-kpi-label">관개 필요 필지</div></div>
    <div class="fd-kpi"><div class="fd-kpi-ico">🌧️</div><div class="fd-kpi-val" id="kpiEt0" style="color:var(--blue)">—</div><div class="fd-kpi-label">ET₀ 증발산</div></div>
    <div class="fd-kpi"><div class="fd-kpi-ico">⚠️</div><div class="fd-kpi-val" id="kpiRisk" style="color:var(--green)">—</div><div class="fd-kpi-label">재해 위험</div></div>
  </div>

  <!-- 필지 지도 -->
  <div class="section-label">필지 지도</div>
  <div class="map-box" id="mapBox">
    <span class="map-mock-tag">지도 Mock</span>
  </div>
  <div class="map-legend">🟩 토양수분 충분 · 🟧 관개 필요 · 탭하여 필지 선택 (실측 센서 연동 시 자동 갱신)</div>

  <!-- 노지 할 일 -->
  <div class="section-label" style="display:flex;justify-content:space-between;">
    <span>노지 오늘 할 일</span><span id="todoProg" style="font-size:12px;color:var(--muted)">0/0</span>
  </div>
  <div class="todo-list" id="todoList"><div style="text-align:center;padding:14px;color:var(--muted);font-size:13px;">로드 중…</div></div>

  <!-- 노지 세부 화면 -->
  <div class="section-label" style="margin-top:16px;">노지 관리 화면</div>
  <div class="sub-grid">
    <a class="sub-card" href="f4_soil.html">
      <div class="sub-ico">💧</div><div class="sub-name">토양수분·관개</div><div class="sub-desc">ETc·관개 우선순위</div></a>
    <a class="sub-card" href="f2_gis.html">
      <div class="sub-ico">🗺️</div><div class="sub-name">필지 GIS</div><div class="sub-desc">필지 경계·구획</div></a>
    <a class="sub-card" href="f3_weather.html">
      <div class="sub-ico">🌦️</div><div class="sub-name">기상·재해</div><div class="sub-desc">7일 예보·작업시간</div></a>
    <a class="sub-card" href="f5_remote.html">
      <div class="sub-ico">🛰️</div><div class="sub-name">원격탐사</div><div class="sub-desc">NDVI·생육편차</div></a>
    <a class="sub-card" href="f6_pest.html">
      <div class="sub-ico">🐛</div><div class="sub-name">병해충·방제</div><div class="sub-desc">방제 윈도우</div></a>
    <a class="sub-card" href="f7_harvest.html">
      <div class="sub-ico">🚚</div><div class="sub-name">수확·유통</div><div class="sub-desc">필지별 수확·공동출하</div></a>
  </div>

</main>

<nav class="sf-bottom-nav">
  <button class="bnav-tab" onclick="location.href='c3_home.html'"><span class="bnav-icon">🏠</span>홈</button>
  <button class="bnav-tab" onclick="location.href='g1_home.html'"><span class="bnav-icon">🌱</span>온실</button>
  <button class="bnav-tab active"><span class="bnav-icon">🌾</span>노지</button>
  <button class="bnav-tab" onclick="location.href='c12_joint.html'"><span class="bnav-icon">🚚</span>출하</button>
  <button class="bnav-tab" onclick="location.href='../index.html'"><span class="bnav-icon">≡</span>메뉴</button>
</nav>

<script src="../components/data.js"></script>
<script>
'use strict';
let _todos=[];
// Mock 필지 (실측 센서 연동 시 교체) — 각 필지 토양수분%
const PARCELS=[
  {name:'1번 필지', x:6, y:12, w:42, h:38, moisture:62, status:'ok'},
  {name:'2번 필지', x:52, y:12, w:42, h:38, moisture:38, status:'low'},
  {name:'3번 필지', x:6, y:54, w:42, h:38, moisture:71, status:'ok'},
  {name:'4번 필지', x:52, y:54, w:42, h:38, moisture:45, status:'low'},
];

window.addEventListener('DOMContentLoaded', ()=>{
  const farmId=new URLSearchParams(location.search).get('farm')||sessionStorage.getItem('sf_farm_id')||'farm_001';
  _updateHero(); _renderMap(); _buildTodos();
  _ensureToken().then(token=>{ KaasaData.init({farmId,token,onStatus:_onWsStatus}); _loadWeather(token,farmId); });
});
function onFarmChange(id){ sessionStorage.setItem('sf_farm_id',id); location.reload(); }
async function _ensureToken(){
  const s=sessionStorage.getItem('sf_token'); if(s)return s;
  try{ const api=sessionStorage.getItem('sf_api')||location.origin;
    const r=await fetch(`${api}/api/v1/auth/token`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'admin',password:'1250'})});
    if(r.ok){const d=await r.json();sessionStorage.setItem('sf_token',d.access_token);return d.access_token;} }catch{} return '';
}
function _onWsStatus(s){const dot=document.getElementById('wsDot'),lbl=document.getElementById('wsLabel');if(dot)dot.className='ws-dot '+s;if(lbl)lbl.textContent=s==='connected'?'실시간 연결 중':s==='reconnecting'?'재연결 중…':'연결 안 됨';}

function _updateHero(){
  const now=new Date(),days=['일','월','화','수','목','금','토'];
  document.getElementById('fdDate').textContent=`${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일 (${days[now.getDay()]})`;
}

function _renderMap(){
  const box=document.getElementById('mapBox');
  const lowCount=PARCELS.filter(p=>p.status==='low').length;
  box.insertAdjacentHTML('beforeend', PARCELS.map(p=>`
    <div class="map-parcel" style="left:${p.x}%;top:${p.y}%;width:${p.w}%;height:${p.h}%;
      background:${p.status==='low'?'rgba(217,119,6,.55)':'rgba(34,197,94,.5)'};"
      onclick="alert('${p.name}: 토양수분 ${p.moisture}% (${p.status==='low'?'관개 필요':'충분'}) — Mock 데이터')">
      ${p.name}<br>${p.moisture}%</div>`).join(''));
  document.getElementById('kpiIrrNeed').textContent=`${lowCount}필지`;
}

async function _loadWeather(token, farmId){
  const api=KaasaData.getApiBase(), H={Authorization:`Bearer ${token}`};
  const wf=await fetch(`${api}/api/farms/${farmId}/environment/weather/forecast?days=7`,{headers:H}).then(r=>r.ok?r.json():null).catch(()=>null);
  if(wf){
    const et0=(wf.et0_forecast_mm||[])[0];
    const el=document.getElementById('kpiEt0');
    if(el&&et0!=null) el.textContent=`${Number(et0).toFixed(1)}mm`;
    document.getElementById('fdSub').textContent=`기상: ${wf.source||'KMA'} · ET₀ ${et0!=null?Number(et0).toFixed(1)+'mm':'—'}`;
  }
  // 재해 위험은 풍속/강우 기반 — 데이터 부족 시 정상
  document.getElementById('kpiRisk').textContent='낮음';
}

function _buildTodos(){
  const low=PARCELS.filter(p=>p.status==='low');
  const BASE=[
    {id:'f1',title:'관개 필요 필지 점검',desc:`${low.map(p=>p.name).join(', ')} — 토양수분 40% 미만`,urgent:low.length>0},
    {id:'f2',title:'기상 예보 확인',desc:'금주 강우·폭염·서리 예보 점검',urgent:false},
    {id:'f3',title:'필지 순회 점검',desc:'병해충·생육 이상 육안 확인',urgent:false},
  ];
  const key=`sf_f1todo_${new Date().toDateString()}`;
  const done=new Set(JSON.parse(localStorage.getItem(key)||'[]'));
  _todos=BASE.map(t=>({...t,done:done.has(t.id)})); _renderTodos();
}
function _renderTodos(){
  const dc=_todos.filter(t=>t.done).length;
  document.getElementById('todoProg').textContent=`${dc}/${_todos.length}`;
  document.getElementById('todoList').innerHTML=_todos.map(t=>`
    <div class="todo-item ${t.done?'done':''} ${t.urgent&&!t.done?'urgent':''}" onclick="_toggle('${t.id}')">
      <div class="todo-check">${t.done?'✓':''}</div>
      <div><div class="todo-title">${t.title}</div><div class="todo-desc">${t.desc}</div></div></div>`).join('');
}
function _toggle(id){const t=_todos.find(x=>x.id===id);if(!t)return;t.done=!t.done;
  const key=`sf_f1todo_${new Date().toDateString()}`;
  localStorage.setItem(key,JSON.stringify(_todos.filter(x=>x.done).map(x=>x.id)));_renderTodos();}
</script>
</body>
</html>
