<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>C0 — 회원가입 | KAASA smartfarmingsight</title>
  <link rel="stylesheet" href="../components/base.css"/>
  <style>
    body { padding-bottom: 84px; }
    .signup-body { padding:14px; max-width:480px; margin:0 auto; }
    .role-card { display:flex; align-items:center; gap:14px; padding:16px; border:2px solid var(--border); border-radius:var(--radius-sm); margin-bottom:10px; cursor:pointer; background:var(--panel); min-height:64px; }
    .role-card.sel { border-color:var(--green); background:var(--green-soft); }
    .role-ico { font-size:28px; flex-shrink:0; }
    .role-name { font-size:15px; font-weight:800; }
    .role-desc { font-size:12px; color:var(--muted); margin-top:2px; }
    .signup-label { font-size:13px; font-weight:700; margin:14px 0 6px; display:block; }
    .signup-input { width:100%; min-height:48px; padding:12px 14px; border:1.5px solid var(--border); border-radius:var(--radius-sm); font-size:15px; outline:none; }
    .signup-input:focus { border-color:var(--green); }
    .feat-chip-wrap { display:flex; flex-wrap:wrap; gap:8px; }
    .feat-chip { padding:10px 14px; border:1.5px solid var(--border); border-radius:20px; font-size:13px; cursor:pointer; background:var(--panel); min-height:40px; }
    .feat-chip.sel { border-color:var(--green); background:var(--green-soft); color:var(--green-dark); }
    .footer { position:fixed; bottom:0; left:0; right:0; background:var(--panel); border-top:1px solid var(--border); padding:12px 16px; max-width:480px; margin:0 auto; }
    .btn-submit { width:100%; min-height:48px; background:var(--green); color:#fff; border:none; border-radius:var(--radius-sm); font-size:15px; font-weight:800; cursor:pointer; }
  </style>
</head>
<body>

<header class="sf-header">
  <span style="font-size:13px;color:rgba(255,255,255,.85);cursor:pointer;" onclick="location.href='../index.html'">‹ 메뉴</span>
  <span style="font-size:15px;font-weight:800;color:#fff;">C0 회원가입</span>
  <span style="width:40px;"></span>
</header>

<main class="signup-body">
  <!-- 로그인 / 회원가입 전환 탭 -->
  <div style="display:flex;gap:8px;margin-bottom:14px;background:var(--panel-soft,#f1f5f3);border-radius:12px;padding:4px;">
    <button id="tabLogin"  onclick="_setMode('login')"  style="flex:1;min-height:42px;border:none;border-radius:9px;font-size:14px;font-weight:800;cursor:pointer;background:transparent;color:var(--muted);">로그인</button>
    <button id="tabSignup" onclick="_setMode('signup')" style="flex:1;min-height:42px;border:none;border-radius:9px;font-size:14px;font-weight:800;cursor:pointer;background:var(--green);color:#fff;">회원가입</button>
  </div>

  <!-- 로그인 패널 -->
  <div id="loginPane" style="display:none;">
    <div class="section-label">로그인</div>
    <label class="signup-label">아이디</label>
    <input class="signup-input" id="lUser" placeholder="아이디" autocomplete="username"/>
    <label class="signup-label">비밀번호</label>
    <input class="signup-input" id="lPass" type="password" placeholder="비밀번호" autocomplete="current-password" onkeydown="if(event.key==='Enter')_login()"/>
    <div id="loginResult" style="margin-top:12px;font-size:13px;text-align:center;font-weight:700;min-height:18px;"></div>
    <div style="text-align:center;margin-top:14px;font-size:12px;color:var(--muted);">
      <a href="javascript:void(0)" onclick="_forgot()" style="color:var(--blue);font-weight:800;">비밀번호 찾기</a>
      <span style="margin:0 8px;opacity:.4;">|</span>
      처음이신가요? <a href="javascript:void(0)" onclick="_setMode('signup')" style="color:var(--green-dark,#15803d);font-weight:800;">회원가입</a>
    </div>
    <div id="forgotBox" style="display:none;margin-top:14px;padding:14px;background:var(--blue-soft);border-radius:12px;">
      <div style="font-size:13px;font-weight:800;margin-bottom:8px;">🔑 비밀번호 재설정</div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">가입한 이메일을 입력하면 재설정 링크를 보내드립니다.</div>
      <input class="signup-input" id="fgEmail" type="email" inputmode="email" placeholder="가입 이메일"/>
      <div id="forgotResult" style="margin-top:8px;font-size:12px;font-weight:700;"></div>
      <button class="btn-submit" style="margin-top:10px;min-height:44px;" onclick="_sendForgot()">재설정 링크 받기</button>
    </div>
  </div>

  <!-- 회원가입 패널 -->
  <div id="signupPane">
  <div class="section-label">회원 유형</div>
  <div id="roleList"></div>

  <div class="section-label" style="margin-top:14px;">계정 정보</div>
  <label class="signup-label">아이디</label>
  <input class="signup-input" id="fUser" placeholder="3자 이상"/>
  <label class="signup-label">비밀번호</label>
  <input class="signup-input" id="fPass" type="password" placeholder="4자 이상"/>
  <label class="signup-label">이름</label>
  <input class="signup-input" id="fName" placeholder="성명"/>
  <label class="signup-label">이메일 <span style="color:var(--red)">*</span></label>
  <input class="signup-input" id="fEmail" type="email" inputmode="email" placeholder="example@farm.kr"/>
  <label class="signup-label">전화번호 <span style="color:var(--red)">*</span></label>
  <input class="signup-input" id="fPhone" type="tel" inputmode="tel" placeholder="010-1234-5678" maxlength="13"/>

  <div class="section-label" style="margin-top:14px;">관심 기능 (복수 선택)</div>
  <div class="feat-chip-wrap" id="featChips"></div>
  <div id="featEtcBox" style="display:none;margin-top:8px;">
    <input class="signup-input" id="fFeatEtc" placeholder="기타 관심 기능 직접 입력(쉼표로 여러 개)" oninput="_etcFeat(this.value)"/>
  </div>
  </div>
</main>

<div class="footer">
  <div id="signupResult" style="margin-bottom:10px;font-size:13px;text-align:center;font-weight:700;"></div>
  <button class="btn-submit" id="btnSignup" onclick="_submit()">가입하고 시작하기</button>
  <button class="btn-submit" id="btnLogin" style="display:none;" onclick="_login()">로그인</button>
</div>

<script src="../components/data.js"></script>
<script>
'use strict';
const ROLES=[
  ['farmer','👨‍🌾','농가','온실·노지 직접 재배'],
  ['org','🏢','생산자 조직','공동출하·조합 운영'],
  ['distributor','🚚','유통전문가','산지 소싱·공동출하·시세 분석'],
  ['expert','🔬','재배 전문가','컨설팅·기술 지원'],
  ['public','🏛️','공공기관','정책·통계 활용'],
];
const FEATS=['환경제어','관수관리','생육예측','병해진단','수익분석','공동출하','시세분석','산지소싱','벤치마킹','AI추천'];
let _role='', _feats=[];

window.addEventListener('DOMContentLoaded', ()=>{
  document.getElementById('roleList').innerHTML=ROLES.map(([id,ic,n,d])=>`
    <div class="role-card" onclick="_selRole('${id}',this)"><span class="role-ico">${ic}</span>
      <div><div class="role-name">${n}</div><div class="role-desc">${d}</div></div></div>`).join('');
  document.getElementById('featChips').innerHTML=FEATS.map(f=>`<div class="feat-chip" onclick="_toggleFeat('${f}',this)">${f}</div>`).join('')
    +`<div class="feat-chip" id="featEtcChip" onclick="_toggleEtc(this)">＋ 기타(직접입력)</div>`;
  // 재방문(이전 가입 흔적)·로그아웃·?mode=login 이면 로그인 모드 기본 표시
  const qp=new URLSearchParams(location.search);
  const returning = qp.get('mode')==='login' || localStorage.getItem('sf_signup_name') || localStorage.getItem('sf_signup_role');
  _setMode(returning ? 'login' : 'signup');
});
function _selRole(id,el){_role=id;document.querySelectorAll('.role-card').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');}

// 로그인 / 회원가입 모드 전환
function _setMode(m){
  const login=m==='login';
  document.getElementById('loginPane').style.display = login?'':'none';
  document.getElementById('signupPane').style.display = login?'none':'';
  document.getElementById('btnLogin').style.display = login?'':'none';
  document.getElementById('btnSignup').style.display = login?'none':'';
  document.getElementById('signupResult').textContent='';
  const tl=document.getElementById('tabLogin'), ts=document.getElementById('tabSignup');
  tl.style.background = login?'var(--green)':'transparent'; tl.style.color = login?'#fff':'var(--muted)';
  ts.style.background = login?'transparent':'var(--green)'; ts.style.color = login?'var(--muted)':'#fff';
}

// 로그인 — 데모 공개모드에서도 /api/v1/auth/token 은 허용(실제 인증)
async function _login(){
  const user=document.getElementById('lUser').value.trim();
  const pass=document.getElementById('lPass').value;
  const res=document.getElementById('loginResult');
  if(!user){res.style.color='var(--red)';res.textContent='아이디를 입력하세요';return;}
  if(!pass){res.style.color='var(--red)';res.textContent='비밀번호를 입력하세요';return;}
  res.style.color='var(--muted)';res.textContent='로그인 중…';
  try{
    const api=sessionStorage.getItem('sf_api')||location.origin;
    const r=await fetch(`${api}/api/v1/auth/token`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:user,password:pass})});
    if(r.ok){
      const d=await r.json();
      if(d.access_token) sessionStorage.setItem('sf_token',d.access_token);
      res.style.color='var(--green)';res.textContent='✓ 로그인 완료! 이동합니다…';
      setTimeout(()=>location.href='c3_home.html',900);
    } else if(r.status===401){
      res.style.color='var(--red)';res.textContent='아이디 또는 비밀번호가 올바르지 않습니다';
    } else {
      const t=await r.text();
      res.style.color='var(--orange)';res.textContent=`로그인 응답 ${r.status}: ${t.slice(0,50)}`;
    }
  }catch(e){ res.style.color='var(--red)';res.textContent='네트워크 오류: '+e.message; }
}
// 비밀번호 찾기 — 박스 토글
function _forgot(){
  const b=document.getElementById('forgotBox');
  b.style.display = b.style.display==='none' ? 'block' : 'none';
  if(b.style.display==='block'){
    const lv=document.getElementById('lUser').value.trim();
    // 로그인칸이 이메일 형태면 미리 채움
    if(/@/.test(lv)) document.getElementById('fgEmail').value=lv;
    document.getElementById('fgEmail').focus();
  }
}
async function _sendForgot(){
  const email=document.getElementById('fgEmail').value.trim();
  const res=document.getElementById('forgotResult');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){res.style.color='var(--red)';res.textContent='올바른 이메일을 입력하세요';return;}
  res.style.color='var(--muted)';res.textContent='요청 중…';
  try{
    const api=sessionStorage.getItem('sf_api')||location.origin;
    const r=await fetch(`${api}/api/v1/auth/password/forgot`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:email})});
    const d=await r.json().catch(()=>({}));
    if(d.demo_reset_link){
      // 이메일 미설정(데모): 링크 직접 안내
      res.style.color='var(--blue)';
      res.innerHTML=`✓ ${d.detail||'요청 접수'}<br><a href="${d.demo_reset_link}" style="color:var(--blue);font-weight:800;text-decoration:underline;">▶ 비밀번호 재설정하기</a><br><span style="font-size:10px;color:var(--muted);">(이메일 서버 미설정 데모 — 운영 시 메일 자동 발송)</span>`;
    } else {
      res.style.color='var(--green)';res.textContent='✓ '+(d.detail||'등록된 이메일로 재설정 안내를 보냈습니다.');
    }
  }catch(e){ res.style.color='var(--red)';res.textContent='네트워크 오류: '+e.message; }
}

// 역할별 가입 후 첫 화면 (농가=농장세팅 / 유통=공동출하 / 전문가=AI진단 / 공공=클러스터관제)
const _LAND={farmer:['c1_setup.html','농장 세팅'], org:['c1_setup.html','농장 세팅'],
  distributor:['c12_joint.html','공동출하·산지소싱'], expert:['c4_diagnosis.html','AI 진단·컨설팅'],
  public:['c20_cluster_admin.html','다중농가 관제']};
function _landing(){ return (_LAND[_role]||_LAND.farmer)[0]; }
function _landingLabel(){ return (_LAND[_role]||_LAND.farmer)[1]; }
function _toggleFeat(f,el){const i=_feats.indexOf(f);if(i>=0){_feats.splice(i,1);el.classList.remove('sel');}else{_feats.push(f);el.classList.add('sel');}}
let _etcFeats=[];
function _toggleEtc(el){ const box=document.getElementById('featEtcBox'); const on=box.style.display==='none'; box.style.display=on?'block':'none'; el.classList.toggle('sel',on); if(on) document.getElementById('fFeatEtc').focus(); else { _etcFeat(''); document.getElementById('fFeatEtc').value=''; } }
function _etcFeat(v){ // 직접입력 기능을 _feats에서 교체(쉼표 분리)
  _feats=_feats.filter(f=>!_etcFeats.includes(f));
  _etcFeats=v.split(',').map(s=>s.trim()).filter(Boolean);
  _etcFeats.forEach(f=>{ if(!_feats.includes(f)) _feats.push(f); });
}

const _EMAIL_RE=/^[^@\s]+@[^@\s]+\.[^@\s]+$/;
const _PHONE_RE=/^0\d{1,2}-?\d{3,4}-?\d{4}$/;
// 전화번호 입력 시 자동 하이픈
window.addEventListener('DOMContentLoaded',()=>{
  const ph=document.getElementById('fPhone');
  if(ph) ph.addEventListener('input',e=>{
    let v=e.target.value.replace(/[^0-9]/g,'').slice(0,11);
    if(v.length>=11) v=v.replace(/(\d{3})(\d{4})(\d{4})/,'$1-$2-$3');
    else if(v.length>=7) v=v.replace(/(\d{3})(\d{3,4})(\d{0,4})/,'$1-$2-$3').replace(/-$/,'');
    else if(v.length>=4) v=v.replace(/(\d{3})(\d{0,4})/,'$1-$2').replace(/-$/,'');
    e.target.value=v;
  });
});

async function _submit(){
  const user=document.getElementById('fUser').value.trim();
  const pass=document.getElementById('fPass').value;
  const name=document.getElementById('fName').value.trim();
  const email=document.getElementById('fEmail').value.trim();
  const phone=document.getElementById('fPhone').value.trim();
  const res=document.getElementById('signupResult');
  if(!_role){res.style.color='var(--red)';res.textContent='회원 유형을 선택하세요';return;}
  if(user.length<3){res.style.color='var(--red)';res.textContent='아이디는 3자 이상';return;}
  if(pass.length<4){res.style.color='var(--red)';res.textContent='비밀번호는 4자 이상';return;}
  if(!_EMAIL_RE.test(email)){res.style.color='var(--red)';res.textContent='올바른 이메일을 입력하세요 (필수)';return;}
  if(!_PHONE_RE.test(phone)){res.style.color='var(--red)';res.textContent='올바른 전화번호를 입력하세요 (예: 010-1234-5678)';return;}
  res.style.color='var(--muted)';res.textContent='가입 처리 중…';
  try{
    const api=sessionStorage.getItem('sf_api')||location.origin;
    const r=await fetch(`${api}/api/v1/auth/register`,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:user,password:pass,name:name,email:email,phone:phone,role:_role})});
    if(r.ok){
      const d=await r.json();
      if(d.access_token) sessionStorage.setItem('sf_token',d.access_token);
      res.style.color='var(--green)';res.innerHTML=`✓ 가입 완료! ${_landingLabel()}(으)로 이동합니다…`;
      localStorage.setItem('sf_signup_feats',JSON.stringify(_feats));
      setTimeout(()=>location.href=_landing(),1500);
    } else if(r.status===403){
      // 공개 데모(읽기 전용): 실제 계정 생성은 막혀있으나 체험은 끊김없이 진행
      if(name) localStorage.setItem('sf_signup_name', name);
      localStorage.setItem('sf_signup_role', _role);
      localStorage.setItem('sf_signup_feats',JSON.stringify(_feats));
      res.style.color='var(--green)';
      res.innerHTML=`✓ ${name||'농가'}님, 환영합니다! 데모 체험 모드로 <b>${_landingLabel()}</b> 시작합니다…<br><span style="font-size:11px;color:var(--muted);">(공개 데모라 실제 계정 생성은 생략 — 모든 기능은 체험 가능)</span>`;
      setTimeout(()=>location.href=_landing(),1800);
    } else {
      const t=await r.text();
      res.style.color='var(--orange)';res.textContent=`가입 응답 ${r.status}: ${t.slice(0,60)}`;
    }
  }catch(e){ res.style.color='var(--red)';res.textContent='네트워크 오류: '+e.message; }
}
</script>
</body>
</html>
