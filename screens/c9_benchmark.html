<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>C9 벤치마킹 | KAASA smartfarmingsight</title>
<link rel="stylesheet" href="../components/base.css"/>
<style>
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.kpi{background:var(--panel);border-radius:var(--radius-sm);padding:14px;box-shadow:var(--shadow);}
.kpi-l{font-size:11px;color:var(--muted);font-weight:600;}.kpi-v{font-size:22px;font-weight:900;margin:4px 0 1px;}.kpi-s{font-size:11px;color:var(--muted);}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.row:last-child{border-bottom:none;}
.row-ico{font-size:20px;}.row-t{flex:1;font-size:13px;font-weight:700;}.row-s{font-size:11px;color:var(--muted);margin-top:1px;}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;}
.bar-wrap{height:8px;background:var(--gray-soft);border-radius:4px;overflow:hidden;margin-top:6px;}
.bar-fill{height:100%;border-radius:4px;}
.mock-note{font-size:10px;color:var(--muted);background:var(--panel-soft);border-radius:8px;padding:8px 10px;margin-bottom:12px;}
.flow-step{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
.flow-step:last-child{border-bottom:none;}
.flow-num{width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;flex-shrink:0;}
.mod-card{background:var(--panel);border-radius:var(--radius-sm);padding:14px;box-shadow:var(--shadow);text-decoration:none;color:var(--text);border:1.5px solid var(--border);display:block;margin-bottom:8px;}
</style></head>
<body>
<header class="sf-header">
  <span style="font-size:13px;color:rgba(255,255,255,.85);cursor:pointer;" onclick="location.href='../index.html'">‹ 메뉴</span>
  <span style="font-size:15px;font-weight:800;color:#fff;">C9 벤치마킹</span><span style="width:40px;"></span>
</header>
<main class="sf-main" style="padding:14px;max-width:480px;margin:0 auto;">

<div class="strat-band" data-cur="c9" style="display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;"></div>

<div class="mock-note" id="bmNote">벤치마킹 비교군: RDA 표준·우수농가 기준 <span class="trust-badge trust-model">🔵 기준대비</span></div>
<div class="section-label">우수농가 대비 비교</div>
<div class="card" style="padding:14px;" id="bmCard"><div style="text-align:center;color:var(--muted);font-size:12px;padding:10px;">불러오는 중…</div></div>
<div class="section-label" style="margin-top:14px;">개선 포인트</div>
<div class="card" style="padding:14px;border-left:4px solid var(--orange);" id="bmAdvice"></div>
<div style="margin-top:14px;"><button style="width:100%;padding:14px;background:var(--green);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:800;cursor:pointer;" onclick="location.href='c14_report.html'">📄 월간 리포트에서 상세 보기 →</button></div>
</main>
<nav class="sf-bottom-nav">
  <button class="bnav-tab" onclick="location.href='c3_home.html'"><span class="bnav-icon">🏠</span>홈</button>
  <button class="bnav-tab" onclick="location.href='g1_home.html'"><span class="bnav-icon">🌱</span>온실</button>
  <button class="bnav-tab" onclick="location.href='f1_field.html'"><span class="bnav-icon">🌾</span>노지</button>
  <button class="bnav-tab" onclick="location.href='c12_joint.html'"><span class="bnav-icon">🚚</span>출하</button>
  <button class="bnav-tab active"><span class="bnav-icon">≡</span>메뉴</button>
</nav>
<script src="../components/data.js"></script>
<script>
'use strict';
const _color=s=>s==='good'?'var(--green)':s==='warn'?'var(--orange)':'var(--red)';
window.addEventListener('DOMContentLoaded',()=>{
  const farmId=new URLSearchParams(location.search).get('farm')||sessionStorage.getItem('sf_farm_id')||'farm_001';
  _ensureToken().then(t=>{ KaasaData.init&&KaasaData.init({farmId,token:t,onStatus:()=>{}}); _load(t,farmId); });
});
async function _ensureToken(){const s=sessionStorage.getItem('sf_token');if(s)return s;try{const a=sessionStorage.getItem('sf_api')||location.origin;const r=await fetch(`${a}/api/v1/auth/token`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'admin',password:'1250'})});if(r.ok){const d=await r.json();sessionStorage.setItem('sf_token',d.access_token);return d.access_token;}}catch{}return '';}
function onFarmChange(id){sessionStorage.setItem('sf_farm_id',id);location.reload();}
async function _load(token,farmId){
  const api=KaasaData.getApiBase?KaasaData.getApiBase():location.origin;
  let d; try{ d=await fetch(`${api}/api/farms/${farmId}/benchmark`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>r.json()); }
  catch(e){ document.getElementById('bmCard').innerHTML='<div style="color:var(--muted);font-size:12px;">벤치마킹 데이터를 불러오지 못했습니다.</div>'; return; }
  document.getElementById('bmCard').innerHTML=(d.metrics||[]).map((m,i)=>`
    <div style="font-size:12px;font-weight:700;${i?'margin-top:12px;':''}">${m.key}
      <span style="float:right;color:${_color(m.status)}">내 ${m.mine}${m.unit} / 상위 ${m.top}${m.unit}</span></div>
    <div class="bar-wrap"><div class="bar-fill" style="width:${m.pct}%;background:${_color(m.status)}"></div></div>`).join('');
  document.getElementById('bmAdvice').innerHTML=`
    <div style="font-size:13px;font-weight:800;">⚡ ${d.weakest} 개선 여지</div>
    <div style="font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5;">${d.advice}</div>`;
}
</script>
</body></html>
